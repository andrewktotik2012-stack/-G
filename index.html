<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Mini-GTA ULTIMATE 3D v5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 8px 12px;
    color: #fff;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    text-shadow: 0 2px 6px #000;
    pointer-events: none;
    z-index: 10;
    font-weight: 600;
  }
  #hud .money { color: #4dff88; }
  #hud .wanted { color: #ff4444; }
  #hud .task {
    background: rgba(0,0,0,0.55);
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 400;
    max-width: 58vw;
    text-align: center;
    border-left: 3px solid #ffdd00;
  }
  #hud .stats {
    background: rgba(0,0,0,0.4);
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 400;
    margin-top: 3px;
  }

  .action-btn {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 800;
    font-size: 10px;
    z-index: 20;
    border: 3px solid #fff;
    letter-spacing: 0.3px;
    color: #000;
  }
  #action-btn { bottom: 25px; right: 18px; background: rgba(255, 220, 0, 0.9); box-shadow: 0 0 20px rgba(255, 220, 0, 0.7); }
  #shoot-btn { bottom: 25px; right: 95px; background: rgba(255, 80, 80, 0.9); box-shadow: 0 0 20px rgba(255, 80, 80, 0.7); color: #fff; }
  #grenade-btn { bottom: 25px; right: 172px; background: rgba(80, 200, 80, 0.9); box-shadow: 0 0 20px rgba(80, 200, 80, 0.7); color: #fff; }
  #race-btn { bottom: 100px; right: 18px; background: rgba(80, 200, 255, 0.9); box-shadow: 0 0 20px rgba(80, 200, 255, 0.7); }
  #heli-btn { bottom: 100px; right: 95px; background: rgba(180, 100, 255, 0.9); box-shadow: 0 0 20px rgba(180, 100, 255, 0.7); color: #fff; }
  #boat-btn { bottom: 100px; right: 172px; background: rgba(0, 150, 200, 0.9); box-shadow: 0 0 20px rgba(0, 150, 200, 0.7); color: #fff; }
  #shop-btn { bottom: 175px; right: 18px; background: rgba(255, 150, 50, 0.9); box-shadow: 0 0 20px rgba(255, 150, 50, 0.7); }
  #mission-btn { bottom: 175px; right: 95px; background: rgba(255, 220, 0, 0.9); box-shadow: 0 0 20px rgba(255, 220, 0, 0.7); }

  #heli-up-btn, #heli-down-btn {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: bold;
    z-index: 20;
    border: 3px solid #fff;
    color: #000;
    background: rgba(180, 100, 255, 0.9);
  }
  #heli-up-btn { bottom: 175px; right: 95px; }
  #heli-down-btn { bottom: 175px; right: 18px; }

  #joystick-zone {
    position: absolute;
    bottom: 0; left: 0;
    width: 50%; height: 50%;
    z-index: 15;
  }
  #joystick-base {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    display: none;
    pointer-events: none;
  }
  #joystick-knob {
    position: absolute;
    width: 55px; height: 55px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 0 15px rgba(255,255,255,0.7);
    display: none;
    pointer-events: none;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #4dff88;
    font-size: 20px;
    background: #000;
    z-index: 100;
    gap: 20px;
  }
  #loading .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(77,255,136,0.3);
    border-top-color: #4dff88;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #message {
    position: absolute;
    top: 22%; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    text-shadow: 0 0 15px #000;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 30;
    text-align: center;
    white-space: nowrap;
    padding: 8px 16px;
    background: rgba(0,0,0,0.5);
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.3);
  }

  #achievement {
    position: absolute;
    top: 18%; left: 50%;
    transform: translateX(-50%) scale(0);
    background: linear-gradient(135deg, #ffdd00, #ffaa00);
    color: #000;
    padding: 12px 25px;
    border-radius: 12px;
    font-weight: bold;
    font-size: 15px;
    z-index: 40;
    box-shadow: 0 0 30px rgba(255, 200, 0, 0.8);
    transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    pointer-events: none;
    text-align: center;
  }
  #achievement.show { transform: translateX(-50%) scale(1); }

  #minimap {
    position: absolute;
    top: 60px; right: 10px;
    width: 100px; height: 100px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.5);
    z-index: 12;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }

  #top-btns {
    position: absolute;
    top: 60px; left: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 20;
  }
  .top-btn {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
  }

  .modal {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.88);
    color: #fff;
    z-index: 50;
    text-align: center;
    padding: 20px;
  }
  .modal h1 { color: #ffdd00; font-size: 28px; margin-bottom: 15px; }
  .modal p { font-size: 15px; margin: 4px 0; color: #ccc; }
  .modal .big { font-size: 26px; color: #4dff88; font-weight: bold; margin: 12px 0; }
  .modal button {
    margin-top: 15px;
    padding: 12px 30px;
    font-size: 16px;
    background: #4dff88;
    color: #000;
    border: none;
    border-radius: 10px;
    font-weight: bold;
  }

  #shop-modal { background: rgba(0,20,40,0.95); }
  #shop-modal h1 { color: #ffaa00; }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 90%;
    max-width: 400px;
    padding: 12px 15px;
    margin: 6px 0;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .shop-item .info { text-align: left; flex: 1; }
  .shop-item .name { font-weight: bold; font-size: 15px; }
  .shop-item .desc { font-size: 11px; color: #aaa; }
  .shop-item button {
    margin: 0;
    padding: 8px 15px;
    font-size: 13px;
    background: #ffaa00;
    color: #000;
    border-radius: 8px;
    min-width: 70px;
  }
  .shop-item button:disabled {
    background: #555;
    color: #aaa;
  }

  #mission-modal { background: rgba(20,0,40,0.95); }
  #mission-modal h1 { color: #ff44ff; }
  .mission-item {
    width: 90%;
    max-width: 400px;
    padding: 12px 15px;
    margin: 6px 0;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
    text-align: left;
  }
  .mission-item .name { font-weight: bold; font-size: 15px; color: #ff88ff; }
  .mission-item .desc { font-size: 11px; color: #aaa; margin: 4px 0; }
  .mission-item .reward { font-size: 12px; color: #ffdd00; }
  .mission-item button {
    margin: 8px 0 0 0;
    padding: 6px 15px;
    font-size: 12px;
    background: #ff44ff;
    color: #fff;
    border-radius: 6px;
  }

  #hospital-modal { background: rgba(200,240,255,0.95); color: #003366; }
  #hospital-modal h1 { color: #004488; }
  #hospital-modal button { background: #0088cc; color: #fff; }

  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 36px; height: 36px;
    border: 2px solid rgba(255,80,80,0.8);
    border-radius: 50%;
    display: none;
    z-index: 11;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,80,80,0.8);
  }
  #crosshair::before { top: 50%; left: -8px; right: -8px; height: 2px; transform: translateY(-50%); }
  #crosshair::after { left: 50%; top: -8px; bottom: -8px; width: 2px; transform: translateX(-50%); }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Загружаем мега-город v5...</div>
</div>

<div id="hud" style="display:none">
  <div>
    💰 <span class="money" id="money">0</span>
    <br>
    ⭐ <span class="wanted" id="wanted" style="display:none">0</span>
    <div id="race-hud" style="display:none"></div>
    <div class="stats" id="stats-hud">👤0 🚗0 🏚️0</div>
  </div>
  <div>
    <div class="task" id="task">Найди жёлтую метку</div>
  </div>
</div>

<canvas id="minimap" width="200" height="200"></canvas>

<div id="top-btns">
  <div class="top-btn" id="reset-btn" style="display:none">↻</div>
  <div class="top-btn" id="repair-btn" style="display:none">🔧</div>
  <div class="top-btn" id="music-btn" style="display:none">🔊</div>
</div>

<div id="crosshair"></div>
<div id="achievement"></div>

<div id="joystick-zone" style="display:none">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="action-btn" class="action-btn">СЕСТЬ</div>
<div id="shoot-btn" class="action-btn">🔫</div>
<div id="grenade-btn" class="action-btn">💣</div>
<div id="race-btn" class="action-btn">🏁</div>
<div id="heli-btn" class="action-btn">🚁<br>СЕСТЬ</div>
<div id="boat-btn" class="action-btn">🚤<br>СЕСТЬ</div>
<div id="shop-btn" class="action-btn">🏪</div>
<div id="mission-btn" class="action-btn">📜</div>
<div id="heli-up-btn">⬆️</div>
<div id="heli-down-btn">⬇️</div>

<div id="message"></div>

<!-- Модалка Game Over -->
<div id="gameover-modal" class="modal">
  <h1 id="go-title">Игра окончена</h1>
  <p id="go-subtitle">Тебя поймала полиция!</p>
  <div class="big">💰 <span id="final-money">0</span></div>
  <p>Рекорд: <span id="best-money">0</span></p>
  <p id="stats-final"></p>
  <button onclick="resetGame()">Играть снова</button>
</div>

<!-- Магазин -->
<div id="shop-modal" class="modal">
  <h1>🏪 Магазин</h1>
  <p>💰 <span id="shop-money">0</span></p>
  <div id="shop-items"></div>
  <button onclick="closeShop()">Закрыть</button>
</div>

<!-- Миссии -->
<div id="mission-modal" class="modal">
  <h1>📜 Миссии</h1>
  <p>Выбери задание</p>
  <div id="mission-items"></div>
  <button onclick="closeMissions()">Закрыть</button>
</div>

<!-- Больница -->
<div id="hospital-modal" class="modal">
  <h1>🏥 Больница</h1>
  <p>Ты очнулся в больнице</p>
  <p>Штраф: -100 💰</p>
  <div class="big" style="color:#004488">💰 <span id="hospital-money">0</span></div>
  <button onclick="leaveHospital()">Выйти на улицу</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 80, 250);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ СВЕТ ============
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.4);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 250 });
scene.add(sun);

// ============ КОНСТАНТЫ ============
const CITY_SIZE = 300;
const RIVER_WIDTH = 20;
const RIVER_Y_START = -10;
const RIVER_Y_END = 10;
const BLOCK = 30;
const ROAD_WIDTH = 10;
const bridgeX = 0;
const bridgeWidth = 14;
const ISLAND_X = 130;
const ISLAND_Z = 0;
const ISLAND_R = 25;

// ============ ЗЕМЛЯ ============
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(600, 600),
  new THREE.MeshStandardMaterial({ color: 0x3a5a3a })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ============ ОСТРОВ ============
const island = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R, ISLAND_R, 1.5, 32),
  new THREE.MeshStandardMaterial({ color: 0xc2b280 })
);
island.position.set(ISLAND_X, 0.75, ISLAND_Z);
island.receiveShadow = true;
island.castShadow = true;
scene.add(island);

// Пальмы на острове
for (let i = 0; i < 6; i++) {
  const a = (Math.PI * 2 / 6) * i;
  const px = ISLAND_X + Math.cos(a) * (ISLAND_R - 6);
  const pz = ISLAND_Z + Math.sin(a) * (ISLAND_R - 6);
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.4, 0.6, 6, 8),
    new THREE.MeshStandardMaterial({ color: 0x8B4513 })
  );
  trunk.position.set(px, 3.75, pz);
  trunk.castShadow = true;
  scene.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.ConeGeometry(3, 2, 8),
    new THREE.MeshStandardMaterial({ color: 0x2d8a2d })
  );
  leaves.position.set(px, 7.5, pz);
  leaves.castShadow = true;
  scene.add(leaves);
}

// ============ ГОРЫ ============
for (let i = 0; i < 4; i++) {
  const mx = -100 + i * 25;
  const mz = -110;
  const mh = 20 + Math.random() * 20;
  const mountain = new THREE.Mesh(
    new THREE.ConeGeometry(15, mh, 8),
    new THREE.MeshStandardMaterial({ color: 0x666677, flatShading: true })
  );
  mountain.position.set(mx, mh / 2, mz);
  mountain.castShadow = true;
  scene.add(mountain);
  // Снежная вершина
  const snow = new THREE.Mesh(
    new THREE.ConeGeometry(6, mh * 0.3, 8),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  snow.position.set(mx, mh * 0.85, mz);
  scene.add(snow);
}

// ============ ЛЕС ============
for (let i = 0; i < 30; i++) {
  const tx = -140 + Math.random() * 50;
  const tz = 80 + Math.random() * 50;
  const tree = new THREE.Mesh(
    new THREE.ConeGeometry(2, 6 + Math.random() * 3, 6),
    new THREE.MeshStandardMaterial({ color: 0x1a5a1a })
  );
  tree.position.set(tx, 4, tz);
  tree.castShadow = true;
  scene.add(tree);
}

// ============ РЕКА ============
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(600, RIVER_WIDTH),
  new THREE.MeshStandardMaterial({
    color: 0x2a6aae, metalness: 0.7, roughness: 0.2, transparent: true, opacity: 0.85
  })
);
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.05, (RIVER_Y_START + RIVER_Y_END) / 2);
water.receiveShadow = true;
scene.add(water);

// ============ ГОРОД ============
const buildings = [];
const buildingHealth = new Map();
const BUILDING_COLORS = [0x8899aa, 0xaa9988, 0x778899, 0x998877, 0xaaaabb, 0x9a8a7a, 0x8a9a8a];
const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xffee88 });
const windowMaterialBlue = new THREE.MeshBasicMaterial({ color: 0x88ccff });

function makeBuilding(x, z, w, d, h) {
  const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1 })
  );
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const windows = [];
  const rows = Math.floor(h / 2.5);
  const cols = Math.floor(w / 2);
  for (let r = 1; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() > 0.55) {
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(0.7, 0.9),
          Math.random() > 0.5 ? windowMaterial : windowMaterialBlue
        );
        win.position.set(x - w / 2 + 1.2 + c * 2, r * 2.5, z + d / 2 + 0.02);
        scene.add(win);
        windows.push(win);
      }
    }
  }
  const data = { x, z, w, d, h, mesh, windows };
  buildings.push(data);
  buildingHealth.set(mesh, 3);
  mesh.userData.buildingData = data;
}

function isRiver(x, z) {
  return z > RIVER_Y_START - 2 && z < RIVER_Y_END + 2;
}

for (let bx = -CITY_SIZE / 2; bx < CITY_SIZE / 2; bx += BLOCK) {
  for (let bz = -CITY_SIZE / 2; bz < CITY_SIZE / 2; bz += BLOCK) {
    const qcx = bx + BLOCK / 2;
    const qcz = bz + BLOCK / 2;
    if (isRiver(qcx, qcz)) continue;
    if (Math.hypot(qcx - ISLAND_X, qcz - ISLAND_Z) < ISLAND_R + 5) continue;
    if (qcx < -100 && qcz > 60) continue; // лес
    if (qcx < -80 && qcz < -90) continue; // горы

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadH.rotation.x = -Math.PI / 2;
    roadH.position.set(bx + BLOCK / 2, 0.01, bz);
    scene.add(roadH);

    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadV.rotation.x = -Math.PI / 2;
    roadV.rotation.z = Math.PI / 2;
    roadV.position.set(bx, 0.01, bz + BLOCK / 2);
    scene.add(roadV);

    const qSize = BLOCK - ROAD_WIDTH;
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const w = 4 + Math.random() * 7;
      const d = 4 + Math.random() * 7;
      const h = 6 + Math.random() * 22;
      const ox = (Math.random() - 0.5) * (qSize - w - 1);
      const oz = (Math.random() - 0.5) * (qSize - d - 1);
      makeBuilding(qcx + ox, qcz + oz, w, d, h);
    }
  }
}

// ============ МОСТ ============
const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.4 });
const bridgeDeck = new THREE.Mesh(
  new THREE.BoxGeometry(bridgeWidth, 0.8, RIVER_WIDTH + 10), bridgeMat
);
bridgeDeck.position.set(bridgeX, 1, (RIVER_Y_START + RIVER_Y_END) / 2);
bridgeDeck.castShadow = true;
bridgeDeck.receiveShadow = true;
scene.add(bridgeDeck);

const railMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, metalness: 0.7 });
for (let side = -1; side <= 1; side += 2) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.2, RIVER_WIDTH + 10), railMat);
  rail.position.set(bridgeX + side * (bridgeWidth / 2 - 0.2), 2, (RIVER_Y_START + RIVER_Y_END) / 2);
  scene.add(rail);
}
for (let z = RIVER_Y_START - 3; z <= RIVER_Y_END + 3; z += 8) {
  for (let side = -1; side <= 1; side += 2) {
    const pillar = new THREE.Mesh(
      new THREE.BoxGeometry(1, 4, 1),
      new THREE.MeshStandardMaterial({ color: 0x666666 })
    );
    pillar.position.set(bridgeX + side * (bridgeWidth / 2 - 1), -1, z);
    scene.add(pillar);
  }
}

// ============ МОСТ НА ОСТРОВ ============
const islandBridge = new THREE.Mesh(
  new THREE.BoxGeometry(40, 1, 4),
  new THREE.MeshStandardMaterial({ color: 0x888888 })
);

function makeCar(x, z, typeName, angle = 0) {
  const type = CAR_TYPES.find(t => t.name === typeName) || CAR_TYPES[0];
  const g = new THREE.Group();
  const [sw, sh, sl] = type.size;

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(sw, sh, sl),
    new THREE.MeshStandardMaterial({ color: type.color, metalness: 0.6, roughness: 0.3 })
  );
  body.position.y = sh / 2 + 0.1;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(sw * 0.85, sh * 0.9, sl * 0.5),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.9, roughness: 0.1 })
  );
  cabin.position.set(0, sh + 0.3, -sl * 0.1);
  cabin.castShadow = true;
  g.add(cabin);

  const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 12);
  wGeo.rotateZ(Math.PI / 2);
  const wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-sw/2, 0.35, sl/2-0.8], [sw/2, 0.35, sl/2-0.8], [-sw/2, 0.35, -sl/2+0.8], [sw/2, 0.35, -sl/2+0.8]]
    .forEach(([px, py, pz]) => {
      const w = new THREE.Mesh(wGeo, wMat);
      w.position.set(px, py, pz);
      w.castShadow = true;
      g.add(w);
    });

  // Фары
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
  [[-sw/2+0.4], [sw/2-0.4]].forEach(([px]) => {
    const light = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
    light.position.set(px, sh/2, -sl/2 - 0.01);
    g.add(light);
  });

  // Передние фары-прожекторы
  const headlight = new THREE.SpotLight(0xffffaa, 0, 30, Math.PI / 6, 0.5, 1);
  headlight.position.set(0, sh/2, -sl/2);
  headlight.target.position.set(0, sh/2, -sl/2 - 10);
  g.add(headlight);
  g.add(headlight.target);
  g.userData.headlight = headlight;

  if (typeName === 'police') {
    const sirenR = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
    sirenR.position.set(-0.4, sh + 0.9, 0);
    g.add(sirenR);
    const sirenB = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
    sirenB.position.set(0.4, sh + 0.9, 0);
    g.add(sirenB);
    const beacon = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true, opacity: 0.8 })
    );
    beacon.position.set(0, sh + 3, 0);
    g.add(beacon);
    g.userData.beacon = beacon;
    const policeLight = new THREE.PointLight(0xff0000, 2, 15);
    policeLight.position.set(0, 2, 0);
    g.add(policeLight);
    g.userData.policeLight = policeLight;
    g.userData.sirenR = sirenR;
    g.userData.sirenB = sirenB;
  }

  g.position.set(x, 0, z);
  g.rotation.y = angle;
  g.userData.type = type;
  g.userData.isPolice = typeName === 'police';
  scene.add(g);
  cars.push(g);
  return g;
}

function isInsideBuilding(x, z, radius = 3) {
  for (const b of buildings) {
    if (x > b.x - b.w / 2 - radius && x < b.x + b.w / 2 + radius &&
        z > b.z - b.d / 2 - radius && z < b.z + b.d / 2 + radius) {
      return true;
    }
  }
  return false;
}

const types = ['sedan', 'sport', 'taxi', 'van', 'sedan', 'taxi'];
function randomRoadPos() {
  let x, z, angle;
  for (let attempts = 0; attempts < 30; attempts++) {
    if (Math.random() > 0.5) {
      x = (Math.random() - 0.5) * (CITY_SIZE - 20);
      z = Math.round((Math.random() - 0.5) * (CITY_SIZE / BLOCK)) * BLOCK;
      angle = Math.random() > 0.5 ? 0 : Math.PI;
    } else {
      x = Math.round((Math.random() - 0.5) * (CITY_SIZE / BLOCK)) * BLOCK;
      z = (Math.random() - 0.5) * (CITY_SIZE - 20);
      angle = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
    }
    if (!isRiver(x, z) && !isInsideBuilding(x, z, 2) && Math.hypot(x - ISLAND_X, z - ISLAND_Z) > ISLAND_R + 3) return { x, z, angle };
  }
  return { x: 0, z: 20, angle: 0 };
}

  }
}

  r.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.3, 0)).add(forward.clone().multiplyScalar(1));
  r.userData = {
    vx: forward.x * 40, vy: 0, vz: forward.z * 40, life: 3
  };
  scene.add(r);
  rockets.push(r);
  beep(200, 0.2, 'sawtooth', 0.15);
  showMessage('🚀 Ракета!', 600);
}

function throwGrenade() {
  if (drivingCar || flyingHeli || ridingBoat) return;
  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
  const g = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 8, 8),
    new THREE.MeshStandardMaterial({ color: 0x224422, metalness: 0.8 })
  );
  g.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.5, 0));
  g.userData = { vx: forward.x * 15, vy: 8, vz: forward.z * 15, fuse: 2.0 };
  scene.add(g);
  grenades.push(g);
  beep(400, 0.1, 'sine', 0.1);
  showMessage('💣 Граната!', 600);
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.position.x += r.userData.vx * dt;
    r.position.z += r.userData.vz * dt;
    r.userData.life -= dt;

    // След
    if (Math.random() < 0.5) {
      const trail = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 4, 4),
        new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.7 })
      );
      trail.position.copy(r.position);
      trail.userData = { vx: 0, vy: 0, vz: 0, life: 0.5 };
      scene.add(trail);
      particles.push(trail);
    }

    let hit = false;
    for (const car of cars) {
      if (car === drivingCar) continue;
      if (car.position.distanceTo(r.position) < 4) {
        explode(car.position.x, 1, car.position.z, 0xff4400, 30);
        scene.remove(car);
        cars.splice(cars.indexOf(car), 1);
        money += 100;
        wanted = Math.min(wanted + 1, 5);
        updateMoney();
        updateWanted();
        stats.cars++;
        updateStats();
        hit = true;
        break;
      }
    }
    if (!hit) {
      for (const b of buildings) {
        if (Math.hypot(b.x - r.position.x, b.z - r.position.z) < 5) {
          explode(r.position.x, 2, r.position.z, 0xff4400, 40);
          const hp = (buildingHealth.get(b.mesh) || 3) - 2;
          buildingHealth.set(b.mesh, hp);
          if (hp <= 0) {
            b.mesh.material.color.setHex(0x444444);
            b.mesh.scale.y *= 0.3;
            b.mesh.position.y = b.mesh.scale.y * 2;
            money += 200;
            stats.buildings++;
            updateStats();
            updateMoney();
          } else {
            b.mesh.material.color.multiplyScalar(0.6);
          }
          hit = true;
          break;
        }
      }
    }
    if (hit || r.userData.life <= 0) {
      scene.remove(r);
      rockets.splice(i, 1);
    }
  }
}

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.position.x += g.userData.vx * dt;
    g.position.y += g.userData.vy * dt;
    g.position.z += g.userData.vz * dt;
    g.userData.vy -= 20 * dt;
    g.rotation.x += dt * 5;
    g.rotation.z += dt * 3;
    if (g.position.y < 0.3) {
      g.position.y = 0.3;
      g.userData.vy *= -0.5;
      g.userData.vx *= 0.7;
      g.userData.vz *= 0.7;
    }
    g.userData.fuse -= dt;
    if (g.userData.fuse <= 0) {
      explode(g.position.x, g.position.y, g.position.z, 0xff4400, 40);
      explode(g.position.x, g.position.y, g.position.z, 0xffaa00, 20);
      beep(80, 0.4, 'sawtooth', 0.3);

      for (let j = cars.length - 1; j >= 0; j--) {
        const c = cars[j];
        if (c === drivingCar) continue;
        if (c.position.distanceTo(g.position) < 6) {
          explode(c.position.x, 1, c.position.z, 0xffaa00, 15);
          scene.remove(c);
          cars.splice(j, 1);
          money += 50;
          wanted = Math.min(wanted + 1, 5);
          stats.cars++;
        }
      }
      pedestrians.forEach(p => {
        if (!p.userData.alive) return;
        if (p.position.distanceTo(g.position) < 6) {
          p.userData.alive = false;
          p.visible = false;
          explode(p.position.x, 1, p.position.z, 0xcc0000, 10);
          wanted = Math.min(wanted + 1, 5);
          stats.peds++;
        }
      });
      buildings.forEach(b => {
        const hp = buildingHealth.get(b.mesh) || 3;
        if (Math.hypot(b.x - g.position.x, b.z - g.position.z) < 8) {
          buildingHealth.set(b.mesh, hp - 1);
          if (hp - 1 <= 0) {
            b.mesh.material.color.setHex(0x444444);
            b.mesh.scale.y *= 0.3;
            b.mesh.position.y = b.mesh.scale.y * 2;
            money += 200;
            stats.buildings++;
          } else {
            b.mesh.material.color.multiplyScalar(0.7);
          }
        }
      });
      updateMoney();
      updateWanted();
      updateStats();
      spawnFire(g.position.x, g.position.z);
      scene.remove(g);
      grenades.splice(i, 1);
    }
  }
}

function spawnFire(x, z) {
  const fire = { x, z, life: 5, particles: [] };
  for (let i = 0; i < 15; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.3 + Math.random() * 0.3, 6, 6),
      new THREE.MeshBasicMaterial({ color: Math.random() > 0.5 ? 0xff4400 : 0xff8800, transparent: true })
    );
    p.position.set(x + (Math.random() - 0.5) * 3, 0.5, z + (Math.random() - 0.5) * 3);
    p.userData = { vy: 2 + Math.random() * 2, life: 1 };
    scene.add(p);
    fire.particles.push(p);
  }
  fires.push(fire);
}

function updateFires(dt) {
  for (let i = fires.length - 1; i >= 0; i--) {
    const f = fires[i];
    f.life -= dt;
    f.particles.forEach(p => {
      p.position.y += p.userData.vy * dt;
      p.userData.life -= dt * 0.5;
      p.scale.setScalar(p.userData.life);
      p.material.opacity = p.userData.life;
      p.material.transparent = true;
    });
    if (f.life <= 0) {
      f.particles.forEach(p => scene.remove(p));
      fires.splice(i, 1);
    }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {

        wanted = Math.min(wanted + 1, 5);

      }
    }
    if (!hit) {
      for (const p of pedestrians) {

        if (pedCenter.distanceTo(b.position) < 1.2) {

          updateMoney();
          stats.peds++;
          updateStats();
          hit = true;
          break;
        }
      }
    }
    if (!hit) {
      for (const pc of policeCars) {
        if (pc === drivingCar) continue;
        if (pc.position.distanceTo(b.position) < 2.5) {
          explode(pc.position.x, 1, pc.position.z, 0xff0000, 20);
          scene.remove(pc);
          policeCars.splice(policeCars.indexOf(pc), 1);
          cars.splice(cars.indexOf(pc), 1);
          money += 100;
          updateMoney();
          wanted = Math.min(wanted + 1, 5);
          updateWanted();
          stats.cars++;
          updateStats();
          hit = true;
          break;
        }
      }
    }
    if (!hit) {
      for (const ph of policeHelis) {
        if (ph.position.distanceTo(b.position) < 3) {
          ph.userData.health = (ph.userData.health || 5) - 1;
          explode(b.position.x, b.position.y, b.position.z, 0xff8800, 10);
          if (ph.userData.health <= 0) {
            explode(ph.position.x, ph.position.y, ph.position.z, 0xff0000, 40);
            scene.remove(ph);
            policeHelis.splice(policeHelis.indexOf(ph), 1);

      bullets.splice(i, 1);
    }
  }
}

const particles = [];
function explode(x, y, z, color, count = 20) {
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 6, 6),
      new THREE.MeshBasicMaterial({ color })
    );
    p.position.set(x, y, z);
    p.userData = {
      vx: (Math.random() - 0.5) * 8, vy: Math.random() * 6 + 2, vz: (Math.random() - 0.5) * 8, life: 1
    };
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    p.userData.vy -= 15 * dt;
    p.userData.life -= dt * 1.5;
    p.scale.setScalar(Math.max(0, p.userData.life));
    p.material.opacity = Math.max(0, p.userData.life);
    p.material.transparent = true;
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicEnabled = true;
let musicInterval = null;

function beep(freq, dur = 0.1, type = 'sine', vol = 0.1) {
  if (!musicEnabled) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// Простая фоновая мелодия
const melodyNotes = [261.63, 329.63, 392.00, 329.63, 261.63, 392.00, 523.25, 392.00];
let melodyIndex = 0;
function startMusic() {
  if (musicInterval) return;
  musicInterval = setInterval(() => {
    if (!musicEnabled) return;
    if (wanted > 0) {
      // Тревожная музыка при погоне
      beep(150, 0.2, 'sawtooth', 0.05);
      beep(120, 0.2, 'sawtooth', 0.05);
    } else {
      // Спокойная мелодия
      beep(melodyNotes[melodyIndex], 0.3, 'triangle', 0.03);
      melodyIndex = (melodyIndex + 1) % melodyNotes.length;
    }
  }, 500);
}

const joystick = { active: false, startX: 0, startY: 0, x: 0, y: 0 };
const joystickZone = document.getElementById('joystick-zone');
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const MAX_DIST = 60;

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  joystick.active = true;
  joystick.startX = t.clientX;
  joystick.startY = t.clientY;
  joystickBase.style.display = 'block';
  joystickBase.style.left = (t.clientX - 60) + 'px';
  joystickBase.style.top = (t.clientY - 60) + 'px';
  joystickKnob.style.display = 'block';
  joystickKnob.style.left = (t.clientX - 27) + 'px';
  joystickKnob.style.top = (t.clientY - 27) + 'px';
}, { passive: false });
joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!joystick.active) return;
  const t = e.touches[0];
  let dx = t.clientX - joystick.startX;
  let dy = t.clientY - joystick.startY;
  const d = Math.hypot(dx, dy);
  if (d > MAX_DIST) { dx = dx / d * MAX_DIST; dy = dy / d * MAX_DIST; }
  joystick.x = dx / MAX_DIST;
  joystick.y = dy / MAX_DIST;
  joystickKnob.style.left = (joystick.startX + dx - 27) + 'px';
  joystickKnob.style.top = (joystick.startY + dy - 27) + 'px';
}, { passive: false });
joystickZone.addEventListener('touchend', e => {
  e.preventDefault();
  joystick.active = false;
  joystick.x = 0; joystick.y = 0;
  joystickBase.style.display = 'none';
  joystickKnob.style.display = 'none';
}, { passive: false });

function doAction() {
  if (drivingCar) {
    const pos = drivingCar.position;
    const side = new THREE.Vector3(Math.cos(drivingCar.rotation.y), 0, -Math.sin(drivingCar.rotation.y)).multiplyScalar(2.8);
    playerGroup.position.copy(pos).add(side);
    playerGroup.visible = true;
    drivingCar = null;
    carSpeed = 0;
    beep(400, 0.08);
    showMessage('Вышел из машины', 700);
  } else if (nearestCar) {
    drivingCar = nearestCar;
    playerGroup.visible = false;
    carSpeed = 0;
    beep(600, 0.1);
    showMessage(drivingCar.userData.isPolice ? '🚨 Угнал полицейскую!' : 'Сел в машину', 900);
    if (drivingCar.userData.isPolice && wanted === 0) {
      wanted = 2;
      updateWanted();
    }
  }
}

function doShoot() {
  if (flyingHeli || ridingBoat) return;
  if (drivingCar) {
    // Стрельба из машины (вбок)
    const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), drivingCar.rotation.y);
    const from = drivingCar.position.clone().add(new THREE.Vector3(0, 1.2, 0)).add(side.clone().multiplyScalar(1.5));
    shoot(from, side);
    return;
  }
  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
  const from = playerGroup.position.clone().add(new THREE.Vector3(0, 1.3, 0)).add(forward.clone().multiplyScalar(0.8));
  shoot(from, forward);
  gun.position.z -= 0.15;
  setTimeout(() => gun.position.z += 0.15, 80);
}

function doHeli() {

    if (!flyingHeli.userData.isCrashed) {
      flyingHeli.position.y = 0.8;
      flyingHeli.userData.grounded = true;
      playerGroup.position.set(flyingHeli.position.x + 3, 0, flyingHeli.position.z);
      playerGroup.visible = true;
      flyingHeli = null;
      showMessage('Приземлился', 800);
    }
    return;
  }
  if (nearestHeli && !nearestHeli.userData.crashed) {
    flyingHeli = nearestHeli;
    flyingHeli.position.y = 10;
    playerGroup.visible = false;
    showMessage('🚁 Взлетаем!', 900);
    beep(500, 0.2, 'sine', 0.1);

      completeMission('heli');

  }
}

function doBoat() {
  if (ridingBoat) {
    ridingBoat = null;
    const bx = boat.position.x;
    const bz = boat.position.z;
    if (Math.abs(bz - RIVER_Y_START) < Math.abs(bz - RIVER_Y_END)) {
      playerGroup.position.set(bx, 0, RIVER_Y_START - 2);
    } else {
      playerGroup.position.set(bx, 0, RIVER_Y_END + 2);
    }
    playerGroup.visible = true;
    boatSpeed = 0;
    showMessage('Вышел на берег', 800);
    return;
  }
  if (boat) {
    const d = Math.hypot(boat.position.x - playerGroup.position.x, boat.position.z - playerGroup.position.z);
    if (d < 10) {
      ridingBoat = boat;
      playerGroup.visible = false;
      boatSpeed = 0;
      showMessage('🚤 Сел в лодку', 900);
      beep(500, 0.15);
      if (activeMission && activeMission.id === 'boat') {
        completeMission('boat');
      }
    }
  }
}

function doRepair() {
  if (money < 50) { showMessage('❌ Нужно 50 💰', 1200); return; }
  let nearest = null;
  let minD = 15;
  buildings.forEach(b => {
    const hp = buildingHealth.get(b.mesh);
    if (hp !== undefined && hp < 3 && hp > 0) {
      const d = Math.hypot(b.x - playerGroup.position.x, b.z - playerGroup.position.z);
      if (d < minD) { minD = d; nearest = b; }
    }
  });
  if (nearest) {
    buildingHealth.set(nearest.mesh, 3);
    nearest.mesh.material.color.setHex(BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)]);
    money -= 50;
    updateMoney();
    explode(nearest.x, 1, nearest.z, 0x00ff00, 15);

    beep(1000, 0.15);
  } else {
    showMessage('❌ Нет повреждённых домов рядом', 1200);
  }
}

// ============ КОЛЛИЗИИ ============
function collideBuilding(pos, radius) {
  for (const b of buildings) {
    const hp = buildingHealth.get(b.mesh) || 0;
    if (hp <= 0) continue;
    const minX = b.x - b.w / 2 - radius;
    const maxX = b.x + b.w / 2 + radius;
    const minZ = b.z - b.d / 2 - radius;
    const maxZ = b.z + b.d / 2 + radius;
    if (pos.x > minX && pos.x < maxX && pos.z > minZ && pos.z < maxZ) {
      const ox = pos.x - b.x, oz = pos.z - b.z;
      if (Math.abs(ox) > Math.abs(oz)) pos.x = b.x + Math.sign(ox) * (b.w / 2 + radius);
      else pos.z = b.z + Math.sign(oz) * (b.d / 2 + radius);
      return true;
    }
  }
  return false;
}

function isOnBridge(x, z) {
  return (Math.abs(x - bridgeX) < bridgeWidth / 2 - 0.5 && z > RIVER_Y_START - 5 && z < RIVER_Y_END + 5) ||
         (Math.abs(z) < 2 && x > 40 && x < ISLAND_X);
}

function isInRiver(x, z) {
  if (!isRiver(x, z)) return false;
  if (isOnBridge(x, z)) return false;
  return true;
}

// ============ ОБНОВЛЕНИЯ ============
let walkCycle = 0;
let dustTimer = 0;

function updatePlayer(dt) {
  let dx = joystick.x, dz = joystick.y;
  if (keys['w'] || keys['ц']) dz = -1;
  if (keys['s'] || keys['ы']) dz = 1;
  if (keys['a'] || keys['ф']) dx = -1;
  if (keys['d'] || keys['в']) dx = 1;
  if (keys['arrowup']) dz = -1;
  if (keys['arrowdown']) dz = 1;
  if (keys['arrowleft']) dx = -1;
  if (keys['arrowright']) dx = 1;

  const len = Math.hypot(dx, dz);
  if (len > 0.1 && !drivingCar && !flyingHeli && !ridingBoat && !inHospital) {
    dx /= len; dz /= len;
    const newX = playerGroup.position.x + dx * 5 * dt;
    const newZ = playerGroup.position.z + dz * 5 * dt;
    if (!isInRiver(newX, newZ)) {
      playerGroup.position.x = newX;
      playerGroup.position.z = newZ;
    }
    collideBuilding(playerGroup.position, 0.5);
    playerGroup.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, playerGroup.position.x));
    playerGroup.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, playerGroup.position.z));
    playerGroup.rotation.y = Math.atan2(dx, dz);
    walkCycle += dt * 10;
    legs[0].rotation.x = Math.sin(walkCycle) * 0.6;
    legs[1].rotation.x = -Math.sin(walkCycle) * 0.6;
    arms[0].rotation.x = -Math.sin(walkCycle) * 0.4;
    arms[1].rotation.x = Math.sin(walkCycle) * 0.4;
  } else {
    legs[0].rotation.x *= 0.9;
    legs[1].rotation.x *= 0.9;
    arms[0].rotation.x *= 0.9;
    arms[1].rotation.x *= 0.9;
  }
}

function updateCar(dt) {
  if (!drivingCar) return;
  let throttle = 0, steer = 0;
  if (joystick.active) { throttle = -joystick.y; steer = joystick.x; }
  if (keys['w'] || keys['arrowup'] || keys['ц']) throttle = 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) throttle = -1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) steer = -1;
  if (keys['d'] || keys['arrowright'] || keys['в']) steer = 1;

  const maxSpeed = drivingCar.userData.type.speed;
  const accel = 14;

  if (throttle > 0) carSpeed += accel * dt;
  else if (throttle < 0) carSpeed -= accel * 1.5 * dt;
  else carSpeed *= 0.96;

  carSpeed = Math.max(-maxSpeed * 0.4, Math.min(maxSpeed, carSpeed));

  if (Math.abs(carSpeed) > 0.3) {
    drivingCar.rotation.y -= steer * 1.8 * dt * Math.sign(carSpeed);
  }

  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), drivingCar.rotation.y);
  const newX = drivingCar.position.x + forward.x * carSpeed * dt;
  const newZ = drivingCar.position.z + forward.z * carSpeed * dt;

  if (!isInRiver(newX, newZ)) {
    drivingCar.position.x = newX;
    drivingCar.position.z = newZ;
  } else {
    carSpeed *= -0.3;
    showMessage('🌊 Вода!', 1000);
  }

  const hit = collideBuilding(drivingCar.position, 1.5);
  drivingCar.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, drivingCar.position.x));
  drivingCar.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, drivingCar.position.z));

  if (hit && Math.abs(carSpeed) > 8) {
    explode(drivingCar.position.x, 1, drivingCar.position.z, 0xffaa00, 8);
    beep(120, 0.15, 'sawtooth', 0.2);
    carSpeed *= -0.3;
  } else if (hit) {
    carSpeed *= -0.5;
  }

  pedestrians.forEach(p => {
    if (!p.userData.alive) return;
    if (p.position.distanceTo(drivingCar.position) < 1.8 && Math.abs(carSpeed) > 5) {
      p.userData.alive = false;
      p.visible = false;
      explode(p.position.x, 1, p.position.z, 0xcc0000, 15);
      wanted = Math.min(wanted + 1, 5);
      updateWanted();
      stats.peds++;
      updateStats();
      if (activeMission && activeMission.id === 'kill5') {
        activeMission.progress++;
        if (activeMission.progress >= activeMission.target) completeMission('kill5');
      }
      beep(200, 0.2, 'sawtooth', 0.15);
    }
  });

  dustTimer += dt;
  if (Math.abs(carSpeed) > 5 && dustTimer > 0.1) {
    dustTimer = 0;
    const dust = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0x888877, transparent: true, opacity: 0.6 })
    );
    dust.position.copy(drivingCar.position).add(new THREE.Vector3(0, 0.3, 0));
    dust.userData = { vx: (Math.random() - 0.5) * 2, vy: Math.random() * 2, vz: (Math.random() - 0.5) * 2, life: 0.5 };
    scene.add(dust);
    particles.push(dust);
  }

  playerGroup.position.copy(drivingCar.position);
}

function updateBoat(dt) {
  if (!ridingBoat) return;
  let throttle = 0, steer = 0;
  if (joystick.active) { throttle = -joystick.y; steer = joystick.x; }
  if (keys['w'] || keys['arrowup']) throttle = 1;
  if (keys['s'] || keys['arrowdown']) throttle = -1;
  if (keys['a'] || keys['arrowleft']) steer = -1;
  if (keys['d'] || keys['arrowright']) steer = 1;

  const maxSpeed = 15;
  const accel = 10;
  if (throttle > 0) boatSpeed += accel * dt;
  else if (throttle < 0) boatSpeed -= accel * dt;
  else boatSpeed *= 0.95;
  boatSpeed = Math.max(-maxSpeed * 0.5, Math.min(maxSpeed, boatSpeed));

  if (Math.abs(boatSpeed) > 0.3) {
    boat.rotation.y -= steer * 1.5 * dt * Math.sign(boatSpeed);
  }

  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), boat.rotation.y);
  const newX = boat.position.x + forward.x * boatSpeed * dt;
  const newZ = boat.position.z + forward.z * boatSpeed * dt;

  if (!isRiver(newX, newZ) || isOnBridge(newX, newZ)) {
    boatSpeed *= -0.3;
    showMessage('Лодка только по реке', 800);
  } else {
    boat.position.x = newX;
    boat.position.z = newZ;
    boat.position.y = 0.3 + Math.sin(performance.now() * 0.002) * 0.05;
  }

  boat.rotation.z = Math.sin(performance.now() * 0.002) * 0.03;
  playerGroup.position.copy(boat.position);
  playerGroup.position.y = 0;
}

// ============ ВЕРТОЛЁТ ============
function updateHeli(dt) {
  if (!flyingHeli) {
    helis.forEach(h => {
      h.userData.rotor.rotation.y += dt * 5;
      h.userData.tailRotor.rotation.z += dt * 8;
    });
    return;
  }
  const hp = heliHealth.get(flyingHeli) || 5;
  if (hp <= 2 && !flyingHeli.userData.isCrashed) {
    if (Math.random() < 0.5) {
      const smoke = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.6 })
      );
      smoke.position.copy(flyingHeli.position);
      smoke.userData = { vx: 0, vy: 1, vz: 0, life: 1 };
      scene.add(smoke);
      particles.push(smoke);
    }
  }

  if (flyingHeli.userData.isCrashed) {
    flyingHeli.position.y -= 15 * dt;
    flyingHeli.rotation.z += dt * 3;
    if (flyingHeli.position.y <= 0.5) {
      flyingHeli.position.y = 0.5;
      flyingHeli.userData.isCrashed = false;
      flyingHeli.userData.crashed = true;
      flyingHeli.visible = false;
      spawnFire(flyingHeli.position.x, flyingHeli.position.z);
      playerGroup.position.set(flyingHeli.position.x + 3, 0, flyingHeli.position.z);
      playerGroup.visible = true;
      flyingHeli = null;
      goToHospital('🚁 Вертолёт разбился!');
    }
    return;
  }

  let throttle = 0, steer = 0;
  if (joystick.active) { throttle = -joystick.y; steer = joystick.x; }
  if (keys['w'] || keys['arrowup']) throttle = 1;
  if (keys['s'] || keys['arrowdown']) throttle = -1;
  if (keys['a'] || keys['arrowleft']) steer = -1;
  if (keys['d'] || keys['arrowright']) steer = 1;
  if (keys['q'] || heliUp) flyingHeli.position.y += 10 * dt;
  if (keys['e'] || heliDown) flyingHeli.position.y -= 10 * dt;

  if (throttle > 0.1 && flyingHeli.position.y < 12 && !heliDown && !keys['e']) {
    flyingHeli.position.y += 4 * dt;
  }

  flyingHeli.userData.angle -= steer * 1.5 * dt;
  flyingHeli.rotation.y = flyingHeli.userData.angle;

  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), flyingHeli.userData.angle);
  const newX = flyingHeli.position.x + forward.x * throttle * 25 * dt;
  const newZ = flyingHeli.position.z + forward.z * throttle * 25 * dt;

  let hitBuilding = null;
  for (const b of buildings) {
    const bHp = buildingHealth.get(b.mesh) || 0;
    if (bHp <= 0) continue;
    if (newX > b.x - b.w / 2 - 2 && newX < b.x + b.w / 2 + 2 &&
        newZ > b.z - b.d / 2 - 2 && newZ < b.z + b.d / 2 + 2) {
      if (flyingHeli.position.y < b.h + 1) {
        hitBuilding = b;
        break;
      }
    }
  }

  if (hitBuilding) {
    const impactSpeed = Math.abs(throttle) * 25;
    if (impactSpeed > 5) {
      explode(flyingHeli.position.x, flyingHeli.position.y, flyingHeli.position.z, 0xff4400, 30);
      beep(100, 0.3, 'sawtooth', 0.3);
      const curHp = heliHealth.get(flyingHeli) || 5;
      heliHealth.set(flyingHeli, curHp - 1);
      const bHp = (buildingHealth.get(hitBuilding.mesh) || 3) - 1;
      buildingHealth.set(hitBuilding.mesh, bHp);
      if (bHp === 2) { hitBuilding.mesh.material.color.multiplyScalar(0.7); }
      else if (bHp === 1) { hitBuilding.mesh.material.color.multiplyScalar(0.6); hitBuilding.mesh.rotation.z += 0.05; }
      else if (bHp <= 0) {
        hitBuilding.mesh.material.color.setHex(0x444444);
        hitBuilding.mesh.scale.y *= 0.3;
        hitBuilding.mesh.position.y = hitBuilding.mesh.scale.y * 2;
        money += 200;
        stats.buildings++;
        updateMoney();
        updateStats();
        if (activeMission && activeMission.id === 'destroy3') {
          activeMission.progress++;
          if (activeMission.progress >= activeMission.target) completeMission('destroy3');
        }
      }
      if (curHp - 1 <= 0) {
        explode(flyingHeli.position.x, flyingHeli.position.y, flyingHeli.position.z, 0xff0000, 40);
        flyingHeli.userData.isCrashed = true;
      } else {
        flyingHeli.position.x -= forward.x * 2;
        flyingHeli.position.z -= forward.z * 2;
      }
    }
  } else {
    flyingHeli.position.x = newX;
    flyingHeli.position.z = newZ;
  }

  flyingHeli.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, flyingHeli.position.x));
  flyingHeli.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, flyingHeli.position.z));
  flyingHeli.position.y = Math.max(0.8, Math.min(60, flyingHeli.position.y));

  flyingHeli.userData.rotor.rotation.y += dt * 50;
  flyingHeli.userData.tailRotor.rotation.z += dt * 80;

  playerGroup.position.copy(flyingHeli.position);
  playerGroup.position.y -= 3;
}

// ============ ПОЛИЦЕЙСКИЙ ВЕРТОЛЁТ ============
function updatePoliceHelis(dt) {
  policeHelis.forEach(ph => {
    if (ph.userData.isCrashed) return;
    ph.userData.rotor.rotation.y += dt * 50;
    ph.userData.tailRotor.rotation.z += dt * 80;

    // Мигалка
    if (ph.userData.siren) {
      const t = performance.now() * 0.005;
      ph.userData.siren.material.color.setHex(Math.sin(t) > 0 ? 0xff0000 : 0x440000);
    }

    const target = drivingCar ? drivingCar.position : (flyingHeli ? flyingHeli.position : playerGroup.position);

    // Следует за игроком на высоте
    if (wanted > 0) {
      const targetX = target.x;
      const targetZ = target.z;
      const targetY = 25;

      ph.position.x += (targetX - ph.position.x) * 0.5 * dt;
      ph.position.z += (targetZ - ph.position.z) * 0.5 * dt;
      ph.position.y += (targetY - ph.position.y) * 0.5 * dt;

      // Прожектор на игрока
      if (ph.userData.searchlight) {
        ph.userData.searchlight.target.position.copy(target);
        ph.userData.searchlight.target.position.y = 0;
      }

      // Стрельба при 3+ звёздах
      if (wanted >= 3 && Math.random() < 0.015) {
        const from = ph.position.clone();
        const dir = target.clone().sub(from).normalize();
        shoot(from, dir, true);
      }
    } else {
      // Патрулирование
      ph.position.x = Math.sin(performance.now() * 0.0003) * 80;
      ph.position.z = Math.cos(performance.now() * 0.0004) * 80;
      ph.position.y = 30;
    }
  });
}

// ============ ПОЛИЦИЯ ============
function updatePolice(dt) {
  if (wanted === 0) return;
  const target = drivingCar ? drivingCar.position : (flyingHeli ? flyingHeli.position : (ridingBoat ? boat.position : playerGroup.position));

  policeCars.forEach(pc => {
    if (pc === drivingCar) return;
    const dir = target.clone().sub(pc.position);
    dir.y = 0;
    const dist = dir.length();

    if (dist > 60) {
      pc.rotation.y += 0.3 * dt;
      const nx = pc.position.x + Math.sin(pc.rotation.y) * 2 * dt;
      const nz = pc.position.z + Math.cos(pc.rotation.y) * 2 * dt;
      if (!isInRiver(nx, nz) && !isInsideBuilding(nx, nz, 2)) {
        pc.position.x = nx;
        pc.position.z = nz;
      } else {
        pc.rotation.y += 1.5 * dt;
      }
    } else if (dist > 1) {
      dir.normalize();
      const targetAngle = Math.atan2(dir.x, dir.z);
      let diff = targetAngle - pc.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      pc.rotation.y += Math.sign(diff) * Math.min(Math.abs(diff), 1.8 * dt);

      const speed = 4 + wanted * 1.5;
      let nx = pc.position.x + Math.sin(pc.rotation.y) * speed * dt;
      let nz = pc.position.z + Math.cos(pc.rotation.y) * speed * dt;

      if (isInsideBuilding(nx, nz, 2) || isInRiver(nx, nz)) {
        const sideAngles = [Math.PI / 3, -Math.PI / 3, Math.PI / 2, -Math.PI / 2];
        let moved = false;
        for (const sa of sideAngles) {
          const testAng = pc.rotation.y + sa;
          const tx = pc.position.x + Math.sin(testAng) * speed * dt;
          const tz = pc.position.z + Math.cos(testAng) * speed * dt;
          if (!isInsideBuilding(tx, tz, 2) && !isInRiver(tx, tz)) {
            pc.position.x = tx;
            pc.position.z = tz;
            pc.rotation.y = testAng;
            moved = true;
            break;
          }
        }
        if (!moved) pc.rotation.y += Math.PI * dt;
      } else {
        pc.position.x = nx;
        pc.position.z = nz;
      }
    }

    pc.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, pc.position.x));
    pc.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, pc.position.z));

    if (pc.userData.sirenR) {
      const t = performance.now() * 0.005;
      pc.userData.sirenR.material.color.setHex(Math.sin(t) > 0 ? 0xff0000 : 0x440000);
      pc.userData.sirenB.material.color.setHex(Math.sin(t) > 0 ? 0x000044 : 0x0000ff);
      if (pc.userData.beacon) {
        const pulse = 0.6 + Math.sin(performance.now() * 0.008) * 0.4;
        pc.userData.beacon.scale.setScalar(pulse);
      }
      if (pc.userData.policeLight) {
        pc.userData.policeLight.intensity = 1.5 + Math.sin(performance.now() * 0.008) * 1;
      }
    }

    if (pc.position.distanceTo(target) < 4 && wanted >= 1 && !flyingHeli) {
      if (isPoliceVisible(pc.position)) {
        if (inventory.armor) {
          inventory.armor = false;
          showMessage('🛡️ Броня спасла тебя!', 1500);
          wanted = 0;
          updateWanted();
          // Отбрасываем полицию
          policeCars.forEach(p => {
            p.position.set(p.position.x + 20, 0, p.position.z + 20);
          });
        } else {
          goToHospital('Поймала полиция');
        }
      }
    }
  });
}

function isPoliceVisible(policePos) {
  if (playerGroup.position.distanceTo(policePos) > 20) return false;
  if (camera.position.distanceTo(policePos) > 25) return false;
  for (const b of buildings) {
    const hp = buildingHealth.get(b.mesh) || 0;
    if (hp <= 0) continue;
    const distToBuilding = Math.hypot(policePos.x - b.x, policePos.z - b.z);
    if (distToBuilding < Math.max(b.w, b.d) / 2 + 2) {
      if (playerGroup.position.distanceTo(policePos) > 12) return false;
    }
  }
  return true;
}

function updatePedestrians(dt) {
  pedestrians.forEach(p => {
    if (!p.userData.alive) return;
    const target = drivingCar ? drivingCar.position : playerGroup.position;
    const d = p.position.distanceTo(target);
    if (d < 8) p.userData.panic = 2;
    if (p.userData.panic > 0) {
      p.userData.panic -= dt;
      const dx = p.position.x - target.x;
      const dz = p.position.z - target.z;
      const len = Math.hypot(dx, dz);
      if (len > 0.01) {
        p.userData.angle = Math.atan2(dx / len, dz / len);
        const nx = p.position.x + Math.sin(p.userData.angle) * p.userData.speed * 2.5 * dt;
        const nz = p.position.z + Math.cos(p.userData.angle) * p.userData.speed * 2.5 * dt;
        if (!isInRiver(nx, nz)) {
          p.position.x = nx;
          p.position.z = nz;
        }
      }
    } else {
      const nx = p.position.x + Math.sin(p.userData.angle) * p.userData.speed * dt;
      const nz = p.position.z + Math.cos(p.userData.angle) * p.userData.speed * dt;
      if (!isInRiver(nx, nz)) {
        p.position.x = nx;
        p.position.z = nz;
      } else {
        p.userData.angle += Math.PI * 0.5;
      }
      if (Math.random() < 0.005) p.userData.angle += (Math.random() - 0.5);
    }
    if (collideBuilding(p.position, 0.4)) p.userData.angle += Math.PI * 0.7;
    p.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, p.position.x));
    p.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, p.position.z));
    p.rotation.y = p.userData.angle;
    p.userData.walkCycle += dt * 8;
    p.userData.leg1.rotation.x = Math.sin(p.userData.walkCycle) * 0.5;
    p.userData.leg2.rotation.x = -Math.sin(p.userData.walkCycle) * 0.5;
  });
}

function updateCrystals(dt) {
  for (let i = crystals.length - 1; i >= 0; i--) {
    const c = crystals[i];
    c.rotation.y += dt * 2;
    c.position.y = c.userData.baseY + Math.sin(performance.now() * 0.002) * 0.3;
    const target = drivingCar ? drivingCar.position : (flyingHeli ? flyingHeli.position : (ridingBoat ? boat.position : playerGroup.position));
    if (target.distanceTo(c.position) < 2.5) {
      money += 50;
      updateMoney();
      explode(c.position.x, c.position.y, c.position.z, 0x00ffff, 20);
      beep(1500, 0.1);
      showMessage('💎 +50!', 800);
      scene.remove(c);
      crystals.splice(i, 1);
      spawnCrystal();
      if (activeMission && activeMission.id === 'collect') {
        activeMission.progress++;
        if (activeMission.progress >= activeMission.target) completeMission('collect');
      }
    }
  }
}

function updateMissionMarker(dt) {
  if (!missionMarker) return;
  missionMarker.rotation.y += dt * 0.5;
  missionMarker.scale.setScalar(1 + Math.sin(performance.now() * 0.003) * 0.1);
  if (missionMarker.userData.ring) {
    missionMarker.userData.ring.scale.setScalar(1 + (performance.now() * 0.001) % 1);
    missionMarker.userData.ring.material.opacity = 0.8 - ((performance.now() * 0.001) % 1) * 0.8;
  }
  const target = drivingCar ? drivingCar.position : (ridingBoat ? boat.position : playerGroup.position);
  if (target.distanceTo(missionMarker.position) < 3) {
    money += 100;
    updateMoney();
    beep(800, 0.1);
    beep(1200, 0.15);
    explode(missionMarker.position.x, 2, missionMarker.position.z, 0xffdd00, 20);
    showMessage('+100 💰 Миссия!', 1500);
    spawnMissionMarker();
  }
}

function updateRace(dt) {
  if (!raceActive) return;
  raceTime += dt;

  // ИИ-соперники
  aiRacers.forEach(ai => {
    if (ai.userData.raceFinished) return;
    const targetCp = checkpoints[ai.userData.raceIndex];
    if (!targetCp) { ai.userData.raceFinished = true; return; }
    const dir = targetCp.position.clone().sub(ai.position);
    dir.y = 0;
    if (dir.length() < 4) {
      ai.userData.raceIndex++;
      if (ai.userData.raceIndex >= checkpoints.length) {
        ai.userData.raceFinished = true;
      }
      return;
    }
    dir.normalize();
    const targetAngle = Math.atan2(dir.x, dir.z);
    let diff = targetAngle - ai.rotation.y;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    ai.rotation.y += Math.sign(diff) * Math.min(Math.abs(diff), 3 * dt);
    const speed = 15;
    const nx = ai.position.x + Math.sin(ai.rotation.y) * speed * dt;
    const nz = ai.position.z + Math.cos(ai.rotation.y) * speed * dt;
    if (!isInsideBuilding(nx, nz, 1.5) && !isInRiver(nx, nz)) {
      ai.position.x = nx;
      ai.position.z = nz;
    }
  });

  if (raceIndex < checkpoints.length) {
    const cur = checkpoints[raceIndex];
    cur.scale.setScalar(1 + Math.sin(performance.now() * 0.005) * 0.1);
    if (cur.userData.ring) {
      cur.userData.ring.scale.setScalar(1 + (performance.now() * 0.001) % 0.5);
    }
    const target = drivingCar ? drivingCar.position : playerGroup.position;
    if (target.distanceTo(cur.position) < 4) {
      beep(1000, 0.1);
      explode(cur.position.x, 2, cur.position.z, 0x00ffff, 15);
      raceIndex++;
      if (raceIndex < checkpoints.length) {
        checkpoints.forEach((cp, i) => {
          cp.material.color.setHex(i === raceIndex ? 0x00ff88 : 0x005588);
          cp.userData.ring.material.color.setHex(i === raceIndex ? 0x00ff88 : 0x005588);
        });
        showMessage(`Чекпоинт ${raceIndex}/${checkpoints.length}`, 800);
      } else {
        raceActive = false;
        money += 500;
        updateMoney();
        wanted = Math.min(wanted + 1, 5);
        updateWanted();
        let msg = `🏆 Финиш! +500 💰 Время: ${raceTime.toFixed(1)}с`;
        if (raceTime < raceBest) {
          raceBest = raceTime;
          localStorage.setItem('raceBest', raceBest);
          msg = `🏆 НОВЫЙ РЕКОРД! ${raceTime.toFixed(1)}с`;
        }
        showMessage(msg, 3000);
        beep(800, 0.15);
        beep(1000, 0.15);
        beep(1200, 0.3);
        if (activeMission && activeMission.id === 'race') completeMission('race');
        setTimeout(() => {
          checkpoints.forEach(c => {
            if (c.userData.ring) scene.remove(c.userData.ring);
            scene.remove(c);
          });
          checkpoints.length = 0;
          aiRacers.forEach(ai => scene.remove(ai));
          aiRacers.length = 0;
          aiRacersActive = false;
        }, 3000);
      }
    }
  }
  raceHud.style.display = 'block';
  raceHud.innerHTML = `🏁 ${raceIndex}/${checkpoints.length} | ⏱ ${raceTime.toFixed(1)}с`;
}

function updateCamera(dt) {
  if (flyingHeli) {
    const camOffset = new THREE.Vector3(0, 8, -15);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), flyingHeli.userData.angle);
    const target = flyingHeli.position.clone().add(camOffset);
    camera.position.lerp(target, 0.1);
    camera.lookAt(flyingHeli.position);
  } else if (ridingBoat) {
    const camOffset = new THREE.Vector3(0, 6, -10);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), boat.rotation.y);
    const target = boat.position.clone().add(camOffset);
    camera.position.lerp(target, 0.12);
    camera.lookAt(boat.position.clone().add(new THREE.Vector3(0, 1, 0)));
  } else if (drivingCar) {
    const camOffset = new THREE.Vector3(0, 7, -11);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), drivingCar.rotation.y);
    const target = drivingCar.position.clone().add(camOffset);
    camera.position.lerp(target, 0.12);
    camera.lookAt(drivingCar.position.clone().add(new THREE.Vector3(0, 1, 0)));
  } else {
    const offset = new THREE.Vector3(
      Math.sin(playerGroup.rotation.y) * -8,
      6.5,
      Math.cos(playerGroup.rotation.y) * -8
    );
    const target = playerGroup.position.clone().add(offset);
    camera.position.lerp(target, 0.1);
    camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
  }
}

// ============ МИНИ-КАРТА ============
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
const MM_SIZE = 200;

function drawMinimap() {
  mctx.clearRect(0, 0, MM_SIZE, MM_SIZE);
  mctx.fillStyle = 'rgba(0,40,0,0.7)';
  mctx.beginPath();
  mctx.arc(MM_SIZE / 2, MM_SIZE / 2, MM_SIZE / 2, 0, Math.PI * 2);
  mctx.fill();
  const scale = MM_SIZE / CITY_SIZE;
  const cx = MM_SIZE / 2;
  const cy = MM_SIZE / 2;
  const target = flyingHeli ? flyingHeli.position : (ridingBoat ? boat.position : (drivingCar ? drivingCar.position : playerGroup.position));

  // Река
  mctx.fillStyle = 'rgba(50,120,200,0.7)';
  const riverH = RIVER_WIDTH * scale;
  const riverY = cy + (RIVER_Y_START + RIVER_Y_END) / 2 * scale;
  mctx.fillRect(0, riverY - riverH / 2, MM_SIZE, riverH);

  // Остров
  mctx.fillStyle = 'rgba(194,178,128,0.7)';
  mctx.beginPath();
  mctx.arc(cx + (ISLAND_X - target.x) * scale, cy + (ISLAND_Z - target.z) * scale, ISLAND_R * scale, 0, Math.PI * 2);
  mctx.fill();

  // Дома
  buildings.forEach(b => {
    const hp = buildingHealth.get(b.mesh) || 0;
    mctx.fillStyle = hp > 0 ? 'rgba(150,150,170,0.6)' : 'rgba(80,80,80,0.6)';
    const dx = (b.x - target.x) * scale;
    const dz = (b.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillRect(cx + dx - b.w * scale / 2, cy + dz - b.d * scale / 2, b.w * scale, b.d * scale);
    }
  });

  // Полиция
  policeCars.forEach(pc => {
    if (pc === drivingCar) return;
    const dx = (pc.position.x - target.x) * scale;
    const dz = (pc.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      const pulse = 3 + Math.sin(performance.now() * 0.005) * 1.5;
      mctx.fillStyle = '#ff0000';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, pulse, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Полицейский вертолёт
  policeHelis.forEach(ph => {
    const dx = (ph.position.x - target.x) * scale;
    const dz = (ph.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = '#ff00ff';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Миссия
  if (missionMarker) {
    const dx = (missionMarker.position.x - target.x) * scale;
    const dz = (missionMarker.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = '#ffdd00';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 5, 0, Math.PI * 2);
      mctx.fill();
    }
  }

  // Кристаллы
  mctx.fillStyle = '#00ffff';
  crystals.forEach(c => {
    const dx = (c.position.x - target.x) * scale;
    const dz = (c.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 3, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Вертолёты
  mctx.fillStyle = '#b464ff';
  helis.forEach(h => {
    if (h.userData.crashed) return;
    const dx = (h.position.x - target.x) * scale;
    const dz = (h.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Лодка
  if (boat) {
    const dx = (boat.position.x - target.x) * scale;
    const dz = (boat.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = '#00d4ff';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  }

  // Чекпоинты
  checkpoints.forEach((cp, i) => {
    const dx = (cp.position.x - target.x) * scale;
    const dz = (cp.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = i === raceIndex ? '#00ff88' : '#005588';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Игрок
  mctx.save();
  mctx.translate(cx, cy);
  const angle = flyingHeli ? flyingHeli.userData.angle : (ridingBoat ? boat.rotation.y : (drivingCar ? drivingCar.rotation.y : playerGroup.rotation.y));
  mctx.rotate(angle);
  mctx.fillStyle = '#4dff88';
  mctx.beginPath();
  mctx.moveTo(0, -8);
  mctx.lineTo(5, 6);
  mctx.lineTo(-5, 6);
  mctx.closePath();
  mctx.fill();
  mctx.restore();
}

function endGame(reason = 'Тебя поймала полиция!') {
  if (gameOver) return;
  gameOver = true;
  if (money > bestMoney) {
    bestMoney = money;
    localStorage.setItem('bestMoney', bestMoney);
  }
  document.getElementById('go-title').textContent = 'Игра окончена';
  document.getElementById('go-subtitle').textContent = reason;
  document.getElementById('final-money').textContent = money;
  document.getElementById('best-money').textContent = bestMoney;
  document.getElementById('stats-final').textContent = `👤${stats.peds} 🚗${stats.cars} 🏚️${stats.buildings}`;
  document.getElementById('gameover-modal').style.display = 'flex';
  beep(300, 0.5, 'sawtooth', 0.2);
}

window.resetGame = function() {
  money = 0;
  wanted = 0;
  gameOver = false;
  carSpeed = 0;
  boatSpeed = 0;
  drivingCar = null;
  flyingHeli = null;
  ridingBoat = null;
  raceActive = false;
  inHospital = false;
  stats = { peds: 0, cars: 0, buildings: 0 };
  achievements = {};
  inventory = { rocket: false, armor: false };
  storyMissions.forEach(m => { m.done = false; m.progress = 0; });
  activeMission = null;
  updateMoney();
  updateWanted();
  updateStats();
  playerGroup.position.set(20, 0, 20);
  playerGroup.visible = true;
  playerGroup.rotation.set(0, 0, 0);

  pedestrians.forEach(p => {
    p.userData.alive = true;
    p.visible = true;
    let px, pz;
    for (let a = 0; a < 30; a++) {
      px = (Math.random() - 0.5) * CITY_SIZE;
      pz = (Math.random() - 0.5) * CITY_SIZE;
      if (!isRiver(px, pz) && !isInsideBuilding(px, pz, 1)) break;
    }
    p.position.set(px, 0, pz);
  });

  policeCars.forEach(pc => {
    let px, pz;
    for (let a = 0; a < 30; a++) {
      px = (Math.random() - 0.5) * CITY_SIZE;
      pz = (Math.random() - 0.5) * CITY_SIZE;
      if (!isRiver(px, pz) && !isInsideBuilding(px, pz, 3)) break;
    }
    pc.position.set(px, 0, pz);
  });

  helis.forEach(h => {
    h.visible = true;
    h.userData.crashed = false;
    h.userData.isCrashed = false;
    heliHealth.set(h, 5);
  });

  buildings.forEach(b => {
    buildingHealth.set(b.mesh, 3);
    b.mesh.material.color.setHex(BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)]);
    b.mesh.scale.set(1, 1, 1);
    b.mesh.position.y = b.h / 2;
    b.mesh.rotation.z = 0;
  });

  checkpoints.forEach(c => {
    if (c.userData.ring) scene.remove(c.userData.ring);
    scene.remove(c);
  });
  checkpoints.length = 0;
  raceHud.style.display = 'none';

  bullets.forEach(b => scene.remove(b));
  bullets.length = 0;
  grenades.forEach(g => scene.remove(g));
  grenades.length = 0;
  rockets.forEach(r => scene.remove(r));
  rockets.length = 0;

  aiRacers.forEach(ai => scene.remove(ai));
  aiRacers.length = 0;

  spawnMissionMarker();
  document.getElementById('gameover-modal').style.display = 'none';
};

// ============ НОЧНОЙ РЕЖИМ ============
let timeOfDay = 0.3;
let isNight = false;

function updateDayNight(dt) {
  timeOfDay += dt * 0.008;
  if (timeOfDay > 1) timeOfDay = 0;

  const wasNight = isNight;
  isNight = timeOfDay > 0.5 && timeOfDay < 0.95;

  const blend = isNight ? Math.min(1, (timeOfDay - 0.5) * 4) : (timeOfDay > 0.95 ? Math.max(0, 1 - (timeOfDay - 0.95) * 20) : 0);

  const skyColor = new THREE.Color(0x87CEEB).lerp(new THREE.Color(0x0a0a2a), blend);
  scene.background = skyColor;
  scene.fog.color = skyColor;

  ambient.intensity = 0.55 - blend * 0.35;
  sun.intensity = 1.4 - blend * 1.2;

  // Фары машин ночью
  cars.forEach(c => {
    if (c.userData.headlight) {
      c.userData.headlight.intensity = blend * 3;
    }
  });

  // Окна домов светятся ночью
  if (wasNight !== isNight) {
    buildings.forEach(b => {
      b.windows.forEach(w => {
        if (isNight) {
          w.material.color.setHex(0xffee88);
        }
      });
    });
  }
}

// ============ АНИМАЦИЯ ============
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  if (gameOver || inHospital) {
    renderer.render(scene, camera);
    return;
  }
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePlayer(dt);
  updateCar(dt);
  updateBoat(dt);
  updateHeli(dt);
  updatePoliceHelis(dt);
  updatePolice(dt);
  updatePedestrians(dt);
  updateCrystals(dt);
  updateMissionMarker(dt);
  updateRace(dt);
  updateBullets(dt);
  updateGrenades(dt);
  updateRockets(dt);
  updateFires(dt);
  updateParticles(dt);
  updateDayNight(dt);
  updateCamera(dt);

  // Кнопки
  if (drivingCar) {
    actionBtn.style.display = 'flex';
    actionBtn.textContent = 'ВЫЙТИ';
    actionBtn.style.background = 'rgba(255,100,100,0.9)';
  } else if (nearestCar) {
    actionBtn.style.display = 'flex';
    actionBtn.textContent = 'СЕСТЬ';
    actionBtn.style.background = 'rgba(255,220,0,0.9)';
  } else {
    actionBtn.style.display = 'none';
  }

  if (!flyingHeli && !ridingBoat && !inHospital) {
    shootBtn.style.display = 'flex';
    grenadeBtn.style.display = 'flex';
    crosshair.style.display = drivingCar ? 'none' : 'block';
  } else {
    shootBtn.style.display = 'none';
    grenadeBtn.style.display = 'none';
    crosshair.style.display = 'none';
  }

  // Кнопка ремонта
  let hasDamaged = false;
  buildings.forEach(b => {
    const hp = buildingHealth.get(b.mesh);
    if (hp !== undefined && hp < 3 && hp > 0) {
      if (Math.hypot(b.x - playerGroup.position.x, b.z - playerGroup.position.z) < 15) {
        hasDamaged = true;
      }
    }
  });
  repairBtn.style.display = hasDamaged ? 'flex' : 'none';

  // Вертолёт
  if (flyingHeli) {
    heliBtn.style.display = 'flex';
    heliBtn.innerHTML = '⬇️<br>ПРИЗЕМ';
    heliBtn.style.background = 'rgba(100,100,100,0.9)';
    heliUpBtn.style.display = 'flex';
    heliDownBtn.style.display = 'flex';
  } else {
    heliBtn.style.display = 'none';
    heliUpBtn.style.display = 'none';
    heliDownBtn.style.display = 'none';
    nearestHeli = null;
    let minD = 10;
    helis.forEach(h => {
      if (h.userData.crashed) return;
      const dx = h.position.x - playerGroup.position.x;
      const dz = h.position.z - playerGroup.position.z;
      const d = Math.hypot(dx, dz);
      if (d < minD) { minD = d; nearestHeli = h; }
    });
    if (nearestHeli) {
      heliBtn.style.display = 'flex';
      heliBtn.innerHTML = '🚁<br>СЕСТЬ';
      heliBtn.style.background = 'rgba(180,100,255,0.9)';
    }
  }

  // Лодка
  if (ridingBoat) {
    boatBtn.style.display = 'flex';
    boatBtn.innerHTML = '🚶<br>ВЫЙТИ';
    boatBtn.style.background = 'rgba(100,100,100,0.9)';
  } else if (boat) {
    const d = Math.hypot(boat.position.x - playerGroup.position.x, boat.position.z - playerGroup.position.z);
    if (d < 10) {
      boatBtn.style.display = 'flex';
      boatBtn.innerHTML = '🚤<br>СЕСТЬ';
      boatBtn.style.background = 'rgba(0,150,200,0.9)';
    } else {
      boatBtn.style.display = 'none';
    }
  } else {
    boatBtn.style.display = 'none';
  }

  raceBtn.style.display = raceActive ? 'none' : 'flex';
  shopBtn.style.display = (!drivingCar && !flyingHeli && !ridingBoat) ? 'flex' : 'none';
  missionBtn.style.display = (!drivingCar && !flyingHeli && !ridingBoat) ? 'flex' : 'none';

  if (!drivingCar) {
    let minD = 4.5;
    nearestCar = null;
    cars.forEach(c => {
      if (c === drivingCar) return;
      const d = c.position.distanceTo(playerGroup.position);
      if (d < minD) { minD = d; nearestCar = c; }
    });
  }

  if (frameCount % 2 === 0) drawMinimap();
  frameCount++;

  if (wanted > 0) {
    taskEl.textContent = '⚠️ Полиция ищет тебя!';
  } else if (activeMission) {
    taskEl.textContent = '📜 ' + activeMission.name;
  } else if (raceActive) {
    taskEl.textContent = `🏁 Гонка: ${raceIndex}/${checkpoints.length}`;
  } else if (missionMarker) {
    const target = drivingCar ? drivingCar.position : playerGroup.position;
    taskEl.textContent = '🎯 Миссия: ' + Math.round(target.distanceTo(missionMarker.position)) + 'м';
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('reset-btn').style.display = 'flex';
  document.getElementById('music-btn').style.display = 'flex';
  startMusic();
  animate();
}, 600);
</script>
</body>
 </html>
