<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Mini-GTA 3D v5.2 STABLE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 0 2px 6px #000; pointer-events: none; z-index: 10; font-weight: 600; }
  #hud .money { color: #4dff88; }
  #hud .wanted { color: #ff4444; }
  #hud .task { background: rgba(0,0,0,0.55); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 400; max-width: 58vw; text-align: center; border-left: 3px solid #ffdd00; }
  
  .action-btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; display: none; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 10px; z-index: 20; border: 3px solid #fff; letter-spacing: 0.3px; color: #000; }
  #action-btn { bottom: 25px; right: 18px; background: rgba(255, 220, 0, 0.9); }
  #shoot-btn { bottom: 25px; right: 95px; background: rgba(255, 80, 80, 0.9); color: #fff; }
  #heli-btn { bottom: 100px; right: 18px; background: rgba(180, 100, 255, 0.9); color: #fff; }
  #boat-btn { bottom: 100px; right: 95px; background: rgba(0, 150, 200, 0.9); color: #fff; }
  
  #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 50%; z-index: 15; }
  #joystick-base { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); display: none; pointer-events: none; }
  #joystick-knob { position: absolute; width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: 0 0 15px rgba(255,255,255,0.7); display: none; pointer-events: none; }
  
  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #4dff88; font-size: 20px; background: #000; z-index: 100; }
  #loading .spinner { width: 60px; height: 60px; border: 4px solid rgba(77,255,136,0.3); border-top-color: #4dff88; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  #message { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; font-weight: 800; text-shadow: 0 0 15px #000; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 30; text-align: center; white-space: nowrap; padding: 8px 16px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); }
  
  #minimap { position: absolute; top: 60px; right: 10px; width: 100px; height: 100px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); z-index: 12; box-shadow: 0 0 15px rgba(0,0,0,0.6); }
  
  #top-btns { position: absolute; top: 60px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .top-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 18px; display: none; align-items: center; justify-content: center; font-weight: bold; }
  
  #fps-counter { position: absolute; top: 5px; right: 5px; color: #0f0; font-size: 11px; font-family: monospace; z-index: 999; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border: 2px solid rgba(255,80,80,0.8); border-radius: 50%; display: none; z-index: 11; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,80,80,0.8); }
  #crosshair::before { top: 50%; left: -8px; right: -8px; height: 2px; transform: translateY(-50%); }
  #crosshair::after { left: 50%; top: -8px; bottom: -8px; width: 2px; transform: translateX(-50%); }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Загрузка v5.2...</div>

<div id="hud" style="display:none">
  <div>💰 <span class="money" id="money">0</span><br>⭐ <span class="wanted" id="wanted" style="display:none">0</span></div>
  <div class="task" id="task">Найди магазин</div>
</div>

<canvas id="minimap" width="200" height="200"></canvas>
<div id="top-btns">
  <div class="top-btn" id="reset-btn">↻</div>
</div>
<div id="crosshair"></div>
<div id="fps-counter">FPS: --</div>

<div id="joystick-zone" style="display:none">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="action-btn" class="action-btn">СЕСТЬ</div>
<div id="shoot-btn" class="action-btn">🔫</div>
<div id="heli-btn" class="action-btn">🚁<br>СЕСТЬ</div>
<div id="boat-btn" class="action-btn">🚤<br>СЕСТЬ</div>

<div id="message"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);

// ============ СВЕТ ============
const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.3);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

// ============ КОНСТАНТЫ ============
const CITY_SIZE = 200;
const RIVER_WIDTH = 20;
const RIVER_Y_START = -10;
const RIVER_Y_END = 10;
const BLOCK = 30;
const ROAD_WIDTH = 10;
const ISLAND_X = 100;
const ISLAND_Z = 0;
const ISLAND_R = 20;

// ============ МИР ============
const buildings = [];
const buildingHealth = new Map();
const trees = [];
const mountains = [];

function makeBuilding(x, z, w, d, h, isShop = false, color = null) {
  const c = color || [0x8899aa, 0xaa9988, 0x778899, 0x998877][Math.floor(Math.random()*4)];
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color: c, roughness: 0.8 })
  );
  mesh.position.set(x, h / 2, z);
  mesh.receiveShadow = true;
  scene.add(mesh);
  const data = { x, z, w, d, h, mesh, isShop };
  buildings.push(data);
  buildingHealth.set(mesh, isShop ? 999 : 3);
  mesh.userData.buildingData = data;
}

// Земля
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x3a5a3a }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Река
const water = new THREE.Mesh(new THREE.PlaneGeometry(500, RIVER_WIDTH), new THREE.MeshStandardMaterial({ color: 0x2a6aae, metalness: 0.5, roughness: 0.3, transparent: true, opacity: 0.85 }));
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.05, (RIVER_Y_START + RIVER_Y_END) / 2);
scene.add(water);

// Остров
const island = new THREE.Mesh(new THREE.CylinderGeometry(ISLAND_R, ISLAND_R, 1.5, 24), new THREE.MeshStandardMaterial({ color: 0xc2b280 }));
island.position.set(ISLAND_X, 0.75, ISLAND_Z);
scene.add(island);

// Горы
[
  { x: -70, z: -85, h: 28, r: 12 },
  { x: -50, z: -85, h: 22, r: 10 },
  { x: -30, z: -85, h: 32, r: 14 }
].forEach(mp => {
  const mountain = new THREE.Mesh(new THREE.ConeGeometry(mp.r, mp.h, 6), new THREE.MeshStandardMaterial({ color: 0x666677, flatShading: true }));
  mountain.position.set(mp.x, mp.h / 2, mp.z);
  scene.add(mountain);
  const data = { x: mp.x, z: mp.z, w: mp.r * 2, d: mp.r * 2, h: mp.h, mesh: mountain, isMountain: true };
  buildings.push(data);
  buildingHealth.set(mountain, 999);
  mountains.push(data);
});

// Город
for (let bx = -CITY_SIZE / 2; bx < CITY_SIZE / 2; bx += BLOCK) {
  for (let bz = -CITY_SIZE / 2; bz < CITY_SIZE / 2; bz += BLOCK) {
    const qcx = bx + BLOCK / 2, qcz = bz + BLOCK / 2;
    if (Math.abs(qcz) < 15) continue; // река
    if (Math.hypot(qcx - ISLAND_X, qcz - ISLAND_Z) < ISLAND_R + 5) continue;
    if (qcx < -50 && qcz < -60) continue; // горы
    if (qcx < -50 && qcz > 50) continue; // лес
    
    // Дороги
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadH.rotation.x = -Math.PI / 2; roadH.position.set(bx + BLOCK / 2, 0.01, bz); scene.add(roadH);
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadV.rotation.x = -Math.PI / 2; roadV.rotation.z = Math.PI / 2; roadV.position.set(bx, 0.01, bz + BLOCK / 2); scene.add(roadV);

    if (Math.random() < 0.7) {
      makeBuilding(qcx + (Math.random()-0.5)*10, qcz + (Math.random()-0.5)*10, 6 + Math.random()*6, 6 + Math.random()*6, 8 + Math.random()*20);
    }
  }
}

// Лес
for (let i = 0; i < 30; i++) {
  const tx = -90 + Math.random() * 40, tz = 70 + Math.random() * 40;
  const tree = new THREE.Mesh(new THREE.ConeGeometry(1.5, 5, 5), new THREE.MeshStandardMaterial({ color: 0x1a5a1a }));
  tree.position.set(tx, 3.5, tz);
  scene.add(tree);
}

// ============ МАГАЗИН ============
const shopBuilding = { x: 50, z: 25, w: 12, d: 12, h: 8 };
makeBuilding(50, 25, 12, 12, 8, true, 0xffcc44);
const shopMesh = buildings[buildings.length-1].mesh;

// Маркер магазина
const shopMarker = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.1, 12), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 }));
shopMarker.position.set(50, 0.1, 25 + 6 + 2);
scene.add(shopMarker);

// ============ ИНТЕРЬЕР ============
const shopInterior = new THREE.Group();
shopInterior.visible = false;
const intFloor = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshStandardMaterial({ color: 0x8B7355 }));
intFloor.rotation.x = -Math.PI / 2; intFloor.position.y = 0.05; shopInterior.add(intFloor);
const intWallMat = new THREE.MeshStandardMaterial({ color: 0xddddaa, side: THREE.DoubleSide });
const intBack = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intBack.position.set(0, 3, -9); shopInterior.add(intBack);
const intLeft = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intLeft.rotation.y = Math.PI / 2; intLeft.position.set(-9, 3, 0); shopInterior.add(intLeft);
const intRight = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intRight.rotation.y = -Math.PI / 2; intRight.position.set(9, 3, 0); shopInterior.add(intRight);
const shopLight = new THREE.PointLight(0xffffaa, 3, 25); shopLight.position.set(0, 5, 0); shopInterior.add(shopLight);

const counter = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 2), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
counter.position.set(0, 0.6, 0); shopInterior.add(counter);
const seller = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x44aa44 }));
seller.position.set(0, 0.75, -3); shopInterior.add(seller);

const shopItems3D = [];
[
  { id: 'rocket', name: '🚀 Ракетница', price: 1000, color: 0xff4444, x: -2.7 },
  { id: 'armor', name: '🛡️ Броня', price: 500, color: 0x4488ff, x: -0.9 },
  { id: 'health', name: '❤️ Аптечка', price: 200, color: 0xff44aa, x: 0.9 },
  { id: 'ammo', name: '🔫 Патроны', price: 100, color: 0xffdd44, x: 2.7 }
].forEach(g => {
  const item = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: g.color, emissive: g.color, emissiveIntensity: 0.3 }));
  item.position.set(g.x, 1.65, 0);
  item.userData = g;
  shopInterior.add(item);
  shopItems3D.push(item);
});

// ============ ЖИВНОСТЬ ============
// Лыжник (патрулирует горы)
const skier = new THREE.Group();
const skierBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.3), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
skierBody.position.y = 1;
skier.add(skierBody);
const skis = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
skis.position.y = 0.1;
skier.add(skis);
skier.position.set(-50, 0, -80);
scene.add(skier);

// Медведи (ходят по лесу)
const bears = [];
for (let i = 0; i < 3; i++) {
  const bear = new THREE.Group();
  const bBody = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), new THREE.MeshStandardMaterial({ color: 0x553311 }));
  bBody.scale.set(1, 1.2, 1.5);
  bBody.position.y = 0.8;
  bear.add(bBody);
  bear.position.set(-80 + i * 10, 0, 80 + Math.random() * 20);
  bear.userData = { angle: Math.random() * Math.PI * 2, speed: 3 };
  scene.add(bear);
  bears.push(bear);
}

// ============ ИГРОК И ТРАНСПОРТ ============
const playerGroup = new THREE.Group();
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x2255cc }));
torso.position.y = 1.1; playerGroup.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
head.position.y = 2; playerGroup.add(head);
const arms = []; const legs = [];
for (let i = 0; i < 2; i++) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.25), new THREE.MeshStandardMaterial({ color: 0x2255cc }));
  arm.position.set(i === 0 ? -0.4 : 0.4, 1.3, 0); playerGroup.add(arm); arms.push(arm);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.9, 0.3), new THREE.MeshStandardMaterial({ color: 0x333344 }));
  leg.position.set(i === 0 ? -0.15 : 0.15, 0.5, 0); playerGroup.add(leg); legs.push(leg);
}
playerGroup.position.set(20, 0, 20);
scene.add(playerGroup);

const cars = [];
function makeCar(x, z, color, isCop = false) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshStandardMaterial({ color }));
  b.position.y = 0.7; g.add(b);
  const c = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x222222 }));
  c.position.set(0, 1.3, -0.3); g.add(c);
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  g.userData = { isCop };
  scene.add(g);
  cars.push(g);
  return g;
}

for(let i=0; i<15; i++) makeCar((Math.random()-0.5)*150, (Math.random()-0.5)*150, `hsl(${Math.random()*360}, 70%, 50%)`);
const cops = [];
for(let i=0; i<4; i++) cops.push(makeCar((Math.random()-0.5)*150, (Math.random()-0.5)*150, 0x111111, true));

// Вертолёты
const helis = [];
function makeHeli(x, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  g.add(b);
  const rot = new THREE.Mesh(new THREE.BoxGeometry(5, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0x888888 }));
  rot.position.y = 1; g.add(rot);
  g.position.set(x, 8, z);
  g.userData = { rot, angle: 0 };
  scene.add(g);
  helis.push(g);
  return g;
}
makeHeli(30, 30); makeHeli(-30, 30);

// Лодка
let boat = null;
function makeBoat() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(2, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
  b.position.y = 0.3; g.add(b);
  g.position.set(-30, 0.3, 0);
  g.userData = { angle: 0 };
  scene.add(g);
  boat = g;
  return g;
}
makeBoat();

// Пешеходы
const peds = [];
for (let i = 0; i < 30; i++) {
  const p = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1, 0.3), new THREE.MeshStandardMaterial({ color: `hsl(${Math.random()*360}, 50%, 50%)` }));
  b.position.y = 0.8; p.add(b);
  p.position.set((Math.random()-0.5)*150, 0, (Math.random()-0.5)*150);
  p.userData = { angle: Math.random()*Math.PI*2 };
  scene.add(p);
  peds.push(p);
}

// Пули
const bullets = [];

// ============ ЛОГИКА ============
let money = 0, wanted = 0, gameOver = false, inShop = false, isSwimming = false;
let nearestCar = null, drivingCar = null, flyingHeli = null, ridingBoat = null;
let carSpeed = 0, boatSpeed = 0, nearShopItem = null;

// UI
const uiMoney = document.getElementById('money');
const uiWanted = document.getElementById('wanted');
const uiTask = document.getElementById('task');
const uiMsg = document.getElementById('message');
const uiShopHint = document.getElementById('shop-ui');
function updateMoney() { uiMoney.textContent = money; }
function showMsg(text) { uiMsg.textContent = text; uiMsg.style.opacity = 1; clearTimeout(uiMsg.t); uiMsg.t = setTimeout(() => uiMsg.style.opacity = 0, 1500); }

// Управление
const joy = { active: false, x: 0, y: 0, startX: 0, startY: 0 };
const jz = document.getElementById('joystick-zone');
const jb = document.getElementById('joystick-base');
const jk = document.getElementById('joystick-knob');
jz.addEventListener('touchstart', e => {
  e.preventDefault(); const t = e.touches[0];
  joy.active = true; joy.startX = t.clientX; joy.startY = t.clientY;
  jb.style.display = 'block'; jb.style.left = (t.clientX - 60) + 'px'; jb.style.top = (t.clientY - 60) + 'px';
  jk.style.display = 'block'; jk.style.left = (t.clientX - 27) + 'px'; jk.style.top = (t.clientY - 27) + 'px';
}, { passive: false });
jz.addEventListener('touchmove', e => {
  e.preventDefault(); if (!joy.active) return;
  const t = e.touches[0]; let dx = t.clientX - joy.startX, dy = t.clientY - joy.startY;
  const d = Math.hypot(dx, dy); if (d > 60) { dx = dx/d*60; dy = dy/d*60; }
  joy.x = dx/60; joy.y = dy/60;
  jk.style.left = (joy.startX + dx - 27) + 'px'; jk.style.top = (joy.startY + dy - 27) + 'px';
}, { passive: false });
jz.addEventListener('touchend', e => {
  e.preventDefault(); joy.active = false; joy.x = 0; joy.y = 0;
  jb.style.display = 'none'; jk.style.display = 'none';
}, { passive: false });

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Кнопки
const actBtn = document.getElementById('action-btn');
const shootBtn = document.getElementById('shoot-btn');
const heliBtn = document.getElementById('heli-btn');
const boatBtn = document.getElementById('boat-btn');

function bind(b, fn) {
  b.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false });
  b.addEventListener('click', e => { e.preventDefault(); fn(); });
}

bind(actBtn, () => {
  if (inShop) return;
  if (drivingCar) { drivingCar = null; playerGroup.visible = true; showMsg('Вышел'); }
  else if (nearestCar) { drivingCar = nearestCar; playerGroup.visible = false; carSpeed = 0; showMsg('Сел в машину'); }
});
bind(heliBtn, () => {
  if (inShop) return;
  if (flyingHeli) { flyingHeli.position.y = 1; playerGroup.position.set(flyingHeli.position.x + 3, 0, flyingHeli.position.z); playerGroup.visible = true; flyingHeli = null; }
  else {
    let minD = 10; let n = null;
    helis.forEach(h => { const d = Math.hypot(h.position.x - playerGroup.position.x, h.position.z - playerGroup.position.z); if (d < minD) { minD = d; n = h; } });
    if (n) { flyingHeli = n; flyingHeli.position.y = 10; playerGroup.visible = false; showMsg('Взлёт'); }
  }
});
bind(boatBtn, () => {
  if (inShop) return;
  if (ridingBoat) { ridingBoat = null; playerGroup.position.set(boat.position.x, 0, RIVER_Y_START - 3); playerGroup.visible = true; }
  else if (boat) {
    const d = Math.hypot(boat.position.x - playerGroup.position.x, boat.position.z - playerGroup.position.z);
    if (d < 10) { ridingBoat = boat; playerGroup.visible = false; showMsg('Сел в лодку'); }
  }
});
bind(shootBtn, () => {
  if (inShop || flyingHeli) return;
  const dir = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), playerGroup.rotation.y);
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.2, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
  b.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.3, 0));
  b.userData = { vx: dir.x*60, vz: dir.z*60, life: 1.5 };
  scene.add(b); bullets.push(b);
});

// Коллизии
function collide(pos, rad) {
  for (const b of buildings) {
    const hp = buildingHealth.get(b.mesh) || 0;
    if (hp <= 0) continue;
    if (pos.x > b.x - b.w/2 - rad && pos.x < b.x + b.w/2 + rad && pos.z > b.z - b.d/2 - rad && pos.z < b.z + b.d/2 + rad) {
      const ox = pos.x - b.x, oz = pos.z - b.z;
      if (Math.abs(ox) > Math.abs(oz)) pos.x = b.x + Math.sign(ox) * (b.w/2 + rad);
      else pos.z = b.z + Math.sign(oz) * (b.d/2 + rad);
      return true;
    }
  }
  return false;
}
function isInRiver(x, z) {
  if (Math.abs(z) > 10) return false;
  if (Math.abs(x) < 7) return false; // мост
  if (Math.abs(z) < 2 && x > 30 && x < 100) return false; // мост на остров
  return true;
}

// Магазин
function enterShop() {
  inShop = true; shopInterior.visible = true; shopMesh.visible = false; shopMarker.visible = false;
  playerGroup.position.set(0, 0, 5);
  document.getElementById('exit-btn').style.display = 'flex';
  showMsg('В магазине');
}
function exitShop() {
  inShop = false; shopInterior.visible = false; shopMesh.visible = true; shopMarker.visible = true;
  playerGroup.position.set(50, 0, 25 + 6 + 4);
  document.getElementById('exit-btn').style.display = 'none';
  uiShopHint.style.display = 'none';
}

// ============ ОБНОВЛЕНИЕ ============
function update(dt) {
  if (gameOver) return;

  // Игрок
  if (!inShop) {
    const dxS = playerGroup.position.x - 50, dzS = playerGroup.position.z - (25 + 6 + 2);
    if (Math.hypot(dxS, dzS) < 3 && !drivingCar && !flyingHeli && !ridingBoat) enterShop();
  }

  let ix = joy.x, iz = joy.y;
  if (keys['w'] || keys['arrowup']) iz = -1;
  if (keys['s'] || keys['arrowdown']) iz = 1;
  if (keys['a'] || keys['arrowleft']) ix = -1;
  if (keys['d'] || keys['arrowright']) ix = 1;

  const len = Math.hypot(ix, iz);

  if (inShop) {
    if (len > 0.1) {
      ix /= len; iz /= len;
      playerGroup.position.x += ix * 4 * dt;
      playerGroup.position.z += iz * 4 * dt;
      playerGroup.position.x = Math.max(-8, Math.min(8, playerGroup.position.x));
      playerGroup.position.z = Math.max(-6, Math.min(8, playerGroup.position.z));
    }
    nearShopItem = null; let minD = 3;
    shopItems3D.forEach(item => { const d = item.position.distanceTo(playerGroup.position); if (d < minD) { minD = d; nearShopItem = item; } });
    if (nearShopItem) {
      document.getElementById('buy-btn').style.display = 'flex';
      document.getElementById('buy-btn').textContent = 'КУПИТЬ ' + nearShopItem.userData.price;
    } else {
      document.getElementById('buy-btn').style.display = 'none';
    }
  } else if (drivingCar) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    if (th > 0) carSpeed += 15 * dt;
    else if (th < 0) carSpeed -= 20 * dt;
    else carSpeed *= 0.95;
    carSpeed = Math.max(-10, Math.min(25, carSpeed));
    if (Math.abs(carSpeed) > 0.5) drivingCar.rotation.y -= st * 2 * dt * Math.sign(carSpeed);
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), drivingCar.rotation.y);
    const nx = drivingCar.position.x + fwd.x * carSpeed * dt;
    const nz = drivingCar.position.z + fwd.z * carSpeed * dt;
    if (!isInRiver(nx, nz)) { drivingCar.position.x = nx; drivingCar.position.z = nz; }
    collide(drivingCar.position, 1.5);
    playerGroup.position.copy(drivingCar.position);
  } else if (flyingHeli) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    if (keys['q']) flyingHeli.position.y += 10 * dt;
    if (keys['e']) flyingHeli.position.y -= 10 * dt;
    flyingHeli.position.y = Math.max(2, Math.min(50, flyingHeli.position.y));
    flyingHeli.userData.angle -= st * 1.5 * dt;
    flyingHeli.rotation.y = flyingHeli.userData.angle;
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), flyingHeli.userData.angle);
    flyingHeli.position.x += fwd.x * th * 25 * dt;
    flyingHeli.position.z += fwd.z * th * 25 * dt;
    playerGroup.position.copy(flyingHeli.position);
    playerGroup.position.y -= 3;
    flyingHeli.userData.rot.rotation.y += 20 * dt;
  } else if (ridingBoat) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    if (th > 0) boatSpeed += 10 * dt;
    else if (th < 0) boatSpeed -= 10 * dt;
    else boatSpeed *= 0.95;
    boatSpeed = Math.max(-5, Math.min(15, boatSpeed));
    if (Math.abs(boatSpeed) > 0.5) boat.rotation.y -= st * 1.5 * dt * Math.sign(boatSpeed);
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), boat.rotation.y);
    const nx = boat.position.x + fwd.x * boatSpeed * dt;
    const nz = boat.position.z + fwd.z * boatSpeed * dt;
    if (!isInRiver(nx, nz)) { boat.position.x = nx; boat.position.z = nz; }
    playerGroup.position.copy(boat.position);
    playerGroup.position.y = 0;
  } else {
    const inWater = isInRiver(playerGroup.position.x, playerGroup.position.z);
    if (inWater !== isSwimming) { isSwimming = inWater; showMsg(isSwimming ? 'Плывёшь' : 'На берегу'); }
    if (len > 0.1) {
      ix /= len; iz /= len;
      const sp = isSwimming ? 3 : 6;
      const nx = playerGroup.position.x + ix * sp * dt;
      const nz = playerGroup.position.z + iz * sp * dt;
      if (isSwimming || !isInRiver(nx, nz)) { playerGroup.position.x = nx; playerGroup.position.z = nz; }
      if (!isSwimming) collide(playerGroup.position, 0.5);
      playerGroup.rotation.y = Math.atan2(ix, iz);
    }
    playerGroup.position.y = isSwimming ? -0.3 : 0;
  }

  // Лыжник
  skier.position.z += 8 * dt;
  if (skier.position.z > -70) skier.position.z = -90;
  skier.position.x = -50 + Math.sin(skier.position.z * 0.1) * 10;

  // Медведи
  bears.forEach(b => {
    b.position.x += Math.sin(b.userData.angle) * b.userData.speed * dt;
    b.position.z += Math.cos(b.userData.angle) * b.userData.speed * dt;
    b.rotation.y = b.userData.angle;
    if (b.position.x < -100 || b.position.x > -40) b.userData.angle += Math.PI;
    if (b.position.z < 60 || b.position.z > 110) b.userData.angle += Math.PI;
    if (b.position.distanceTo(playerGroup.position) < 3 && !inShop && !flyingHeli) {
      showMsg('Медведь!'); playerGroup.position.x += 5; playerGroup.position.z += 5;
    }
  });

  // Полиция
  if (wanted > 0) {
    cops.forEach(c => {
      if (c === drivingCar) return;
      const dx = playerGroup.position.x - c.position.x, dz = playerGroup.position.z - c.position.z;
      c.rotation.y = Math.atan2(dx, dz);
      c.position.x += Math.sin(c.rotation.y) * 6 * dt;
      c.position.z += Math.cos(c.rotation.y) * 6 * dt;
      if (Math.hypot(dx, dz) < 4) {
        gameOver = true; document.getElementById('hud').innerHTML = '<h1 style="color:red; text-align:center; margin-top:100px;">АРЕСТ!</h1>';
      }
    });
  }

  // Пешеходы
  peds.forEach(p => {
    p.position.x += Math.sin(p.userData.angle) * 2 * dt;
    p.position.z += Math.cos(p.userData.angle) * 2 * dt;
    p.rotation.y = p.userData.angle;
    if (Math.random() < 0.01) p.userData.angle += (Math.random() - 0.5);
    if (collide(p.position, 0.5)) p.userData.angle += Math.PI;
  });

  // Пули
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.x += b.userData.vx * dt;
    b.position.z += b.userData.vz * dt;
    b.userData.life -= dt;
    let hit = false;
    for (let j = peds.length - 1; j >= 0; j--) {
      if (b.position.distanceTo(peds[j].position) < 1.5) {
        scene.remove(peds[j]); peds.splice(j, 1); hit = true;
        wanted = Math.min(wanted + 1, 5); uiWanted.style.display = 'inline'; uiWanted.textContent = '⭐'.repeat(wanted);
        money += 10; updateMoney();
        break;
      }
    }
    if (hit || b.userData.life <= 0) { scene.remove(b); bullets.splice(i, 1); }
  }

  // Камера
  const camOff = new THREE.Vector3(0, 7, -10);
  camOff.applyAxisAngle(new THREE.Vector3(0,1,0), playerGroup.rotation.y);
  camera.position.lerp(playerGroup.position.clone().add(camOff), 0.1);
  camera.lookAt(playerGroup.position);
}

// ============ АНИМАЦИЯ ============
const clock = new THREE.Clock();
let frames = 0, last = performance.now();

function animate() {
  requestAnimationFrame(animate);
  if (gameOver) { renderer.render(scene, camera); return; }
  const dt = Math.min(clock.getDelta(), 0.05);

  update(dt);

  // UI видимость
  if (!inShop) {
    document.getElementById('exit-btn').style.display = 'none';
    document.getElementById('buy-btn').style.display = 'none';
    actBtn.style.display = (!drivingCar && nearestCar) ? 'flex' : (drivingCar ? 'flex' : 'none');
    actBtn.textContent = drivingCar ? 'ВЫЙТИ' : 'СЕСТЬ';
    shootBtn.style.display = (!flyingHeli && !ridingBoat && !inShop) ? 'flex' : 'none';
    heliBtn.style.display = (!flyingHeli && !inShop) ? 'flex' : 'none';
    boatBtn.style.display = (!ridingBoat && !inShop) ? 'flex' : 'none';
  }

  // Поиск машины
  if (!drivingCar && !inShop) {
    let minD = 5; nearestCar = null;
    cars.forEach(c => { const d = c.position.distanceTo(playerGroup.position); if (d < minD) { minD = d; nearestCar = c; } });
  }

  renderer.render(scene, camera);

  frames++;
  if (performance.now() - last > 1000) {
    document.getElementById('fps-counter').textContent = 'FPS: ' + frames;
    frames = 0; last = performance.now();
  }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Старт
setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('top-btns').style.display = 'flex';
  animate();
}, 300);
</script>
