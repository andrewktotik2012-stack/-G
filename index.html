<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Mini-GTA MEGA 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, Arial, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 10px 14px;
    color: #fff;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    text-shadow: 0 2px 6px #000;
    pointer-events: none;
    z-index: 10;
    font-weight: 600;
  }
  #hud .money { color: #4dff88; }
  #hud .wanted { color: #ff4444; }
  #hud .task {
    background: rgba(0,0,0,0.55);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 400;
    max-width: 60vw;
    text-align: center;
    border-left: 3px solid #ffdd00;
  }
  #hud .race {
    background: rgba(255,50,50,0.7);
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-top: 4px;
  }

  /* Кнопки действий */
  .action-btn {
    position: absolute;
    width: 85px; height: 85px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-weight: 800;
    font-size: 12px;
    z-index: 20;
    border: 3px solid #fff;
    letter-spacing: 1px;
    color: #000;
  }
  #action-btn {
    bottom: 40px; right: 30px;
    background: rgba(255, 220, 0, 0.9);
    box-shadow: 0 0 25px rgba(255, 220, 0, 0.7);
  }
  #shoot-btn {
    bottom: 40px; right: 130px;
    background: rgba(255, 80, 80, 0.9);
    box-shadow: 0 0 25px rgba(255, 80, 80, 0.7);
    color: #fff;
  }
  #race-btn {
    bottom: 140px; right: 30px;
    background: rgba(80, 200, 255, 0.9);
    box-shadow: 0 0 25px rgba(80, 200, 255, 0.7);
  }
  #heli-btn {
    bottom: 140px; right: 130px;
    background: rgba(180, 100, 255, 0.9);
    box-shadow: 0 0 25px rgba(180, 100, 255, 0.7);
    color: #fff;
  }

  #joystick-zone {
    position: absolute;
    bottom: 0; left: 0;
    width: 50%; height: 50%;
    z-index: 15;
  }
  #joystick-base {
    position: absolute;
    width: 130px; height: 130px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    display: none;
    pointer-events: none;
  }
  #joystick-knob {
    position: absolute;
    width: 60px; height: 60px;
    border-radius: 50%;
    background: rgba(255,255,255,0.75);
    box-shadow: 0 0 15px rgba(255,255,255,0.7);
    display: none;
    pointer-events: none;
  }

  #loading {
    position: absolute; inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #4dff88;
    font-size: 22px;
    background: #000;
    z-index: 100;
    gap: 20px;
  }
  #loading .spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(77,255,136,0.3);
    border-top-color: #4dff88;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #message {
    position: absolute;
    top: 25%; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 20px;
    font-weight: 800;
    text-shadow: 0 0 15px #000;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    z-index: 30;
    text-align: center;
    white-space: nowrap;
    padding: 10px 20px;
    background: rgba(0,0,0,0.5);
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.3);
  }

  #minimap {
    position: absolute;
    top: 70px; right: 12px;
    width: 110px; height: 110px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.5);
    z-index: 12;
    box-shadow: 0 0 15px rgba(0,0,0,0.6);
  }

  #reset-btn {
    position: absolute;
    top: 70px; left: 12px;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    color: #fff;
    font-size: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    font-weight: bold;
  }

  #gameover-modal {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.85);
    color: #fff;
    z-index: 50;
    text-align: center;
    padding: 20px;
  }
  #gameover-modal h1 { color: #ff4444; font-size: 32px; margin-bottom: 15px; }
  #gameover-modal p { font-size: 18px; margin: 6px 0; color: #ccc; }
  #gameover-modal .big { font-size: 28px; color: #4dff88; font-weight: bold; margin: 15px 0; }
  #gameover-modal button {
    margin-top: 25px;
    padding: 15px 40px;
    font-size: 18px;
    background: #4dff88;
    color: #000;
    border: none;
    border-radius: 12px;
    font-weight: bold;
  }

  /* Кровь/прицел */
  #crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 30px; height: 30px;
    border: 2px solid rgba(255,80,80,0.8);
    border-radius: 50%;
    display: none;
    z-index: 11;
    pointer-events: none;
  }
  #crosshair::before, #crosshair::after {
    content: '';
    position: absolute;
    background: rgba(255,80,80,0.8);
  }
  #crosshair::before {
    top: 50%; left: -8px; right: -8px; height: 2px;
    transform: translateY(-50%);
  }
  #crosshair::after {
    left: 50%; top: -8px; bottom: -8px; width: 2px;
    transform: translateX(-50%);
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>Строим мега-город...</div>
</div>

<div id="hud" style="display:none">
  <div>
    💰 <span class="money" id="money">0</span>
    <br>
    ⭐ <span class="wanted" id="wanted" style="display:none">0</span>
    <div id="race-hud" style="display:none"></div>
  </div>
  <div>
    <div class="task" id="task">Найди жёлтую метку</div>
  </div>
</div>

<canvas id="minimap" width="220" height="220"></canvas>
<div id="reset-btn">↻</div>
<div id="crosshair"></div>

<div id="joystick-zone" style="display:none">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="action-btn" class="action-btn">СЕСТЬ</div>
<div id="shoot-btn" class="action-btn">🔫</div>
<div id="race-btn" class="action-btn">🏁<br>ГОНКА</div>
<div id="heli-btn" class="action-btn">🚁<br>ВЕРТОЛЁТ</div>

<div id="message"></div>

<div id="gameover-modal">
  <h1 id="go-title">Игра окончена</h1>
  <p id="go-subtitle">Тебя поймала полиция!</p>
  <div class="big">💰 <span id="final-money">0</span></div>
  <p>Рекорд: <span id="best-money">0</span></p>
  <button onclick="resetGame()">Играть снова</button>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 80, 220);

const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ СВЕТ ============
const ambient = new THREE.AmbientLight(0xffffff, 0.55);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.4);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -120, right: 120, top: 120, bottom: -120, far: 250 });
scene.add(sun);

// ============ ЗЕМЛЯ ============
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x3a5a3a })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ============ ГОРОД ============
const CITY_SIZE = 240;
const BLOCK = 30;
const ROAD_WIDTH = 10;
const buildings = [];
const BUILDING_COLORS = [0x8899aa, 0xaa9988, 0x778899, 0x998877, 0xaaaabb, 0x9a8a7a, 0x8a9a8a];
const windowMaterial = new THREE.MeshBasicMaterial({ color: 0xffee88 });
const windowMaterialBlue = new THREE.MeshBasicMaterial({ color: 0x88ccff });

function makeBuilding(x, z, w, d, h) {
  const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w, h, d),
    new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1 })
  );
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  const rows = Math.floor(h / 2.5);
  const cols = Math.floor(w / 2);
  for (let r = 1; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (Math.random() > 0.55) {
        const win = new THREE.Mesh(
          new THREE.PlaneGeometry(0.7, 0.9),
          Math.random() > 0.5 ? windowMaterial : windowMaterialBlue
        );
        win.position.set(x - w / 2 + 1.2 + c * 2, r * 2.5, z + d / 2 + 0.02);
        scene.add(win);
      }
    }
  }
  buildings.push({ x, z, w, d, h });
}

for (let bx = -CITY_SIZE / 2; bx < CITY_SIZE / 2; bx += BLOCK) {
  for (let bz = -CITY_SIZE / 2; bz < CITY_SIZE / 2; bz += BLOCK) {
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadH.rotation.x = -Math.PI / 2;
    roadH.position.set(bx + BLOCK / 2, 0.01, bz);
    scene.add(roadH);

    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, ROAD_WIDTH), roadMat);
    roadV.rotation.x = -Math.PI / 2;
    roadV.rotation.z = Math.PI / 2;
    roadV.position.set(bx, 0.01, bz + BLOCK / 2);
    scene.add(roadV);

    const qSize = BLOCK - ROAD_WIDTH;
    const n = 1 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      const w = 4 + Math.random() * 7;
      const d = 4 + Math.random() * 7;
      const h = 6 + Math.random() * 22;
      const ox = (Math.random() - 0.5) * (qSize - w - 1);
      const oz = (Math.random() - 0.5) * (qSize - d - 1);
      makeBuilding(bx + BLOCK / 2 + ox, bz + BLOCK / 2 + oz, w, d, h);
    }
  }
}

// ============ ИГРОК ============
const playerGroup = new THREE.Group();

const torso = new THREE.Mesh(
  new THREE.BoxGeometry(0.7, 1.2, 0.4),
  new THREE.MeshStandardMaterial({ color: 0x2255cc })
);
torso.position.y = 1.1;
torso.castShadow = true;
playerGroup.add(torso);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 16, 16),
  new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 2;
head.castShadow = true;
playerGroup.add(head);

// Оружие
const gun = new THREE.Mesh(
  new THREE.BoxGeometry(0.15, 0.15, 0.8),
  new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 })
);
gun.position.set(0.5, 1.3, 0.3);
playerGroup.add(gun);

const legs = [];
for (let i = 0; i < 2; i++) {
  const leg = new THREE.Mesh(
    new THREE.BoxGeometry(0.28, 1, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x333344 })
  );
  leg.position.set(i === 0 ? -0.18 : 0.18, 0.5, 0);
  leg.castShadow = true;
  playerGroup.add(leg);
  legs.push(leg);
}

const arms = [];
for (let i = 0; i < 2; i++) {
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.22, 0.9, 0.28),
    new THREE.MeshStandardMaterial({ color: 0x2255cc })
  );
  arm.position.set(i === 0 ? -0.5 : 0.5, 1.3, 0);
  arm.castShadow = true;
  playerGroup.add(arm);
  arms.push(arm);
}

playerGroup.position.set(5, 0, 5);
scene.add(playerGroup);

// ============ МАШИНЫ ============
const cars = [];
const CAR_TYPES = [
  { name: 'sedan', color: 0x22aaff, speed: 18, size: [2, 0.6, 4] },
  { name: 'sport', color: 0xff2222, speed: 26, size: [2, 0.5, 4.5] },
  { name: 'taxi', color: 0xffff22, speed: 16, size: [2, 0.7, 4] },
  { name: 'van', color: 0xffffff, speed: 14, size: [2.2, 1, 5] },
  { name: 'police', color: 0x111111, speed: 24, size: [2, 0.7, 4.2] }
];

function makeCar(x, z, typeName, angle = 0) {
  const type = CAR_TYPES.find(t => t.name === typeName) || CAR_TYPES[0];
  const g = new THREE.Group();
  const [sw, sh, sl] = type.size;

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(sw, sh, sl),
    new THREE.MeshStandardMaterial({ color: type.color, metalness: 0.6, roughness: 0.3 })
  );
  body.position.y = sh / 2 + 0.1;
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(sw * 0.85, sh * 0.9, sl * 0.5),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.9, roughness: 0.1 })
  );
  cabin.position.set(0, sh + 0.3, -sl * 0.1);
  cabin.castShadow = true;
  g.add(cabin);

  const wGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 12);
  wGeo.rotateZ(Math.PI / 2);
  const wMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-sw/2, 0.35, sl/2-0.8], [sw/2, 0.35, sl/2-0.8], [-sw/2, 0.35, -sl/2+0.8], [sw/2, 0.35, -sl/2+0.8]]
    .forEach(([px, py, pz]) => {
      const w = new THREE.Mesh(wGeo, wMat);
      w.position.set(px, py, pz);
      w.castShadow = true;
      g.add(w);
    });

  const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
  [[-sw/2+0.4], [sw/2-0.4]].forEach(([px]) => {
    const light = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.1), lightMat);
    light.position.set(px, sh/2, -sl/2 - 0.01);
    g.add(light);
  });

  if (typeName === 'police') {
    const sirenR = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
    sirenR.position.set(-0.4, sh + 0.9, 0);
    g.add(sirenR);
    const sirenB = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x0000ff }));
    sirenB.position.set(0.4, sh + 0.9, 0);
    g.add(sirenB);
    g.userData.sirenR = sirenR;
    g.userData.sirenB = sirenB;
  }

  g.position.set(x, 0, z);
  g.rotation.y = angle;
  g.userData.type = type;
  g.userData.isPolice = typeName === 'police';
  scene.add(g);
  cars.push(g);
  return g;
}

for (let i = 0; i < 25; i++) {
  let x, z, angle;
  if (Math.random() > 0.5) {
    x = (Math.random() - 0.5) * CITY_SIZE;
    z = Math.round((Math.random() - 0.5) * (CITY_SIZE / BLOCK)) * BLOCK;
    angle = Math.random() > 0.5 ? 0 : Math.PI;
  } else {
    x = Math.round((Math.random() - 0.5) * (CITY_SIZE / BLOCK)) * BLOCK;
    z = (Math.random() - 0.5) * CITY_SIZE;
    angle = Math.random() > 0.5 ? Math.PI / 2 : -Math.PI / 2;
  }
  const types = ['sedan', 'sport', 'taxi', 'van', 'sedan', 'taxi'];
  makeCar(x, z, types[Math.floor(Math.random() * types.length)], angle);
}

const policeCars = [];
for (let i = 0; i < 3; i++) {
  policeCars.push(makeCar((Math.random() - 0.5) * CITY_SIZE, (Math.random() - 0.5) * CITY_SIZE, 'police'));
}

// ============ ВЕРТОЛЁТЫ ============
const helis = [];
function makeHeli(x, z) {
  const g = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.SphereGeometry(1.2, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.7, roughness: 0.3 })
  );
  body.scale.set(1.5, 1, 1.8);
  body.castShadow = true;
  g.add(body);

  const cabin = new THREE.Mesh(
    new THREE.SphereGeometry(0.9, 16, 12),
    new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.7 })
  );
  cabin.position.set(0, 0.2, 0.5);
  cabin.scale.set(1.2, 0.9, 1.2);
  g.add(cabin);

  const tail = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.4, 3),
    new THREE.MeshStandardMaterial({ color: 0x222222 })
  );
  tail.position.set(0, 0.3, -2.5);
  g.add(tail);

  const rotor = new THREE.Mesh(
    new THREE.BoxGeometry(6, 0.1, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  rotor.position.y = 1.5;
  g.add(rotor);

  const tailRotor = new THREE.Mesh(
    new THREE.BoxGeometry(0.1, 2.5, 0.2),
    new THREE.MeshStandardMaterial({ color: 0x555555 })
  );
  tailRotor.position.set(0, 0.3, -4);
  g.add(tailRotor);

  g.position.set(x, 8, z);
  g.userData = {
    rotor, tailRotor,
    speed: 0,
    vy: 0,
    angle: 0
  };
  scene.add(g);
  helis.push(g);
  return g;
}

makeHeli(20, 20);
makeHeli(-30, -20);

// ============ ПЕШЕХОДЫ ============
const pedestrians = [];
const PED_COLORS = [0xcc4444, 0x44cc44, 0x4444cc, 0xccaa44, 0xaa44cc, 0x44ccaa, 0xffffff];
const PED_SKIN = [0xffcc99, 0xdd9966, 0xaa7744, 0xffddbb];

function makePedestrian(x, z) {
  const g = new THREE.Group();
  const color = PED_COLORS[Math.floor(Math.random() * PED_COLORS.length)];
  const skin = PED_SKIN[Math.floor(Math.random() * PED_SKIN.length)];

  const torso = new THREE.Mesh(
    new THREE.BoxGeometry(0.6, 1, 0.35),
    new THREE.MeshStandardMaterial({ color })
  );
  torso.position.y = 1;
  torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.27, 12, 12),
    new THREE.MeshStandardMaterial({ color: skin })
  );
  head.position.y = 1.75;
  head.castShadow = true;
  g.add(head);

  const legGeo = new THREE.BoxGeometry(0.22, 0.8, 0.25);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x333344 });
  const l1 = new THREE.Mesh(legGeo, legMat);
  l1.position.set(-0.15, 0.4, 0);
  l1.castShadow = true;
  g.add(l1);
  const l2 = new THREE.Mesh(legGeo, legMat);
  l2.position.set(0.15, 0.4, 0);
  l2.castShadow = true;
  g.add(l2);

  g.position.set(x, 0, z);
  g.userData = {
    leg1: l1, leg2: l2,
    angle: Math.random() * Math.PI * 2,
    speed: 1.2 + Math.random() * 1.5,
    walkCycle: Math.random() * 10,
    panic: 0,
    alive: true
  };
  scene.add(g);
  pedestrians.push(g);
  return g;
}

for (let i = 0; i < 30; i++) {
  makePedestrian((Math.random() - 0.5) * CITY_SIZE, (Math.random() - 0.5) * CITY_SIZE);
}

// ============ МИССИИ ============
let missionMarker = null;
function spawnMissionMarker() {
  if (missionMarker) {
    if (missionMarker.userData.ring) scene.remove(missionMarker.userData.ring);
    scene.remove(missionMarker);
  }
  const geo = new THREE.CylinderGeometry(2.5, 2.5, 6, 32, 1, true);
  const mat = new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 0.4, side: THREE.DoubleSide });
  missionMarker = new THREE.Mesh(geo, mat);
  const x = (Math.random() - 0.5) * (CITY_SIZE - 40);
  const z = (Math.random() - 0.5) * (CITY_SIZE - 40);
  missionMarker.position.set(x, 3, z);

  const ring = new THREE.Mesh(
    new THREE.RingGeometry(2.5, 3, 32),
    new THREE.MeshBasicMaterial({ color: 0xffdd00, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.set(x, 0.1, z);
  scene.add(ring);
  missionMarker.userData.ring = ring;

  scene.add(missionMarker);
}
spawnMissionMarker();

// ============ ПУЛИ ============
const bullets = [];
const enemyBullets = [];
function shoot(from, direction, isEnemy = false) {
  const b = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 6, 6),
    new THREE.MeshBasicMaterial({ color: isEnemy ? 0xff4444 : 0xffff00 })
  );
  b.position.copy(from);
  b.userData = {
    vx: direction.x * 60,
    vy: direction.y * 60,
    vz: direction.z * 60,
    life: 1.5
  };
  scene.add(b);
  (isEnemy ? enemyBullets : bullets).push(b);
  beep(isEnemy ? 300 : 900, 0.05, 'square', 0.05);
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.x += b.userData.vx * dt;
    b.position.y += b.userData.vy * dt;
    b.position.z += b.userData.vz * dt;
    b.userData.life -= dt;

    // Проверка попадания
    let hit = false;
    for (const car of cars) {
      if (car === drivingCar) continue;
      if (car.position.distanceTo(b.position) < 2) {
        explode(car.position.x, 1, car.position.z, 0xffaa00, 15);
        scene.remove(car);
        cars.splice(cars.indexOf(car), 1);
        money += 50;
        updateMoney();
        wanted = Math.min(wanted + 1, 5);
        updateWanted();
        hit = true;
        break;
      }
    }

    if (!hit) {
      for (const p of pedestrians) {
        if (!p.userData.alive) continue;
        if (p.position.distanceTo(b.position) < 1) {
          p.userData.alive = false;
          p.visible = false;
          explode(p.position.x, 1, p.position.z, 0xcc0000, 10);
          wanted = Math.min(wanted + 1, 5);
          updateWanted();
          hit = true;
          break;
        }
      }
    }

    if (hit || b.userData.life <= 0) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    b.position.x += b.userData.vx * dt;
    b.position.y += b.userData.vy * dt;
    b.position.z += b.userData.vz * dt;
    b.userData.life -= dt;

    const target = drivingCar ? drivingCar.position : playerGroup.position;
    if (b.position.distanceTo(target) < 1.5) {
      endGame('Тебя застрелила полиция!');
    }

    if (b.userData.life <= 0) {
      scene.remove(b);
      enemyBullets.splice(i, 1);
    }
  }
}

const particles = [];
function explode(x, y, z, color, count = 20) {
  for (let i = 0; i < count; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.15 + Math.random() * 0.2, 6, 6),

    );

      vz: (Math.random() - 0.5) * 8,
      life: 1
    };
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.position.x += p.userData.vx * dt;
    p.position.y += p.userData.vy * dt;
    p.position.z += p.userData.vz * dt;
    p.userData.vy -= 15 * dt;
    p.userData.life -= dt * 1.5;
    p.scale.setScalar(Math.max(0, p.userData.life));
    p.material.opacity = Math.max(0, p.userData.life);
    p.material.transparent = true;
    if (p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

// ============ ЗВУКИ ============
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep(freq, dur = 0.1, type = 'sine', vol = 0.1) {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

const MAX_DIST = 60;

joystickZone.addEventListener('touchstart', e => {

// ============ КОЛЛИЗИИ ============
function collideBuilding(pos, radius) {
  for (const b of buildings) {
    const minX = b.x - b.w / 2 - radius;
    const maxX = b.x + b.w / 2 + radius;
    const minZ = b.z - b.d / 2 - radius;
    const maxZ = b.z + b.d / 2 + radius;
    if (pos.x > minX && pos.x < maxX && pos.z > minZ && pos.z < maxZ) {
      const ox = pos.x - b.x, oz = pos.z - b.z;
      if (Math.abs(ox) > Math.abs(oz)) pos.x = b.x + Math.sign(ox) * (b.w / 2 + radius);
      else pos.z = b.z + Math.sign(oz) * (b.d / 2 + radius);
      return true;
    }
  }
  return false;
}

// ============ ОБНОВЛЕНИЯ ============
let walkCycle = 0;

function updatePlayer(dt) {
  let dx = joystick.x, dz = joystick.y;
  if (keys['w'] || keys['ц']) dz = -1;
  if (keys['s'] || keys['ы']) dz = 1;
  if (keys['a'] || keys['ф']) dx = -1;
  if (keys['d'] || keys['в']) dx = 1;
  if (keys['arrowup']) dz = -1;
  if (keys['arrowdown']) dz = 1;
  if (keys['arrowleft']) dx = -1;
  if (keys['arrowright']) dx = 1;

  const len = Math.hypot(dx, dz);
  if (len > 0.1 && !drivingCar && !flyingHeli) {
    dx /= len; dz /= len;
    playerGroup.position.x += dx * 5 * dt;
    playerGroup.position.z += dz * 5 * dt;
    collideBuilding(playerGroup.position, 0.5);
    playerGroup.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, playerGroup.position.x));
    playerGroup.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, playerGroup.position.z));
    playerGroup.rotation.y = Math.atan2(dx, dz);
    walkCycle += dt * 10;
    legs[0].rotation.x = Math.sin(walkCycle) * 0.6;
    legs[1].rotation.x = -Math.sin(walkCycle) * 0.6;
    arms[0].rotation.x = -Math.sin(walkCycle) * 0.4;
    arms[1].rotation.x = Math.sin(walkCycle) * 0.4;
  } else {
    legs[0].rotation.x *= 0.9;
    legs[1].rotation.x *= 0.9;
    arms[0].rotation.x *= 0.9;
    arms[1].rotation.x *= 0.9;
  }
}

function updateCar(dt) {
  if (!drivingCar) return;
  let throttle = 0, steer = 0;
  if (joystick.active) { throttle = -joystick.y; steer = joystick.x; }
  if (keys['w'] || keys['arrowup'] || keys['ц']) throttle = 1;
  if (keys['s'] || keys['arrowdown'] || keys['ы']) throttle = -1;
  if (keys['a'] || keys['arrowleft'] || keys['ф']) steer = -1;
  if (keys['d'] || keys['arrowright'] || keys['в']) steer = 1;

  const maxSpeed = drivingCar.userData.type.speed;
  const accel = 14;

  if (throttle > 0) carSpeed += accel * dt;
  else if (throttle < 0) carSpeed -= accel * 1.5 * dt;
  else carSpeed *= 0.96;

  carSpeed = Math.max(-maxSpeed * 0.4, Math.min(maxSpeed, carSpeed));

  if (Math.abs(carSpeed) > 0.3) {
    drivingCar.rotation.y -= steer * 1.8 * dt * Math.sign(carSpeed);
  }

  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), drivingCar.rotation.y);
  drivingCar.position.addScaledVector(forward, carSpeed * dt);

  const hit = collideBuilding(drivingCar.position, 1.5);
  drivingCar.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, drivingCar.position.x));
  drivingCar.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, drivingCar.position.z));

  if (hit && Math.abs(carSpeed) > 8) {
    explode(drivingCar.position.x, 1, drivingCar.position.z, 0xffaa00, 8);
    beep(120, 0.15, 'sawtooth', 0.2);
    carSpeed *= -0.3;
  } else if (hit) {
    carSpeed *= -0.5;
  }

  pedestrians.forEach(p => {
    if (!p.userData.alive) return;
    if (p.position.distanceTo(drivingCar.position) < 1.8 && Math.abs(carSpeed) > 5) {
      p.userData.alive = false;
      p.visible = false;
      explode(p.position.x, 1, p.position.z, 0xcc0000, 15);
      wanted = Math.min(wanted + 1, 5);
      updateWanted();
      beep(200, 0.2, 'sawtooth', 0.15);
    }
  });

  playerGroup.position.copy(drivingCar.position);
}

function updateHeli(dt) {
  if (!flyingHeli) {
    // Просто вращаем винты
    helis.forEach(h => {
      h.userData.rotor.rotation.y += dt * 20;
      h.userData.tailRotor.rotation.z += dt * 30;
    });
    return;
  }

  let throttle = 0, steer = 0;
  if (joystick.active) { throttle = -joystick.y; steer = joystick.x; }
  if (keys['w'] || keys['arrowup']) throttle = 1;
  if (keys['s'] || keys['arrowdown']) throttle = -1;
  if (keys['a'] || keys['arrowleft']) steer = -1;
  if (keys['d'] || keys['arrowright']) steer = 1;
  if (keys['q']) flyingHeli.position.y += 10 * dt;
  if (keys['e']) flyingHeli.position.y -= 10 * dt;

  flyingHeli.userData.angle -= steer * 1.5 * dt;
  flyingHeli.rotation.y = flyingHeli.userData.angle;

  const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), flyingHeli.userData.angle);
  flyingHeli.position.addScaledVector(forward, throttle * 25 * dt);

  // Автовысота для тача
  if (joystick.active && Math.abs(joystick.y) < 0.2) {
    // нейтрально
  }

  flyingHeli.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, flyingHeli.position.x));
  flyingHeli.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, flyingHeli.position.z));
  flyingHeli.position.y = Math.max(3, Math.min(60, flyingHeli.position.y));

  flyingHeli.userData.rotor.rotation.y += dt * 50;
  flyingHeli.userData.tailRotor.rotation.z += dt * 80;

  playerGroup.position.copy(flyingHeli.position);
  playerGroup.position.y -= 3;
}

function updatePolice(dt) {
  if (wanted === 0) return;
  const target = drivingCar ? drivingCar.position : (flyingHeli ? flyingHeli.position : playerGroup.position);

  policeCars.forEach(pc => {
    if (pc === drivingCar) return;
    const dir = target.clone().sub(pc.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist > 1 && dist < 80) {
      dir.normalize();
      const targetAngle = Math.atan2(dir.x, dir.z);
      let diff = targetAngle - pc.rotation.y;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      pc.rotation.y += Math.sign(diff) * Math.min(Math.abs(diff), 2.5 * dt);

      const speed = 8 + wanted * 3;
      pc.position.x += Math.sin(pc.rotation.y) * speed * dt;
      pc.position.z += Math.cos(pc.rotation.y) * speed * dt;
      collideBuilding(pc.position, 1.5);

      // Стреляют по игроку с 2+ звёзд
      if (wanted >= 2 && Math.random() < 0.02 && dist < 30) {
        const from = pc.position.clone().add(new THREE.Vector3(0, 1, 0));
        const dirShot = target.clone().sub(from).normalize();
        shoot(from, dirShot, true);
      }
    }

    if (pc.userData.sirenR) {
      const t = performance.now() * 0.005;
      pc.userData.sirenR.material.color.setHex(Math.sin(t) > 0 ? 0xff0000 : 0x440000);
      pc.userData.sirenB.material.color.setHex(Math.sin(t) > 0 ? 0x000044 : 0x0000ff);
    }

    if (pc.position.distanceTo(target) < 3 && wanted >= 1) {
      endGame('Тебя поймала полиция!');
    }
  });
}

function updatePedestrians(dt) {
  pedestrians.forEach(p => {
    if (!p.userData.alive) return;
    const target = drivingCar ? drivingCar.position : playerGroup.position;
    const d = p.position.distanceTo(target);
    if (d < 8) p.userData.panic = 2;
    if (p.userData.panic > 0) {
      p.userData.panic -= dt;
      const dx = p.position.x - target.x;
      const dz = p.position.z - target.z;
      const len = Math.hypot(dx, dz);
      if (len > 0.01) {
        p.userData.angle = Math.atan2(dx / len, dz / len);
        p.position.x += Math.sin(p.userData.angle) * p.userData.speed * 2.5 * dt;
        p.position.z += Math.cos(p.userData.angle) * p.userData.speed * 2.5 * dt;
      }
    } else {
      p.position.x += Math.sin(p.userData.angle) * p.userData.speed * dt;
      p.position.z += Math.cos(p.userData.angle) * p.userData.speed * dt;
      if (Math.random() < 0.005) p.userData.angle += (Math.random() - 0.5);
    }

    if (collideBuilding(p.position, 0.4)) p.userData.angle += Math.PI * 0.7;
    p.position.x = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, p.position.x));
    p.position.z = Math.max(-CITY_SIZE / 2, Math.min(CITY_SIZE / 2, p.position.z));
    p.rotation.y = p.userData.angle;
    p.userData.walkCycle += dt * 8;
    p.userData.leg1.rotation.x = Math.sin(p.userData.walkCycle) * 0.5;
    p.userData.leg2.rotation.x = -Math.sin(p.userData.walkCycle) * 0.5;
  });
}

function updateMission(dt) {
  if (!missionMarker) return;
  missionMarker.rotation.y += dt * 0.5;
  const t = performance.now() * 0.003;
  missionMarker.scale.setScalar(1 + Math.sin(t) * 0.1);
  if (missionMarker.userData.ring) {
    missionMarker.userData.ring.scale.setScalar(1 + (performance.now() * 0.001) % 1);
    missionMarker.userData.ring.material.opacity = 0.8 - ((performance.now() * 0.001) % 1) * 0.8;
  }
  const target = drivingCar ? drivingCar.position : playerGroup.position;
  if (target.distanceTo(missionMarker.position) < 3) {
    money += 100;
    updateMoney();
    beep(800, 0.1);
    beep(1200, 0.15);
    explode(missionMarker.position.x, 2, missionMarker.position.z, 0xffdd00, 20);
    showMessage('+100 💰 Миссия!', 1500);
    spawnMissionMarker();
  }
}

function updateRace(dt) {
  if (!raceActive) return;
  raceTime += dt;

  if (raceIndex < checkpoints.length) {
    // Пульсация текущего
    const cur = checkpoints[raceIndex];
    cur.scale.setScalar(1 + Math.sin(performance.now() * 0.005) * 0.1);
    if (cur.userData.ring) {
      cur.userData.ring.scale.setScalar(1 + (performance.now() * 0.001) % 0.5);
    }

    const target = drivingCar ? drivingCar.position : playerGroup.position;
    if (target.distanceTo(cur.position) < 4) {
      // Собрал!
      beep(1000, 0.1);
      explode(cur.position.x, 2, cur.position.z, 0x00ffff, 15);
      raceIndex++;

      if (raceIndex < checkpoints.length) {
        checkpoints.forEach((cp, i) => {
          cp.material.color.setHex(i === raceIndex ? 0x00ff88 : 0x005588);
          cp.userData.ring.material.color.setHex(i === raceIndex ? 0x00ff88 : 0x005588);
        });
        showMessage(`Чекпоинт ${raceIndex}/${checkpoints.length}`, 800);
      } else {
        // Финиш!
        raceActive = false;
        money += 500;
        updateMoney();
        wanted = Math.min(wanted + 1, 5);
        updateWanted();

        let msg = `🏆 Финиш! +500 💰 Время: ${raceTime.toFixed(1)}с`;
        if (raceTime < raceBest) {
          raceBest = raceTime;
          localStorage.setItem('raceBest', raceBest);
          msg = `🏆 НОВЫЙ РЕКОРД! ${raceTime.toFixed(1)}с`;
        }
        showMessage(msg, 3000);
        beep(800, 0.15);
        beep(1000, 0.15);
        beep(1200, 0.3);

        // Убираем чекпоинты
        setTimeout(() => {
          checkpoints.forEach(c => {
            if (c.userData.ring) scene.remove(c.userData.ring);
            scene.remove(c);
          });
          checkpoints.length = 0;
        }, 3000);
      }
    }
  }

  raceHud.style.display = 'block';
  raceHud.innerHTML = `🏁 ${raceIndex}/${checkpoints.length} | ⏱ ${raceTime.toFixed(1)}с | 🥇 ${raceBest < 999 ? raceBest.toFixed(1) + 'с' : '—'}`;
}

function updateWeather(dt) {
  // Погода — периодически дождь
  if (!window.weather) {
    window.weather = {
      particles: [],
      isRaining: false,
      timer: 30 + Math.random() * 30
    };
  }
  const w = window.weather;
  w.timer -= dt;

  if (w.timer <= 0) {
    w.isRaining = !w.isRaining;
    w.timer = w.isRaining ? 20 : 40 + Math.random() * 30;
    if (w.isRaining) showMessage('🌧️ Пошёл дождь', 1500);
  }

  if (w.isRaining) {
    // Создаём капли
    if (Math.random() < 0.5) {
      const rain = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 1, 4),
        new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.7 })
      );
      const target = drivingCar ? drivingCar.position : playerGroup.position;
      rain.position.set(
        target.x + (Math.random() - 0.5) * 60,
        30,
        target.z + (Math.random() - 0.5) * 60
      );
      rain.userData.vy = -25 - Math.random() * 10;
      scene.add(rain);
      w.particles.push(rain);
    }
    for (let i = w.particles.length - 1; i >= 0; i--) {
      const r = w.particles[i];
      r.position.y += r.userData.vy * dt;
      if (r.position.y < 0) {
        scene.remove(r);
        w.particles.splice(i, 1);
      }
    }

    // Затемнение неба
    scene.background = new THREE.Color(0x445566);
    scene.fog.color = new THREE.Color(0x445566);
  } else {
    if (!window.isNight) {
      scene.background = new THREE.Color(0x87CEEB);
      scene.fog.color = new THREE.Color(0x87CEEB);
    }
  }
}

function updateCamera(dt) {
  if (flyingHeli) {
    const camOffset = new THREE.Vector3(0, 8, -15);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), flyingHeli.userData.angle);
    const target = flyingHeli.position.clone().add(camOffset);
    camera.position.lerp(target, 0.1);
    camera.lookAt(flyingHeli.position);
  } else if (drivingCar) {
    const camOffset = new THREE.Vector3(0, 7, -11);
    camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), drivingCar.rotation.y);
    const target = drivingCar.position.clone().add(camOffset);
    camera.position.lerp(target, 0.12);
    camera.lookAt(drivingCar.position.clone().add(new THREE.Vector3(0, 1, 0)));
  } else {
    const offset = new THREE.Vector3(
      Math.sin(playerGroup.rotation.y) * -8,
      6.5,
      Math.cos(playerGroup.rotation.y) * -8
    );
    const target = playerGroup.position.clone().add(offset);
    camera.position.lerp(target, 0.1);
    camera.lookAt(playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0)));
  }
}

// ============ МИНИ-КАРТА ============
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');
const MM_SIZE = 220;

function drawMinimap() {
  mctx.clearRect(0, 0, MM_SIZE, MM_SIZE);
  mctx.fillStyle = 'rgba(0,40,0,0.7)';
  mctx.beginPath();
  mctx.arc(MM_SIZE / 2, MM_SIZE / 2, MM_SIZE / 2, 0, Math.PI * 2);
  mctx.fill();

  const scale = MM_SIZE / CITY_SIZE;
  const cx = MM_SIZE / 2;
  const cy = MM_SIZE / 2;
  const target = flyingHeli ? flyingHeli.position : (drivingCar ? drivingCar.position : playerGroup.position);

  mctx.fillStyle = 'rgba(150,150,170,0.6)';
  buildings.forEach(b => {
    const dx = (b.x - target.x) * scale;
    const dz = (b.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillRect(cx + dx - b.w * scale / 2, cy + dz - b.d * scale / 2, b.w * scale, b.d * scale);
    }
  });

  // Полиция
  mctx.fillStyle = '#ff0000';
  policeCars.forEach(pc => {
    if (pc === drivingCar) return;
    const dx = (pc.position.x - target.x) * scale;
    const dz = (pc.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 3, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Миссия
  if (missionMarker) {
    const dx = (missionMarker.position.x - target.x) * scale;
    const dz = (missionMarker.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = '#ffdd00';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 5, 0, Math.PI * 2);
      mctx.fill();
    }
  }

  // Чекпоинты гонки
  checkpoints.forEach((cp, i) => {
    const dx = (cp.position.x - target.x) * scale;
    const dz = (cp.position.z - target.z) * scale;
    if (Math.abs(dx) < MM_SIZE / 2 && Math.abs(dz) < MM_SIZE / 2) {
      mctx.fillStyle = i === raceIndex ? '#00ff88' : '#005588';
      mctx.beginPath();
      mctx.arc(cx + dx, cy + dz, 4, 0, Math.PI * 2);
      mctx.fill();
    }
  });

  // Игрок
  mctx.save();
  mctx.translate(cx, cy);
  const angle = flyingHeli ? flyingHeli.userData.angle : (drivingCar ? drivingCar.rotation.y : playerGroup.rotation.y);
  mctx.rotate(angle);
  mctx.fillStyle = '#4dff88';
  mctx.beginPath();
  mctx.moveTo(0, -8);
  mctx.lineTo(5, 6);
  mctx.lineTo(-5, 6);
  mctx.closePath();
  mctx.fill();
  mctx.restore();
}

// ============ КОНЕЦ ИГРЫ ============
function endGame(reason = 'Тебя поймала полиция!') {
  if (gameOver) return;
  gameOver = true;
  if (money > bestMoney) {
    bestMoney = money;
    localStorage.setItem('bestMoney', bestMoney);
  }
  document.getElementById('go-title').textContent = 'Игра окончена';
  document.getElementById('go-subtitle').textContent = reason;
  document.getElementById('final-money').textContent = money;
  document.getElementById('best-money').textContent = bestMoney;
  document.getElementById('gameover-modal').style.display = 'flex';
  beep(300, 0.5, 'sawtooth', 0.2);
}

window.resetGame = function() {
  money = 0;
  wanted = 0;
  gameOver = false;
  carSpeed = 0;
  drivingCar = null;
  flyingHeli = null;
  raceActive = false;
  updateMoney();
  updateWanted();
  playerGroup.position.set(5, 0, 5);
  playerGroup.visible = true;
  playerGroup.rotation.set(0, 0, 0);

  pedestrians.forEach(p => {
    p.userData.alive = true;
    p.visible = true;
    p.position.set((Math.random() - 0.5) * CITY_SIZE, 0, (Math.random() - 0.5) * CITY_SIZE);
  });

  policeCars.forEach(pc => {
    pc.position.set((Math.random() - 0.5) * CITY_SIZE, 0, (Math.random() - 0.5) * CITY_SIZE);
  });

  checkpoints.forEach(c => {
    if (c.userData.ring) scene.remove(c.userData.ring);
    scene.remove(c);
  });
  checkpoints.length = 0;
  raceHud.style.display = 'none';

  // Пули
  bullets.forEach(b => scene.remove(b));
  bullets.length = 0;
  enemyBullets.forEach(b => scene.remove(b));
  enemyBullets.length = 0;

  spawnMissionMarker();
  document.getElementById('gameover-modal').style.display = 'none';
};

document.getElementById('reset-btn').addEventListener('click', () => {
  if (confirm('Начать заново?')) resetGame();
});

// ============ АНИМАЦИЯ ============
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  if (gameOver) {
    renderer.render(scene, camera);
    return;
  }
  const dt = Math.min(clock.getDelta(), 0.05);

  updatePlayer(dt);
  updateCar(dt);
  updateHeli(dt);
  updatePolice(dt);
  updatePedestrians(dt);
  updateMission(dt);
  updateRace(dt);
  updateBullets(dt);
  updateParticles(dt);
  updateWeather(dt);
  updateCamera(dt);

  // Кнопки
  if (drivingCar) {
    actionBtn.style.display = 'flex';
    actionBtn.textContent = 'ВЫЙТИ';
    actionBtn.style.background = 'rgba(255,100,100,0.9)';
  } else if (nearestCar) {
    actionBtn.style.display = 'flex';
    actionBtn.textContent = 'СЕСТЬ';
    actionBtn.style.background = 'rgba(255,220,0,0.9)';
  } else {
    actionBtn.style.display = 'none';
  }

  // Кнопка стрельбы
  if (!drivingCar && !flyingHeli) {
    shootBtn.style.display = 'flex';
    crosshair.style.display = 'block';
  } else {
    shootBtn.style.display = 'none';
    crosshair.style.display = 'none';
  }

  // Кнопка вертолёта
  if (flyingHeli) {
    heliBtn.style.display = 'flex';
    heliBtn.innerHTML = '⬇️<br>СЕСТЬ';
    heliBtn.style.background = 'rgba(100,100,100,0.9)';
  } else {
    // Проверяем близость к вертолёту
    nearestHeli = null;
    let minD = 8;
    helis.forEach(h => {
      const d = h.position.distanceTo(playerGroup.position);
      if (d < minD) { minD = d; nearestHeli = h; }
    });
    if (nearestHeli) {
      heliBtn.style.display = 'flex';
      heliBtn.innerHTML = '🚁<br>СЕСТЬ';
      heliBtn.style.background = 'rgba(180,100,255,0.9)';
    } else {
      heliBtn.style.display = 'none';
    }
  }

  // Кнопка гонки
  raceBtn.style.display = raceActive ? 'none' : 'flex';

  // Поиск ближайшей машины
  if (!drivingCar) {
    let minD = 4.5;
    nearestCar = null;
    cars.forEach(c => {
      if (c === drivingCar) return;
      const d = c.position.distanceTo(playerGroup.position);
      if (d < minD) { minD = d; nearestCar = c; }
    });
  }

  if (frameCount % 2 === 0) drawMinimap();
  frameCount++;

  // Задача
  if (wanted > 0) {
    taskEl.textContent = '⚠️ Полиция ищет тебя!';
  } else if (raceActive) {
    taskEl.textContent = `🏁 Гонка: ${raceIndex}/${checkpoints.length}`;
  } else if (missionMarker) {
    const target = drivingCar ? drivingCar.position : playerGroup.position;
    taskEl.textContent = '🎯 Миссия: ' + Math.round(target.distanceTo(missionMarker.position)) + 'м';
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('reset-btn').style.display = 'flex';
  animate();
}, 600);
</script>
