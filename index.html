<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Mini-GTA v6.2 FIX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }

  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 0 2px 6px #000; pointer-events: none; z-index: 10; font-weight: 600; }
  #hud .money { color: #4dff88; }
  #hud .wanted { color: #ff4444; }
  #hud .task { background: rgba(0,0,0,0.55); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 400; max-width: 58vw; text-align: center; border-left: 3px solid #ffdd00; }
  #hud .stats { background: rgba(0,0,0,0.4); padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: 400; margin-top: 3px; }

  .action-btn { position: absolute; width: 70px; height: 70px; border-radius: 50%; display: none; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 10px; z-index: 20; border: 3px solid #fff; letter-spacing: 0.3px; color: #000; }
  #action-btn { bottom: 25px; right: 18px; background: rgba(255, 220, 0, 0.9); box-shadow: 0 0 20px rgba(255, 220, 0, 0.7); }
  #shoot-btn { bottom: 25px; right: 95px; background: rgba(255, 80, 80, 0.9); box-shadow: 0 0 20px rgba(255, 80, 80, 0.7); color: #fff; }
  #weapon-btn { bottom: 25px; right: 172px; background: rgba(80, 200, 80, 0.9); box-shadow: 0 0 20px rgba(80, 200, 80, 0.7); color: #fff; }
  #heli-btn { bottom: 100px; right: 18px; background: rgba(180, 100, 255, 0.9); box-shadow: 0 0 20px rgba(180, 100, 255, 0.7); color: #fff; }
  #boat-btn { bottom: 100px; right: 95px; background: rgba(0, 150, 200, 0.9); box-shadow: 0 0 20px rgba(0, 150, 200, 0.7); color: #fff; }
  #mission-btn { bottom: 100px; right: 172px; background: rgba(255, 220, 0, 0.9); box-shadow: 0 0 20px rgba(255, 220, 0, 0.7); }

  #buy-btn { bottom: 175px; right: 18px; background: rgba(255,150,50,0.95); display: none; }
  
  #exit-shop-btn { 
    position: absolute; top: 15%; left: 50%; transform: translateX(-50%); 
    background: rgba(200, 30, 30, 0.95); color: #fff; padding: 12px 30px; 
    border-radius: 12px; font-size: 16px; font-weight: bold; 
    display: none; z-index: 9999; border: 2px solid #fff; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); cursor: pointer; text-align: center;
  }

  #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 50%; z-index: 15; }
  #joystick-base { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); display: none; pointer-events: none; }
  #joystick-knob { position: absolute; width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.75); box-shadow: 0 0 15px rgba(255,255,255,0.7); display: none; pointer-events: none; }

  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #4dff88; font-size: 20px; background: #000; z-index: 100; }
  #loading .spinner { width: 60px; height: 60px; border: 4px solid rgba(77,255,136,0.3); border-top-color: #4dff88; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #message { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; font-weight: 800; text-shadow: 0 0 15px #000; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 30; text-align: center; white-space: nowrap; padding: 8px 16px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); }

  #shop-hint { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px #000; display: none; z-index: 30; pointer-events: none; text-align: center; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; border: 2px solid #ffaa00; }

  #minimap { position: absolute; top: 60px; right: 10px; width: 100px; height: 100px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); z-index: 12; box-shadow: 0 0 15px rgba(0,0,0,0.6); }

  #top-btns { position: absolute; top: 60px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 20; }
  .top-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.5); color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

  #fps-counter { position: absolute; top: 5px; right: 5px; color: #0f0; font-size: 11px; font-family: monospace; z-index: 999; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; border: 2px solid rgba(255,80,80,0.8); border-radius: 50%; display: none; z-index: 11; pointer-events: none; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Загружаем v6.2...</div>

<div id="hud" style="display:none">
  <div>💰 <span class="money" id="money">0</span><br>⭐ <span class="wanted" id="wanted" style="display:none">0</span><div class="stats" id="stats-hud">👤0 🚗0 🏚️0</div></div>
  <div><div class="task" id="task">Найди магазин</div></div>
</div>

<canvas id="minimap" width="200" height="200"></canvas>
<div id="top-btns">
  <div class="top-btn" id="reset-btn" style="display:none">↻</div>
</div>
<div id="crosshair"></div>
<div id="shop-hint"></div>
<div id="fps-counter">FPS: --</div>

<div id="joystick-zone" style="display:none">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="action-btn" class="action-btn">СЕСТЬ</div>
<div id="shoot-btn" class="action-btn">🔫</div>
<div id="weapon-btn" class="action-btn">СМЕНИТЬ</div>
<div id="heli-btn" class="action-btn">🚁<br>СЕСТЬ</div>
<div id="boat-btn" class="action-btn">🚤<br>СЕСТЬ</div>
<div id="mission-btn" class="action-btn">📜</div>
<div id="buy-btn" class="action-btn">КУПИТЬ</div>
<div id="exit-shop-btn">🚪 ВЫЙТИ</div>

<div id="message"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.3);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const CITY_SIZE = 200;
const RIVER_Y_START = -10;
const RIVER_Y_END = 10;
const BLOCK = 30;

const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: 0x3a5a3a }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 20), new THREE.MeshStandardMaterial({ color: 0x2a6aae, metalness: 0.5, roughness: 0.3, transparent: true, opacity: 0.85 }));
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.05, 0);
scene.add(water);

const buildings = [];
const buildingHealth = new Map();
const BUILDING_COLORS = [0x8899aa, 0xaa9988, 0x778899, 0x998877, 0xaaaabb, 0x9a8a7a, 0x8a9a8a];

function makeBuilding(x, z, w, d, h) {
  const color = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.1 }));
  mesh.position.set(x, h / 2, z); mesh.receiveShadow = true; scene.add(mesh);
  const data = { x, z, w, d, h, mesh };
  buildings.push(data); buildingHealth.set(mesh, 3); mesh.userData.buildingData = data;
}

function isRiver(x, z) { return z > RIVER_Y_START - 2 && z < RIVER_Y_END + 2; }

for (let bx = -CITY_SIZE / 2; bx < CITY_SIZE / 2; bx += BLOCK) {
  for (let bz = -CITY_SIZE / 2; bz < CITY_SIZE / 2; bz += BLOCK) {
    const qcx = bx + BLOCK / 2; const qcz = bz + BLOCK / 2;
    if (isRiver(qcx, qcz)) continue;
    if (Math.hypot(qcx - 80, qcz - 40) < 20) continue;

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, 10), roadMat);
    roadH.rotation.x = -Math.PI / 2; roadH.position.set(bx + BLOCK / 2, 0.01, bz); scene.add(roadH);
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, 10), roadMat);
    roadV.rotation.x = -Math.PI / 2; roadV.rotation.z = Math.PI / 2; roadV.position.set(bx, 0.01, bz + BLOCK / 2); scene.add(roadV);

    if (Math.random() < 0.6) {
      const w = 6 + Math.random() * 6; const d = 6 + Math.random() * 6; const h = 8 + Math.random() * 15;
      makeBuilding(qcx + (Math.random()-0.5)*10, qcz + (Math.random()-0.5)*10, w, d, h);
    }
  }
}

// МАГАЗИН
const shopBuilding = { x: 80, z: 40, w: 12, d: 12, h: 8 };
const shopMesh = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 12), new THREE.MeshStandardMaterial({ color: 0xffcc44, roughness: 0.8 }));
shopMesh.position.set(80, 4, 40); scene.add(shopMesh);
buildings.push(shopBuilding); buildingHealth.set(shopMesh, 999);
shopMesh.userData.isShop = true; shopMesh.userData.buildingData = shopBuilding;
const shopMarker = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.1, 12), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 }));
shopMarker.position.set(80, 0.1, 48); scene.add(shopMarker);

// ИНТЕРЬЕР
const shopInterior = new THREE.Group(); shopInterior.visible = false;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshStandardMaterial({ color: 0x8B7355 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = 0.05; shopInterior.add(floor);
const wallMat = new THREE.MeshStandardMaterial({ color: 0xddddaa, side: THREE.DoubleSide });
const wallBack = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), wallMat); wallBack.position.set(0, 3, -9); shopInterior.add(wallBack);
const wallLeft = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), wallMat); wallLeft.rotation.y = Math.PI / 2; wallLeft.position.set(-9, 3, 0); shopInterior.add(wallLeft);
const wallRight = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), wallMat); wallRight.rotation.y = -Math.PI / 2; wallRight.position.set(9, 3, 0); shopInterior.add(wallRight);
const shopLight = new THREE.PointLight(0xffffaa, 3, 25); shopLight.position.set(0, 5, 0); shopInterior.add(shopLight);
const counter = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 2), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
counter.position.set(0, 0.6, 0); shopInterior.add(counter);

const shopItems3D = [];
const shopGoods = [
  { id: 'rocket', name: '🚀 Ракетница', price: 1000, color: 0xff4444, x: -2.7 },
  { id: 'armor', name: '🛡️ Броня', price: 500, color: 0x4488ff, x: -0.9 },
  { id: 'health', name: '❤️ Аптечка', price: 200, color: 0xff44aa, x: 0.9 },
  { id: 'ammo', name: '🔫 Патроны', price: 100, color: 0xffdd44, x: 2.7 }
];
shopGoods.forEach(g => {
  const item = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: g.color, emissive: g.color, emissiveIntensity: 0.3 }));
  item.position.set(g.x, 1.65, 0); item.userData = g; shopInterior.add(item); shopItems3D.push(item);
});

// МОСТ
const bridge = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 26), new THREE.MeshStandardMaterial({ color: 0x888888 }));
bridge.position.set(0, 0.5, 0); scene.add(bridge);

// ИГРОК
const playerGroup = new THREE.Group();
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x2255cc }));
torso.position.y = 1.1; playerGroup.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
head.position.y = 2; playerGroup.add(head);
const gun = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 0.8), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9 }));
gun.position.set(0.5, 1.3, 0.3); playerGroup.add(gun);
const legs = [];
for (let i = 0; i < 2; i++) {
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1, 0.3), new THREE.MeshStandardMaterial({ color: 0x333344 }));
  leg.position.set(i === 0 ? -0.18 : 0.18, 0.5, 0); playerGroup.add(leg); legs.push(leg);
}
playerGroup.position.set(20, 0, 20); scene.add(playerGroup);

// МАШИНЫ
const cars = [];
function makeCar(x, z, color, isCop = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshStandardMaterial({ color }));
  body.position.y = 0.7; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x88ccff }));
  cabin.position.set(0, 1.3, -0.3); g.add(cabin);
  g.position.set(x, 0, z); g.rotation.y = Math.random() * Math.PI * 2;
  g.userData = { isCop };
  scene.add(g); cars.push(g); return g;
}
for (let i = 0; i < 15; i++) makeCar((Math.random()-0.5)*150, (Math.random()-0.5)*150, `hsl(${Math.random()*360}, 70%, 50%)`);
const cops = [];
for (let i = 0; i < 4; i++) cops.push(makeCar((Math.random()-0.5)*150, (Math.random()-0.5)*150, 0x111111, true));

// ВЕРТОЛЁТЫ
const helis = [];
function makeHeli(x, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(1.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0x333333 }));
  g.add(b);
  g.position.set(x, 8, z); scene.add(g); helis.push(g); return g;
}
makeHeli(30, 30); makeHeli(-30, 30);

const boat = new THREE.Group();
const bMesh = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
bMesh.position.y = 0.3; boat.add(bMesh);
boat.position.set(-30, 0.3, 0); scene.add(boat);

// ПЕШЕХОДЫ
const pedestrians = [];
function makePed(x, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.35), new THREE.MeshStandardMaterial({ color: `hsl(${Math.random()*360}, 50%, 50%)` }));
  body.position.y = 1; g.add(body);
  g.position.set(x, 0, z);
  g.userData = { angle: Math.random() * Math.PI * 2, speed: 1.5 };
  scene.add(g); pedestrians.push(g); return g;
}
for (let i = 0; i < 30; i++) makePed((Math.random()-0.5)*150, (Math.random()-0.5)*150);

// ОРУЖИЕ И СНАРЯДЫ
const bullets = [], grenades = [], rockets = [], particles = [];

let currentWeapon = 'pistol';
const weapons = {
  pistol: { name: 'Пистолет', ammo: -1, cooldown: 0.2, timer: 0 },
  grenade: { name: 'Граната', ammo: 5, cooldown: 1.0, timer: 0 },
  rocket: { name: 'Ракетница', ammo: 0, cooldown: 1.5, timer: 0 }
};

// ЛОГИКА
let money = parseInt(localStorage.getItem('gta_money') || '0');
let wanted = 0, gameOver = false;
let inventory = JSON.parse(localStorage.getItem('gta_inv') || '{"rocket": false, "armor": false}');
let inShop = false, nearShopItem = null;
let nearestCar = null, drivingCar = null, flyingHeli = null, ridingBoat = null;
let carSpeed = 0, walkCycle = 0;

const moneyEl = document.getElementById('money');
const wantedEl = document.getElementById('wanted');
const taskEl = document.getElementById('task');
const shopHint = document.getElementById('shop-hint');
const buyBtn = document.getElementById('buy-btn');
const exitShopBtn = document.getElementById('exit-shop-btn');

function updateMoney() { moneyEl.textContent = money; localStorage.setItem('gta_money', money); }
function showMsg(text) { const m = document.getElementById('message'); m.textContent = text; m.style.opacity = 1; clearTimeout(m._t); m._t = setTimeout(() => m.style.opacity = 0, 1500); }

function nextWeapon() {
  const list = ['pistol', 'grenade', 'rocket'].filter(w => w === 'pistol' || (w === 'grenade' && weapons.grenade.ammo > 0) || (w === 'rocket' && weapons.rocket.ammo > 0));
  let idx = list.indexOf(currentWeapon);
  if (idx === -1) idx = 0;
  currentWeapon = list[(idx + 1) % list.length];
  showMsg('Оружие: ' + weapons[currentWeapon].name);
}

window.buyWeapon = (id, price) => {
  if (money < price) { showMsg('Мало денег!'); return; }
  money -= price; updateMoney();
  if (id === 'rocket') { inventory.rocket = true; weapons.rocket.ammo += 2; }
  if (id === 'armor') inventory.armor = true;
  if (id === 'health') showMsg('Аптечка!');
  if (id === 'ammo') weapons.grenade.ammo += 3;
  localStorage.setItem('gta_inv', JSON.stringify(inventory));
  showMsg('Куплено!');
};

// УПРАВЛЕНИЕ
const joy = { active: false, x: 0, y: 0, startX: 0, startY: 0 };
const jz = document.getElementById('joystick-zone'), jb = document.getElementById('joystick-base'), jk = document.getElementById('joystick-knob');
jz.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; joy.active = true; joy.startX = t.clientX; joy.startY = t.clientY; jb.style.display = 'block'; jb.style.left = (t.clientX - 60) + 'px'; jb.style.top = (t.clientY - 60) + 'px'; jk.style.display = 'block'; jk.style.left = (t.clientX - 27) + 'px'; jk.style.top = (t.clientY - 27) + 'px'; }, { passive: false });
jz.addEventListener('touchmove', e => { e.preventDefault(); if (!joy.active) return; const t = e.touches[0]; let dx = t.clientX - joy.startX, dy = t.clientY - joy.startY; const d = Math.hypot(dx, dy); if (d > 60) { dx = dx/d*60; dy = dy/d*60; } joy.x = dx/60; joy.y = dy/60; jk.style.left = (joy.startX + dx - 27) + 'px'; jk.style.top = (joy.startY + dy - 27) + 'px'; }, { passive: false });
jz.addEventListener('touchend', e => { e.preventDefault(); joy.active = false; joy.x = 0; joy.y = 0; jb.style.display = 'none'; jk.style.display = 'none'; }, { passive: false });

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const actBtn = document.getElementById('action-btn'), shootBtn = document.getElementById('shoot-btn'), weapBtn = document.getElementById('weapon-btn');
function bind(b, fn) { b.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false }); b.addEventListener('click', e => { e.preventDefault(); fn(); }); }

bind(actBtn, doAction); bind(shootBtn, doShoot); bind(weapBtn, nextWeapon);
bind(document.getElementById('heli-btn'), () => {
  if (nearestHeli) { flyingHeli = nearestHeli; flyingHeli.position.y = 10; playerGroup.visible = false; showMsg('Взлёт'); }
  else if (flyingHeli) { flyingHeli.position.y = 1; playerGroup.position.set(flyingHeli.position.x, 0, flyingHeli.position.z + 3); playerGroup.visible = true; flyingHeli = null; showMsg('Приземлился'); }
});
bind(document.getElementById('boat-btn'), () => {
  if (ridingBoat) { ridingBoat = null; playerGroup.position.set(boat.position.x, 0, -15); playerGroup.visible = true; }
  else { ridingBoat = boat; playerGroup.visible = false; showMsg('Сел в лодку'); }
});
bind(document.getElementById('mission-btn'), () => showMsg('Миссии пока в разработке'));
bind(buyBtn, () => { if (nearShopItem) window.buyWeapon(nearShopItem.userData.id, nearShopItem.userData.price); });
exitShopBtn.onclick = (e) => { e.preventDefault(); exitShop(); };

function doAction() {
  if (inShop) return;
  if (drivingCar) { drivingCar = null; playerGroup.position.copy(drivingCar.position); playerGroup.position.x += 3; playerGroup.visible = true; showMsg('Вышел из машины'); }
  else if (nearestCar) { drivingCar = nearestCar; playerGroup.visible = false; showMsg('Сел в машину'); }
}

function doShoot() {
  if (inShop || flyingHeli || ridingBoat) return;
  const w = weapons[currentWeapon];
  if (w.timer > 0) return;
  if (w.ammo === 0) { showMsg('Нет патронов!'); return; }
  if (w.ammo > 0) w.ammo--;
  w.timer = w.cooldown;
  const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), playerGroup.rotation.y);
  const startPos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.3, 0));

  if (currentWeapon === 'pistol') {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(startPos); b.userData = { vx: fwd.x*80, vz: fwd.z*80, life: 1.0 }; scene.add(b); bullets.push(b);
  } else if (currentWeapon === 'grenade') {
    const g = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), new THREE.MeshStandardMaterial({ color: 0x226622 }));
    g.position.copy(startPos); g.userData = { vx: fwd.x*15, vy: 5, vz: fwd.z*15, fuse: 2.0 }; scene.add(g); grenades.push(g);
  } else if (currentWeapon === 'rocket') {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 6), new THREE.MeshStandardMaterial({ color: 0xff2222 }));
    r.rotation.x = Math.PI / 2; r.rotation.y = playerGroup.rotation.y; r.position.copy(startPos);
    r.userData = { vx: fwd.x*50, vz: fwd.z*50, life: 2.0 }; scene.add(r); rockets.push(r);
  }
}

// ВЗРЫВ (ИСПРАВЛЕН, БЕЗ УДАЛЕНИЯ ДОМОВ ИЗ МАССИВА)
function createExplosion(x, z, radius) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.8 }));
  p.position.set(x, 1, z); p.userData = { life: 0.5, max: 0.5, radius }; scene.add(p); particles.push(p);

  buildings.forEach(b => {
    if (b.isShop || buildingHealth.get(b.mesh) === 999) return;
    if (Math.hypot(b.x - x, b.z - z) < radius) {
      const hp = (buildingHealth.get(b.mesh) || 3) - 1;
      buildingHealth.set(b.mesh, hp);
      if (hp <= 0) { b.mesh.visible = false; money += 50; updateMoney(); }
    }
  });

  for (let i = pedestrians.length - 1; i >= 0; i--) {
    if (Math.hypot(pedestrians[i].position.x - x, pedestrians[i].position.z - z) < radius) {
      scene.remove(pedestrians[i]); pedestrians.splice(i, 1);
      wanted = Math.min(wanted + 1, 5); updateWanted();
    }
  }
  for (let i = cars.length - 1; i >= 0; i--) {
    if (Math.hypot(cars[i].position.x - x, cars[i].position.z - z) < radius) { scene.remove(cars[i]); cars.splice(i, 1); }
  }
  for (let i = cops.length - 1; i >= 0; i--) {
    if (Math.hypot(cops[i].position.x - x, cops[i].position.z - z) < radius) { scene.remove(cops[i]); cops.splice(i, 1); }
  }
}

function updateGrenades(dt) {
  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i];
    g.position.x += g.userData.vx * dt; g.position.z += g.userData.vz * dt; g.position.y += g.userData.vy * dt;
    g.userData.vy -= 20 * dt;
    if (g.position.y < 0.3) { g.position.y = 0.3; g.userData.vy *= -0.5; g.userData.vx *= 0.8; g.userData.vz *= 0.8; }
    g.userData.fuse -= dt;
    if (g.userData.fuse <= 0) { createExplosion(g.position.x, g.position.z, 6); scene.remove(g); grenades.splice(i, 1); }
  }
}

function updateRockets(dt) {
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.position.x += r.userData.vx * dt; r.position.z += r.userData.vz * dt; r.userData.life -= dt;
    let hit = false;
    for (const b of buildings) {
      if (buildingHealth.get(b.mesh) <= 0 || !b.mesh.visible) continue;
      if (Math.hypot(b.x - r.position.x, b.z - r.position.z) < b.w/2 + 1) { hit = true; break; }
    }
    if (hit || r.userData.life <= 0) { createExplosion(r.position.x, r.position.z, 5); scene.remove(r); rockets.splice(i, 1); }
  }
}

function updateBullets(dt) {
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.x += b.userData.vx * dt; b.position.z += b.userData.vz * dt; b.userData.life -= dt;
    let hit = false;
    for (let j = pedestrians.length - 1; j >= 0; j--) {
      if (b.position.distanceTo(pedestrians[j].position) < 1.5) {
        scene.remove(pedestrians[j]); pedestrians.splice(j, 1); hit = true;
        wanted = Math.min(wanted + 1, 5); updateWanted(); money += 10; updateMoney();
        break;
      }
    }
    if (hit || b.userData.life <= 0) { scene.remove(b); bullets.splice(i, 1); }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.life -= dt;
    p.scale.setScalar(1 + (1 - p.userData.life / p.userData.max) * p.userData.radius);
    p.material.opacity = p.userData.life / p.userData.max;
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  }
}

// ПРОСТЫЕ ФУНКЦИИ
function updateWanted() { if (wanted > 0) { wantedEl.style.display = 'inline'; wantedEl.textContent = '⭐'.repeat(Math.min(wanted, 5)); } else wantedEl.style.display = 'none'; }
function updateStats() { document.getElementById('stats-hud').textContent = `👤0 🚗0 🏚️0`; } // Заглушка

function updateShopLogic(dt) {
  if (!inShop) return;
  let dx = joy.x, dz = joy.y;
  if (keys['w'] || keys['arrowup']) dz = -1; if (keys['s'] || keys['arrowdown']) dz = 1; if (keys['a'] || keys['arrowleft']) dx = -1; if (keys['d'] || keys['arrowright']) dx = 1;
  const len = Math.hypot(dx, dz);
  if (len > 0.1) { dx /= len; dz /= len; playerGroup.position.x += dx * 4 * dt; playerGroup.position.z += dz * 4 * dt; playerGroup.position.x = Math.max(-8, Math.min(8, playerGroup.position.x)); playerGroup.position.z = Math.max(-7, Math.min(8, playerGroup.position.z)); playerGroup.rotation.y = Math.atan2(dx, dz); }
  playerGroup.visible = true;
  if (playerGroup.position.z < -6.5) { exitShop(); return; }
  nearShopItem = null; let minD = 3;
  for (let i = 0; i < shopItems3D.length; i++) { const d = shopItems3D[i].position.distanceTo(playerGroup.position); if (d < minD) { minD = d; nearShopItem = shopItems3D[i]; } }
  if (nearShopItem) { buyBtn.style.display = 'flex'; buyBtn.textContent = 'КУПИТЬ ' + nearShopItem.userData.price + '💰'; shopHint.style.display = 'block'; shopHint.innerHTML = nearShopItem.userData.name + '<br>' + nearShopItem.userData.price + ' 💰'; } else { buyBtn.style.display = 'none'; shopHint.style.display = 'none'; }
  exitShopBtn.style.display = 'flex';
}

function enterShop() {
  if (drivingCar || flyingHeli || ridingBoat || inShop) return;
  if (!scene.children.includes(shopInterior)) scene.add(shopInterior);
  inShop = true; shopInterior.visible = true; shopMesh.visible = false; shopMarker.visible = false;
  playerGroup.position.set(0, 0, 5); playerGroup.rotation.y = 0;
  showMsg('В магазине');
}

function exitShop() {
  if (!inShop) return;
  inShop = false; shopInterior.visible = false; shopMesh.visible = true; shopMarker.visible = true;
  playerGroup.position.set(shopBuilding.x, 0, shopBuilding.z + 15); playerGroup.visible = true;
  showMsg('Вышел из магазина');
}

function updatePlayer(dt) {
  if (inShop) return;
  if (!drivingCar && !flyingHeli && !ridingBoat) { const dxShop = playerGroup.position.x - 80; const dzShop = playerGroup.position.z - 48; if (Math.hypot(dxShop, dzShop) < 3) { enterShop(); return; } }
  let dx = joy.x, dz = joy.y;
  if (keys['w'] || keys['arrowup']) dz = -1; if (keys['s'] || keys['arrowdown']) dz = 1; if (keys['a'] || keys['arrowleft']) dx = -1; if (keys['d'] || keys['arrowright']) dx = 1;
  const len = Math.hypot(dx, dz);
  if (len > 0.1 && !drivingCar && !flyingHeli && !ridingBoat) {
    dx /= len; dz /= len; playerGroup.position.x += dx * 6 * dt; playerGroup.position.z += dz * 6 * dt;
    playerGroup.rotation.y = Math.atan2(dx, dz);
    walkCycle += dt * 10;
    legs[0].rotation.x = Math.sin(walkCycle) * 0.6; legs[1].rotation.x = -Math.sin(walkCycle) * 0.6;
  } else { legs[0].rotation.x *= 0.9; legs[1].rotation.x *= 0.9; }
  playerGroup.position.x = Math.max(-100, Math.min(100, playerGroup.position.x));
  playerGroup.position.z = Math.max(-100, Math.min(100, playerGroup.position.z));
}

function updateCar(dt) {
  if (!drivingCar) return;
  let th = -joy.y, st = joy.x;
  if (keys['w'] || keys['arrowup']) th = 1; if (keys['s'] || keys['arrowdown']) th = -1; if (keys['a'] || keys['arrowleft']) st = -1; if (keys['d'] || keys['arrowright']) st = 1;
  if (th > 0) carSpeed += 15 * dt; else if (th < 0) carSpeed -= 20 * dt; else carSpeed *= 0.95;
  carSpeed = Math.max(-10, Math.min(25, carSpeed));
  if (Math.abs(carSpeed) > 0.5) drivingCar.rotation.y -= st * 2 * dt * Math.sign(carSpeed);
  const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), drivingCar.rotation.y);
  drivingCar.position.x += fwd.x * carSpeed * dt; drivingCar.position.z += fwd.z * carSpeed * dt;
  playerGroup.position.copy(drivingCar.position);
}

function updatePedestrians(dt) {
  pedestrians.forEach(p => {
    p.position.x += Math.sin(p.userData.angle) * p.userData.speed * dt;
    p.position.z += Math.cos(p.userData.angle) * p.userData.speed * dt;
    p.rotation.y = p.userData.angle;
    if (Math.random() < 0.01) p.userData.angle += (Math.random() - 0.5);
    // Проверка на столкновение с машинами
    cars.forEach(c => {
      if (p.position.distanceTo(c.position) < 2) {
        p.userData.angle += Math.PI;
        p.position.x += Math.sin(p.userData.angle) * 2;
        p.position.z += Math.cos(p.userData.angle) * 2;
      }
    });
  });
}

function updateCamera(dt) {
  if (inShop) { camera.position.lerp(new THREE.Vector3(playerGroup.position.x, 4, playerGroup.position.z - 5), 0.15); camera.lookAt(playerGroup.position.x, 1.5, playerGroup.position.z); return; }
  if (drivingCar) { const camOff = new THREE.Vector3(0, 7, -11).applyAxisAngle(new THREE.Vector3(0,1,0), drivingCar.rotation.y); camera.position.lerp(drivingCar.position.clone().add(camOff), 0.12); camera.lookAt(drivingCar.position); }
  else { const offset = new THREE.Vector3(Math.sin(playerGroup.rotation.y) * -8, 6.5, Math.cos(playerGroup.rotation.y) * -8); camera.position.lerp(playerGroup.position.clone().add(offset), 0.1); camera.lookAt(playerGroup.position); }
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  if (gameOver) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePlayer(dt); updateShopLogic(dt); updateCar(dt); updateGrenades(dt); updateRockets(dt); updateBullets(dt); updateParticles(dt); updatePedestrians(dt); updateCamera(dt);

  if (!inShop) {
    exitShopBtn.style.display = 'none'; buyBtn.style.display = 'none'; shopHint.style.display = 'none';
    if (drivingCar) { actBtn.style.display = 'flex'; actBtn.textContent = 'ВЫЙТИ'; }
    else if (nearestCar) { actBtn.style.display = 'flex'; actBtn.textContent = 'СЕСТЬ'; }
    else actBtn.style.display = 'none';
    shootBtn.style.display = (!flyingHeli && !ridingBoat) ? 'flex' : 'none';
    weapBtn.style.display = (!flyingHeli && !ridingBoat) ? 'flex' : 'none';
  }
  if (!drivingCar && !inShop) { let minD = 5; nearestCar = null; cars.forEach(c => { const d = c.position.distanceTo(playerGroup.position); if (d < minD) { minD = d; nearestCar = c; } }); }

  renderer.render(scene, camera);
}

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('joystick-zone').style.display = 'block';
  document.getElementById('reset-btn').style.display = 'flex';
  document.getElementById('reset-btn').onclick = () => { localStorage.clear(); location.reload(); };
  animate();
}, 400);
</script>
</body>
</html>
