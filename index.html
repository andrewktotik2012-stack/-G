<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Mini-GTA 3D v6.2 ULTIMATE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, Arial, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; color: #fff; font-size: 14px; display: flex; justify-content: space-between; align-items: flex-start; text-shadow: 0 2px 6px #000; pointer-events: none; z-index: 10; font-weight: 600; }
  #hud .money { color: #4dff88; }
  #hud .wanted { color: #ff4444; }
  #hud .task { background: rgba(0,0,0,0.55); padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 400; max-width: 58vw; text-align: center; border-left: 3px solid #ffdd00; }

  .action-btn { position: absolute; width: 65px; height: 65px; border-radius: 50%; display: none; align-items: center; justify-content: center; text-align: center; font-weight: 800; font-size: 10px; z-index: 20; border: 2px solid #fff; letter-spacing: 0.3px; color: #000; }
  #action-btn { bottom: 25px; right: 18px; background: rgba(255, 220, 0, 0.9); }
  #shoot-btn { bottom: 25px; right: 90px; background: rgba(255, 80, 80, 0.9); color: #fff; }
  #weapon-btn { bottom: 95px; right: 18px; background: rgba(80, 200, 80, 0.9); color: #fff; }
  #heli-btn { bottom: 95px; right: 90px; background: rgba(180, 100, 255, 0.9); color: #fff; }
  #boat-btn { bottom: 165px; right: 18px; background: rgba(0, 150, 200, 0.9); color: #fff; }

  #joystick-zone { position: absolute; bottom: 0; left: 0; width: 50%; height: 50%; z-index: 15; }
  #joystick-base { position: absolute; width: 120px; height: 120px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); display: none; pointer-events: none; }
  #joystick-knob { position: absolute; width: 55px; height: 55px; border-radius: 50%; background: rgba(255,255,255,0.75); display: none; pointer-events: none; }

  #loading { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #4dff88; font-size: 20px; background: #000; z-index: 100; }
  #loading .spinner { width: 60px; height: 60px; border: 4px solid rgba(77,255,136,0.3); border-top-color: #4dff88; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #message { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); color: #fff; font-size: 16px; font-weight: 800; text-shadow: 0 0 15px #000; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 30; text-align: center; white-space: nowrap; padding: 8px 16px; background: rgba(0,0,0,0.5); border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); }

  #minimap { position: absolute; top: 60px; right: 10px; width: 100px; height: 100px; border-radius: 50%; border: 3px solid rgba(255,255,255,0.6); background: rgba(0,0,0,0.5); z-index: 12; }

  #shop-ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 2px solid #ffaa00; border-radius: 15px; padding: 15px; color: #fff; text-align: center; display: none; z-index: 40; width: 85%; max-width: 320px; max-height: 80vh; overflow-y: auto; }
  #shop-ui h2 { color: #ffaa00; margin-bottom: 10px; }
  .shop-btn { display: flex; justify-content: space-between; width: 100%; padding: 10px; margin: 4px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 5px; font-size: 13px; text-align: left; }
  .shop-btn:active { background: #555; }

  #fps-counter { position: absolute; top: 5px; right: 5px; color: #0f0; font-size: 11px; font-family: monospace; z-index: 999; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; }
  #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 30px; height: 30px; border: 2px solid rgba(255,80,80,0.8); border-radius: 50%; display: none; z-index: 11; pointer-events: none; }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div>Загрузка v6.2...</div>

<div id="hud" style="display:none">
  <div>💰 <span class="money" id="money">500</span><br>⭐ <span class="wanted" id="wanted" style="display:none">0</span></div>
  <div class="task" id="task">Найди магазин</div>
</div>

<canvas id="minimap" width="200" height="200"></canvas>
<div id="fps-counter">FPS: --</div>
<div id="crosshair"></div>

<div id="joystick-zone" style="display:none">
  <div id="joystick-base"></div>
  <div id="joystick-knob"></div>
</div>

<div id="action-btn" class="action-btn">СЕСТЬ</div>
<div id="shoot-btn" class="action-btn">🔫</div>
<div id="weapon-btn" class="action-btn">СМЕНИТЬ</div>
<div id="heli-btn" class="action-btn">🚁<br>СЕСТЬ</div>
<div id="boat-btn" class="action-btn">🚤<br>СЕСТЬ</div>

<div id="message"></div>

<div id="shop-ui">
  <h2>🏪 Оружейный магазин</h2>
  <button class="shop-btn" onclick="buyWeapon('mine', 300)">💣 Мина <span>300</span></button>
  <button class="shop-btn" onclick="buyWeapon('rocket', 1000)">🚀 Ракетница <span>1000</span></button>
  <button class="shop-btn" onclick="buyWeapon('auto', 1500)">🔫 Автомат <span>1500</span></button>
  <button class="shop-btn" onclick="buyWeapon('dynamite', 500)">🧨 Динамит <span>500</span></button>
  <button class="shop-btn" onclick="buyWeapon('health', 200)">❤️ Аптечка <span>200</span></button>
  <button class="shop-btn" onclick="closeShop()" style="background:#a00; justify-content:center; font-weight:bold; margin-top:10px;">🚪 ВЫЙТИ ИЗ МАГАЗИНА</button>
</div>

<script type="importmap">

<script type="module">
import * as THREE from 'three';

// ============ СЦЕНА ============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 60, 200);
const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ============ СВЕТ ============
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff4e6, 1.4);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun);

// ============ КОНСТАНТЫ ============
const CITY_SIZE = 240;
const RIVER_Y_START = -12;
const RIVER_Y_END = 12;
const BLOCK = 30;
const ISLAND_X = 100;
const ISLAND_Z = 0;
const ISLAND_R = 20;

// ============ МИР ============
const buildings = [];
const buildingHealth = new Map();
const trees = [];
const bears = [];

function makeBuilding(x, z, w, d, h, isShop = false, color = null) {
  const c = color || [0x8899aa, 0xaa9988, 0x778899, 0x998877][Math.floor(Math.random()*4)];
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: c, roughness: 0.85 }));
  mesh.position.set(x, h / 2, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh);
  
  // Окна снаружи
  const rows = Math.floor(h / 3);
  const cols = Math.floor(w / 2);
  for (let r = 1; r < rows; r++) {
    for (let cI = 0; cI < cols; cI++) {
      if (Math.random() > 0.4) {
        const win = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1), new THREE.MeshBasicMaterial({ color: 0xffee88 }));
        win.position.set(x - w/2 + 1.2 + cI*2, r*3, z + d/2 + 0.05);
        scene.add(win);
      }
    }
  }
  
  const data = { x, z, w, d, h, mesh, isShop };
  buildings.push(data);
  buildingHealth.set(mesh, isShop ? 999 : 3);
  mesh.userData.buildingData = data;
}

// Земля
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshStandardMaterial({ color: 0x3a5a3a }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Река
const water = new THREE.Mesh(new THREE.PlaneGeometry(600, 24), new THREE.MeshStandardMaterial({ color: 0x2a6aae, metalness: 0.7, roughness: 0.2, transparent: true, opacity: 0.85 }));
water.rotation.x = -Math.PI / 2;
water.position.set(0, 0.05, 0);
scene.add(water);

// Остров
const island = new THREE.Mesh(new THREE.CylinderGeometry(ISLAND_R, ISLAND_R, 1.5, 32), new THREE.MeshStandardMaterial({ color: 0xc2b280 }));
island.position.set(ISLAND_X, 0.75, ISLAND_Z);
island.castShadow = true; island.receiveShadow = true;
scene.add(island);

// Горы
[
  { x: -70, z: -85, h: 28, r: 12 },
  { x: -50, z: -85, h: 22, r: 10 },
  { x: -30, z: -85, h: 32, r: 14 }
].forEach(mp => {
  const mountain = new THREE.Mesh(new THREE.ConeGeometry(mp.r, mp.h, 6), new THREE.MeshStandardMaterial({ color: 0x666677, flatShading: true }));
  mountain.position.set(mp.x, mp.h / 2, mp.z);
  mountain.castShadow = true;
  scene.add(mountain);
  
  const snow = new THREE.Mesh(new THREE.ConeGeometry(mp.r*0.35, mp.h*0.3, 6), new THREE.MeshStandardMaterial({ color: 0xffffff }));
  snow.position.set(mp.x, mp.h*0.85, mp.z);
  scene.add(snow);
  
  const data = { x: mp.x, z: mp.z, w: mp.r*2, d: mp.r*2, h: mp.h, mesh: mountain, isMountain: true };
  buildings.push(data);
  buildingHealth.set(mountain, 999);
});

// Город
for (let bx = -CITY_SIZE/2; bx < CITY_SIZE/2; bx += BLOCK) {
  for (let bz = -CITY_SIZE/2; bz < CITY_SIZE/2; bz += BLOCK) {
    const qcx = bx + BLOCK/2, qcz = bz + BLOCK/2;
    if (Math.abs(qcz) < 18) continue;
    if (Math.hypot(qcx - ISLAND_X, qcz - ISLAND_Z) < ISLAND_R + 5) continue;
    if (qcx < -50 && qcz < -60) continue;
    if (qcx < -50 && qcz > 50) continue;

    const roadMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
    const roadH = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, 10), roadMat);
    roadH.rotation.x = -Math.PI / 2; roadH.position.set(bx + BLOCK/2, 0.01, bz); scene.add(roadH);
    const roadV = new THREE.Mesh(new THREE.PlaneGeometry(BLOCK, 10), roadMat);
    roadV.rotation.x = -Math.PI / 2; roadV.rotation.z = Math.PI / 2; roadV.position.set(bx, 0.01, bz + BLOCK/2); scene.add(roadV);

    if (Math.random() < 0.7) makeBuilding(qcx + (Math.random()-0.5)*10, qcz + (Math.random()-0.5)*10, 6 + Math.random()*6, 6 + Math.random()*6, 8 + Math.random()*20);
  }
}

// Лес
for (let i = 0; i < 30; i++) {
  const tx = -90 + Math.random()*40, tz = 70 + Math.random()*40;
  const tree = new THREE.Mesh(new THREE.ConeGeometry(1.5, 5, 6), new THREE.MeshStandardMaterial({ color: 0x1a5a1a }));
  tree.position.set(tx, 3.5, tz);
  tree.castShadow = true;
  scene.add(tree);
  trees.push({ x: tx, z: tz, r: 1.5 });
}

// Мосты
const b1 = new THREE.Mesh(new THREE.BoxGeometry(14, 1, 26), new THREE.MeshStandardMaterial({ color: 0x888888 }));
b1.position.set(0, 0.5, 0); scene.add(b1);
const b2 = new THREE.Mesh(new THREE.BoxGeometry(40, 1, 4), new THREE.MeshStandardMaterial({ color: 0x888888 }));
b2.position.set(ISLAND_X/2 + 30, 0.5, 0); scene.add(b2);

// Магазин
const shopBuilding = { x: 60, z: 30, w: 12, d: 12, h: 8 };
makeBuilding(60, 30, 12, 12, 8, true, 0xffcc44);
const shopMesh = buildings[buildings.length-1].mesh;
const shopMarker = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 0.1, 12), new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 }));
shopMarker.position.set(60, 0.1, 30 + 6 + 2);
scene.add(shopMarker);

// Интерьер
const shopInterior = new THREE.Group();
shopInterior.visible = false;
const intFloor = new THREE.Mesh(new THREE.PlaneGeometry(18, 18), new THREE.MeshStandardMaterial({ color: 0x8B7355 }));
intFloor.rotation.x = -Math.PI / 2; intFloor.position.y = 0.05; shopInterior.add(intFloor);
const intWallMat = new THREE.MeshStandardMaterial({ color: 0xddddaa, side: THREE.DoubleSide });
const intBack = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intBack.position.set(0, 3, -9); shopInterior.add(intBack);
const intLeft = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intLeft.rotation.y = Math.PI / 2; intLeft.position.set(-9, 3, 0); shopInterior.add(intLeft);
const intRight = new THREE.Mesh(new THREE.PlaneGeometry(18, 6), intWallMat); intRight.rotation.y = -Math.PI / 2; intRight.position.set(9, 3, 0); shopInterior.add(intRight);
const shopLight = new THREE.PointLight(0xffffaa, 3, 25); shopLight.position.set(0, 5, 0); shopInterior.add(shopLight);
const counter = new THREE.Mesh(new THREE.BoxGeometry(7, 1.2, 2), new THREE.MeshStandardMaterial({ color: 0x8B4513 }));
counter.position.set(0, 0.6, 0); shopInterior.add(counter);
const seller = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8), new THREE.MeshStandardMaterial({ color: 0x44aa44 }));
seller.position.set(0, 0.75, -3); shopInterior.add(seller);

const shopItems3D = [];
[
  { id: 'mine', name: '💣 Мина', price: 300, color: 0xff4444, x: -2.7 },
  { id: 'rocket', name: '🚀 Ракетница', price: 1000, color: 0xff8800, x: -0.9 },
  { id: 'auto', name: '🔫 Автомат', price: 1500, color: 0x44ff44, x: 0.9 },
  { id: 'dynamite', name: '🧨 Динамит', price: 500, color: 0xaa44ff, x: 2.7 },
  { id: 'health', name: '❤️ Аптечка', price: 200, color: 0xff44aa, x: 0, z: -1.5 }
].forEach((g) => {
  const item = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), new THREE.MeshStandardMaterial({ color: g.color, emissive: g.color, emissiveIntensity: 0.3 }));
  item.position.set(g.x, 1.65, g.z || 0);
  item.userData = g;
  shopInterior.add(item);
  shopItems3D.push(item);
});

// Лыжник и Медведи
const skier = new THREE.Group();
const skierBody = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1, 0.3), new THREE.MeshStandardMaterial({ color: 0x00ff00 }));
skierBody.position.y = 1; skier.add(skierBody);
const skis = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.1, 2), new THREE.MeshStandardMaterial({ color: 0xaaaaaa }));
skis.position.y = 0.1; skier.add(skis);
skier.position.set(-50, 0, -80); scene.add(skier);

function makeBear(x, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 8, 8), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
  body.scale.set(1, 1.2, 1.5); body.position.y = 0.9; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.5, 8, 8), new THREE.MeshStandardMaterial({ color: 0x4a2e15 }));
  head.position.set(0, 1.6, 0.8); g.add(head);
  g.position.set(x, 0, z);
  g.userData = { angle: Math.random()*Math.PI*2, speed: 2 };
  scene.add(g); bears.push(g);
}
for (let i = 0; i < 3; i++) makeBear(-80 + i*15, 80 + Math.random()*20);

// Игрок
const playerGroup = new THREE.Group();
const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.2, 0.4), new THREE.MeshStandardMaterial({ color: 0x2255cc }));
torso.position.y = 1.1; torso.castShadow = true; playerGroup.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
head.position.y = 2; head.castShadow = true; playerGroup.add(head);
const arms = []; const legs = [];
for (let i = 0; i < 2; i++) {
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.9, 0.28), new THREE.MeshStandardMaterial({ color: 0x2255cc }));
  arm.position.set(i === 0 ? -0.5 : 0.5, 1.3, 0); arm.castShadow = true; playerGroup.add(arm); arms.push(arm);
  const leg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1, 0.3), new THREE.MeshStandardMaterial({ color: 0x333344 }));
  leg.position.set(i === 0 ? -0.18 : 0.18, 0.5, 0); leg.castShadow = true; playerGroup.add(leg); legs.push(leg);
}
playerGroup.position.set(20, 0, 20); scene.add(playerGroup);

// Транспорт
const cars = [];
function makeCar(x, z, color, isCop = false) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4), new THREE.MeshStandardMaterial({ color, metalness: 0.6, roughness: 0.3 }));
  body.position.y = 0.7; body.castShadow = true; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.6, 2), new THREE.MeshStandardMaterial({ color: 0x88ccff, metalness: 0.9 }));
  cabin.position.set(0, 1.3, -0.3); g.add(cabin);
  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.25, 12);
  wheelGeo.rotateZ(Math.PI / 2);
  const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
  [[-1, 0.35, 1.2], [1, 0.35, 1.2], [-1, 0.35, -1.2], [1, 0.35, -1.2]].forEach(([wx, wy, wz]) => {
    const wheel = new THREE.Mesh(wheelGeo, wheelMat);
    wheel.position.set(wx, wy, wz); wheel.castShadow = true; g.add(wheel);
  });
  g.position.set(x, 0, z);
  g.rotation.y = Math.random() * Math.PI * 2;
  g.userData.isCop = isCop;
  scene.add(g); cars.push(g); return g;
}
for(let i=0; i<15; i++) makeCar((Math.random()-0.5)*180, (Math.random()-0.5)*180, `hsl(${Math.random()*360}, 70%, 50%)`);
const cops = [];
for(let i=0; i<4; i++) cops.push(makeCar((Math.random()-0.5)*180, (Math.random()-0.5)*180, 0x111111, true));

const helis = [];
function makeHeli(x, z) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 12), new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.7 }));
  b.scale.set(1.5, 1, 1.8); b.castShadow = true; g.add(b);
  const rot = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 0.3), new THREE.MeshStandardMaterial({ color: 0x888888 }));
  rot.position.y = 1.5; g.add(rot);
  g.position.set(x, 8, z);
  g.userData = { rot, angle: 0 };
  scene.add(g); helis.push(g); return g;
}
makeHeli(30, 30); makeHeli(-30, 30);

const copHeli = makeHeli(0, 0); copHeli.visible = false;

let boat = null;
function makeBoat() {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(2.5, 0.6, 5), new THREE.MeshStandardMaterial({ color: 0x8B4513, roughness: 0.8 }));
  b.position.y = 0.3; b.castShadow = true; g.add(b);
  g.position.set(-30, 0.3, 0);
  scene.add(g); boat = g; return g;
}
makeBoat();

const peds = [];
function makePed(x, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.35), new THREE.MeshStandardMaterial({ color: `hsl(${Math.random()*360}, 50%, 50%)` }));
  body.position.y = 1; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.27, 12, 12), new THREE.MeshStandardMaterial({ color: 0xffcc99 }));
  head.position.y = 1.75; head.castShadow = true; g.add(head);
  const l1 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.25), new THREE.MeshStandardMaterial({ color: 0x333344 }));
  l1.position.set(-0.15, 0.4, 0); g.add(l1);
  const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.8, 0.25), new THREE.MeshStandardMaterial({ color: 0x333344 }));
  l2.position.set(0.15, 0.4, 0); g.add(l2);
  g.position.set(x, 0, z);
  g.userData = { angle: Math.random()*Math.PI*2, speed: 1.5, l1, l2, cycle: 0 };
  scene.add(g); peds.push(g);
}
for (let i = 0; i < 30; i++) makePed((Math.random()-0.5)*180, (Math.random()-0.5)*180);

// Оружие и снаряды
const bullets = [], rockets = [], grenades = [], dynamites = [], mines = [], particles = [];
let currentWeapon = 'pistol';
const weapons = {
  pistol: { name: 'Пистолет', ammo: -1, cooldown: 0.2, timer: 0 },
  grenade: { name: 'Граната', ammo: 5, cooldown: 1.0, timer: 0 },
  mine: { name: 'Мина', ammo: 0, cooldown: 1.0, timer: 0 },
  rocket: { name: 'Ракетница', ammo: 0, cooldown: 1.5, timer: 0 },
  auto: { name: 'Автомат', ammo: 0, cooldown: 0.1, timer: 0 },
  dynamite: { name: 'Динамит', ammo: 0, cooldown: 1.0, timer: 0 }
};

// Логика
let money = 500, wanted = 0, gameOver = false, inShop = false, isSwimming = false;
let nearestCar = null, drivingCar = null, flyingHeli = null, ridingBoat = null;
let carSpeed = 0, boatSpeed = 0, walkCycle = 0;
const uiMoney = document.getElementById('money');
const uiWanted = document.getElementById('wanted');
const uiMsg = document.getElementById('message');
const shopUI = document.getElementById('shop-ui');

function updateMoney() { uiMoney.textContent = money; }
function showMsg(text) { uiMsg.textContent = text; uiMsg.style.opacity = 1; clearTimeout(uiMsg.t); uiMsg.t = setTimeout(() => uiMsg.style.opacity = 0, 1500); }

function nextWeapon() {
  const list = ['pistol', 'grenade', 'mine', 'rocket', 'auto', 'dynamite'].filter(w => w === 'pistol' || weapons[w].ammo > 0);
  let idx = list.indexOf(currentWeapon);
  if (idx === -1) idx = 0;
  currentWeapon = list[(idx + 1) % list.length];
  showMsg('Оружие: ' + weapons[currentWeapon].name);
}

window.buyWeapon = (id, price) => {
  if (money < price) { showMsg('Мало денег!'); return; }
  money -= price; updateMoney();
  if (id === 'health') showMsg('Здоровье восстановлено!');
  else { weapons[id].ammo += (id === 'auto' ? 100 : (id === 'grenade' ? 3 : 2)); showMsg('Куплено!'); }
};

window.closeShop = () => { 
  shopUI.style.display = 'none'; inShop = false; shopInterior.visible = false; shopMesh.visible = true; shopMarker.visible = true; 
  playerGroup.position.set(60, 0, 30 + 6 + 4); 
};

// Управление
const joy = { active: false, x: 0, y: 0, startX: 0, startY: 0 };
const jz = document.getElementById('joystick-zone'), jb = document.getElementById('joystick-base'), jk = document.getElementById('joystick-knob');
jz.addEventListener('touchstart', e => { e.preventDefault(); const t = e.touches[0]; joy.active = true; joy.startX = t.clientX; joy.startY = t.clientY; jb.style.display = 'block'; jb.style.left = (t.clientX - 60) + 'px'; jb.style.top = (t.clientY - 60) + 'px'; jk.style.display = 'block'; jk.style.left = (t.clientX - 27) + 'px'; jk.style.top = (t.clientY - 27) + 'px'; }, { passive: false });
jz.addEventListener('touchmove', e => { e.preventDefault(); if (!joy.active) return; const t = e.touches[0]; let dx = t.clientX - joy.startX, dy = t.clientY - joy.startY; const d = Math.hypot(dx, dy); if (d > 60) { dx = dx/d*60; dy = dy/d*60; } joy.x = dx/60; joy.y = dy/60; jk.style.left = (joy.startX + dx - 27) + 'px'; jk.style.top = (joy.startY + dy - 27) + 'px'; }, { passive: false });
jz.addEventListener('touchend', e => { e.preventDefault(); joy.active = false; joy.x = 0; joy.y = 0; jb.style.display = 'none'; jk.style.display = 'none'; }, { passive: false });

const keys = {};
window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

const actBtn = document.getElementById('action-btn'), shootBtn = document.getElementById('shoot-btn'), heliBtn = document.getElementById('heli-btn'), boatBtn = document.getElementById('boat-btn'), weapBtn = document.getElementById('weapon-btn');
function bind(b, fn) { b.addEventListener('touchstart', e => { e.preventDefault(); fn(); }, { passive: false }); b.addEventListener('click', e => { e.preventDefault(); fn(); }); }

bind(actBtn, () => {
  if (inShop) return;
  if (drivingCar) { drivingCar = null; playerGroup.visible = true; playerGroup.position.copy(drivingCar.position); playerGroup.position.x += 3; }
  else if (nearestCar) { drivingCar = nearestCar; playerGroup.visible = false; carSpeed = 0; showMsg('Сел в машину'); }
});
bind(heliBtn, () => {
  if (inShop) return;
  if (flyingHeli) { flyingHeli.position.y = 1; playerGroup.position.set(flyingHeli.position.x + 3, 0, flyingHeli.position.z); playerGroup.visible = true; flyingHeli = null; }
  else {
    let minD = 10; let n = null;
    helis.forEach(h => { const d = Math.hypot(h.position.x - playerGroup.position.x, h.position.z - playerGroup.position.z); if (d < minD) { minD = d; n = h; } });
    if (n) { flyingHeli = n; flyingHeli.position.y = 10; playerGroup.visible = false; showMsg('Взлёт'); }
  }
});
bind(boatBtn, () => {
  if (inShop) return;
  if (ridingBoat) { ridingBoat = null; playerGroup.position.set(boat.position.x, 0, -16); playerGroup.visible = true; }
  else if (boat) {
    const d = Math.hypot(boat.position.x - playerGroup.position.x, boat.position.z - playerGroup.position.z);
    if (d < 10) { ridingBoat = boat; playerGroup.visible = false; showMsg('Сел в лодку'); }
  }
});
bind(weapBtn, nextWeapon);

bind(shootBtn, () => {
  if (inShop || flyingHeli || weapons[currentWeapon].timer > 0) return;
  const w = weapons[currentWeapon];
  if (w.ammo === 0) { showMsg('Нет патронов!'); return; }
  if (w.ammo > 0) w.ammo--;
  w.timer = w.cooldown;

  const fwd = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), playerGroup.rotation.y);
  const startPos = playerGroup.position.clone().add(new THREE.Vector3(0, 1.3, 0));

  if (currentWeapon === 'pistol' || currentWeapon === 'auto') {
    const b = new THREE.Mesh(new THREE.SphereGeometry(0.15, 4, 4), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
    b.position.copy(startPos); b.userData = { vx: fwd.x*80, vz: fwd.z*80, life: 1.0 }; scene.add(b); bullets.push(b);
  } else if (currentWeapon === 'grenade') {
    const g = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), new THREE.MeshStandardMaterial({ color: 0x226622 }));
    g.position.copy(startPos); g.userData = { vx: fwd.x*20, vy: 5, vz: fwd.z*20, fuse: 2.0 }; scene.add(g); grenades.push(g);
  } else if (currentWeapon === 'rocket') {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.8, 6), new THREE.MeshStandardMaterial({ color: 0xff2222 }));
    r.rotation.x = Math.PI / 2; r.rotation.y = playerGroup.rotation.y; r.position.copy(startPos);
    r.userData = { vx: fwd.x*50, vz: fwd.z*50, life: 2.0 }; scene.add(r); rockets.push(r);
  } else if (currentWeapon === 'mine') {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.1, 8), new THREE.MeshStandardMaterial({ color: 0x888800 }));
    m.position.copy(playerGroup.position); m.position.y = 0.05; m.userData = { fuse: -1 }; scene.add(m); mines.push(m);
  } else if (currentWeapon === 'dynamite') {
    const d = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0xff0000 }));
    d.rotation.x = Math.PI / 2; d.rotation.y = playerGroup.rotation.y; d.position.copy(startPos);
    d.userData = { vx: fwd.x*15, vy: 3, vz: fwd.z*15, fuse: 3.0 }; scene.add(d); dynamites.push(d);
  }
});

function createExplosion(x, z, radius, damage) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.8 }));
  p.position.set(x, 1, z); p.userData = { life: 0.5, max: 0.5, radius }; scene.add(p); particles.push(p);

  buildings.forEach(b => {
    if (b.isShop || buildingHealth.get(b.mesh) === 999) return;
    if (Math.hypot(b.x - x, b.z - z) < radius + b.w/2) {
      const hp = (buildingHealth.get(b.mesh) || 3) - damage; buildingHealth.set(b.mesh, hp);
      if (hp <= 0) { b.mesh.visible = false; money += 50; updateMoney(); }
    }
  });

  for (let i = peds.length - 1; i >= 0; i--) {
    if (Math.hypot(peds[i].position.x - x, peds[i].position.z - z) < radius) {
      scene.remove(peds[i]); peds.splice(i, 1); wanted = Math.min(wanted + 1, 5); uiWanted.style.display = 'inline'; uiWanted.textContent = '⭐'.repeat(wanted);
    }
  }
  for (let i = cars.length - 1; i >= 0; i--) {
    if (Math.hypot(cars[i].position.x - x, cars[i].position.z - z) < radius) { scene.remove(cars[i]); cars.splice(i, 1); }
  }
  for (let i = cops.length - 1; i >= 0; i--) {
    if (Math.hypot(cops[i].position.x - x, cops[i].position.z - z) < radius) { scene.remove(cops[i]); cops.splice(i, 1); }
  }
  for (let i = bears.length - 1; i >= 0; i--) {
    if (Math.hypot(bears[i].position.x - x, bears[i].position.z - z) < radius) { scene.remove(bears[i]); bears.splice(i, 1); }
  }
  if (Math.hypot(playerGroup.position.x - x, playerGroup.position.z - z) < radius) { 
    gameOver = true; document.getElementById('hud').innerHTML = '<h1 style="color:red; text-align:center; margin-top:100px;">ВЫ ПОГИБЛИ</h1>'; 
  }
}

function collide(pos, rad) {
  for (const b of buildings) {
    const hp = buildingHealth.get(b.mesh) || 0;
    if (hp <= 0 || !b.mesh.visible) continue;
    if (pos.x > b.x - b.w/2 - rad && pos.x < b.x + b.w/2 + rad && pos.z > b.z - b.d/2 - rad && pos.z < b.z + b.d/2 + rad) {
      const ox = pos.x - b.x, oz = pos.z - b.z;
      if (Math.abs(ox) > Math.abs(oz)) pos.x = b.x + Math.sign(ox) * (b.w/2 + rad);
      else pos.z = b.z + Math.sign(oz) * (b.d/2 + rad);
      return true;
    }
  }
  for (const t of trees) {
    if (Math.hypot(pos.x - t.x, pos.z - t.z) < t.r + rad) {
      const angle = Math.atan2(pos.x - t.x, pos.z - t.z); pos.x = t.x + Math.sin(angle) * (t.r + rad); pos.z = t.z + Math.cos(angle) * (t.r + rad); return true;
    }
  }
  return false;
}

function isInRiver(x, z) {
  if (Math.abs(z) > 12) return false;
  if (Math.abs(x) < 7) return false;
  if (Math.abs(z) < 2 && x > 30 && x < 100) return false;
  return true;
}

// ============ ОБНОВЛЕНИЕ ИГРЫ ============
const clock = new THREE.Clock();
function update(dt) {
  if (gameOver) return;

  for (let w in weapons) if (weapons[w].timer > 0) weapons[w].timer -= dt;

  if (!inShop) {
    const dxS = playerGroup.position.x - 60, dzS = playerGroup.position.z - (30 + 6 + 2);
    if (Math.hypot(dxS, dzS) < 3 && !drivingCar && !flyingHeli && !ridingBoat) {
      inShop = true; shopInterior.visible = true; shopMesh.visible = false; shopMarker.visible = false;
      playerGroup.position.set(0, 0, 5); shopUI.style.display = 'block';
    }
  }

  let ix = joy.x, iz = joy.y;
  if (keys['w'] || keys['arrowup']) iz = -1;
  if (keys['s'] || keys['arrowdown']) iz = 1;
  if (keys['a'] || keys['arrowleft']) ix = -1;
  if (keys['d'] || keys['arrowright']) ix = 1;
  const len = Math.hypot(ix, iz);

  if (inShop) {
    if (len > 0.1) {
      ix /= len; iz /= len;
      playerGroup.position.x += ix * 4 * dt; playerGroup.position.z += iz * 4 * dt;
      playerGroup.position.x = Math.max(-8, Math.min(8, playerGroup.position.x));
      playerGroup.position.z = Math.max(-6, Math.min(8, playerGroup.position.z));
    }
  } else if (drivingCar) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    if (th > 0) carSpeed += 15 * dt; else if (th < 0) carSpeed -= 20 * dt; else carSpeed *= 0.95;
    carSpeed = Math.max(-10, Math.min(25, carSpeed));
    if (Math.abs(carSpeed) > 0.5) drivingCar.rotation.y -= st * 2 * dt * Math.sign(carSpeed);
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), drivingCar.rotation.y);
    const nx = drivingCar.position.x + fwd.x * carSpeed * dt, nz = drivingCar.position.z + fwd.z * carSpeed * dt;
    if (!isInRiver(nx, nz)) { drivingCar.position.x = nx; drivingCar.position.z = nz; }
    collide(drivingCar.position, 1.5);
    playerGroup.position.copy(drivingCar.position);
  } else if (flyingHeli) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    flyingHeli.position.y = Math.max(2, Math.min(50, flyingHeli.position.y + (keys['q']?10:keys['e']?-10:0)*dt));
    flyingHeli.userData.angle -= st * 1.5 * dt;
    flyingHeli.rotation.y = flyingHeli.userData.angle;
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), flyingHeli.userData.angle);
    const nx = flyingHeli.position.x + fwd.x * th * 25 * dt, nz = flyingHeli.position.z + fwd.z * th * 25 * dt;
    let hit = false;
    for (const b of buildings) {
      if (buildingHealth.get(b.mesh) <= 0 || !b.mesh.visible) continue;
      if (nx > b.x - b.w/2 - 2 && nx < b.x + b.w/2 + 2 && nz > b.z - b.d/2 - 2 && nz < b.z + b.d/2 + 2) {
        if (flyingHeli.position.y < b.h + 2) { hit = true; break; }
      }
    }
    if (!hit) { flyingHeli.position.x = nx; flyingHeli.position.z = nz; }
    playerGroup.position.copy(flyingHeli.position); playerGroup.position.y -= 3;
    flyingHeli.userData.rot.rotation.y += 20 * dt;
  } else if (ridingBoat) {
    let th = -joy.y, st = joy.x;
    if (keys['w'] || keys['arrowup']) th = 1;
    if (keys['s'] || keys['arrowdown']) th = -1;
    if (keys['a'] || keys['arrowleft']) st = -1;
    if (keys['d'] || keys['arrowright']) st = 1;
    if (th > 0) boatSpeed += 10 * dt; else if (th < 0) boatSpeed -= 10 * dt; else boatSpeed *= 0.95;
    boatSpeed = Math.max(-5, Math.min(15, boatSpeed));
    if (Math.abs(boatSpeed) > 0.5) boat.rotation.y -= st * 1.5 * dt * Math.sign(boatSpeed);
    const fwd = new THREE.Vector3(0,0,1).applyAxisAngle(new THREE.Vector3(0,1,0), boat.rotation.y);
    const nx = boat.position.x + fwd.x * boatSpeed * dt, nz = boat.position.z + fwd.z * boatSpeed * dt;
    if (!isInRiver(nx, nz)) { boat.position.x = nx; boat.position.z = nz; }
    playerGroup.position.copy(boat.position); playerGroup.position.y = 0;
  } else {
    const inWater = isInRiver(playerGroup.position.x, playerGroup.position.z);
    if (inWater !== isSwimming) isSwimming = inWater;
    if (len > 0.1) {
      ix /= len; iz /= len;
      const sp = isSwimming ? 3 : 6;
      const nx = playerGroup.position.x + ix * sp * dt, nz = playerGroup.position.z + iz * sp * dt;
      if (isSwimming || !isInRiver(nx, nz)) { playerGroup.position.x = nx; playerGroup.position.z = nz; }
      if (!isSwimming) collide(playerGroup.position, 0.5);
      playerGroup.rotation.y = Math.atan2(ix, iz);
      walkCycle += dt * 10;
      legs[0].rotation.x = Math.sin(walkCycle) * 0.6; legs[1].rotation.x = -Math.sin(walkCycle) * 0.6;
      arms[0].rotation.x = -Math.sin(walkCycle) * 0.4; arms[1].rotation.x = Math.sin(walkCycle) * 0.4;
    } else {
      legs[0].rotation.x *= 0.9; legs[1].rotation.x *= 0.9; arms[0].rotation.x *= 0.9; arms[1].rotation.x *= 0.9;
    }
    playerGroup.position.y = isSwimming ? -0.3 : 0;
  }

  // Снаряды
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.position.x += b.userData.vx * dt; b.position.z += b.userData.vz * dt; b.userData.life -= dt;
    let hit = false;
    for (let j = peds.length - 1; j >= 0; j--) {
      if (b.position.distanceTo(peds[j].position) < 1.5) { scene.remove(peds[j]); peds.splice(j, 1); hit = true; wanted = Math.min(wanted + 1, 5); uiWanted.style.display = 'inline'; uiWanted.textContent = '⭐'.repeat(wanted); break; }
    }
    if (!hit) {
      for (let j = bears.length - 1; j >= 0; j--) {
        if (b.position.distanceTo(bears[j].position) < 1.5) { scene.remove(bears[j]); bears.splice(j, 1); hit = true; break; }
      }
    }
    if (!hit) {
      for (let j = cops.length - 1; j >= 0; j--) {
        if (b.position.distanceTo(cops[j].position) < 2) { createExplosion(cops[j].position.x, cops[j].position.z, 1, 0); hit = true; break; }
      }
    }
    if (hit || b.userData.life <= 0) { scene.remove(b); bullets.splice(i, 1); }
  }

  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i]; r.position.x += r.userData.vx * dt; r.position.z += r.userData.vz * dt; r.userData.life -= dt;
    let hit = false;
    for (const b of buildings) {
      if (buildingHealth.get(b.mesh) <= 0 || !b.mesh.visible) continue;
      if (Math.hypot(b.x - r.position.x, b.z - r.position.z) < b.w/2 + 1) { hit = true; break; }
    }
    if (hit || r.userData.life <= 0) { createExplosion(r.position.x, r.position.z, 4, 2); scene.remove(r); rockets.splice(i, 1); }
  }

  for (let i = grenades.length - 1; i >= 0; i--) {
    const g = grenades[i]; g.position.x += g.userData.vx * dt; g.position.z += g.userData.vz * dt; g.position.y += g.userData.vy * dt; g.userData.vy -= 20 * dt;
    if (g.position.y < 0.3) { g.position.y = 0.3; g.userData.vy *= -0.5; g.userData.vx *= 0.8; g.userData.vz *= 0.8; }
    g.userData.fuse -= dt;
    if (g.userData.fuse <= 0) { createExplosion(g.position.x, g.position.z, 4, 1); scene.remove(g); grenades.splice(i, 1); }
  }

  for (let i = dynamites.length - 1; i >= 0; i--) {
    const d = dynamites[i]; d.position.x += d.userData.vx * dt; d.position.z += d.userData.vz * dt; d.position.y += d.userData.vy * dt; d.userData.vy -= 20 * dt;
    if (d.position.y < 0.3) { d.position.y = 0.3; d.userData.vy *= -0.5; }
    d.userData.fuse -= dt;
    if (d.userData.fuse <= 0) { createExplosion(d.position.x, d.position.z, 8, 3); scene.remove(d); dynamites.splice(i, 1); }
  }

  for (let i = mines.length - 1; i >= 0; i--) {
    const m = mines[i];
    if (m.userData.fuse === -1) {
      let triggered = false;
      if (Math.hypot(playerGroup.position.x - m.position.x, playerGroup.position.z - m.position.z) < 2) triggered = true;
      for (const c of cops) if (Math.hypot(c.position.x - m.position.x, c.position.z - m.position.z) < 2) triggered = true;
      for (const p of peds) if (Math.hypot(p.position.x - m.position.x, p.position.z - m.position.z) < 2) triggered = true;
      if (triggered) m.userData.fuse = 0.5;
    } else {
      m.userData.fuse -= dt;
      if (m.userData.fuse <= 0) { createExplosion(m.position.x, m.position.z, 5, 2); scene.remove(m); mines.splice(i, 1); }
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.userData.life -= dt; p.scale.setScalar(1 + (1 - p.userData.life / p.userData.max) * p.userData.radius); p.material.opacity = p.userData.life / p.userData.max;
    if (p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  }

  skier.position.z += 8 * dt; if (skier.position.z > -70) skier.position.z = -90;
  skier.position.x = -50 + Math.sin(skier.position.z * 0.1) * 10;

  bears.forEach(b => {
    b.position.x += Math.sin(b.userData.angle) * b.userData.speed * dt;
    b.position.z += Math.cos(b.userData.angle) * b.userData.speed * dt;
    b.rotation.y = b.userData.angle;
    if (b.position.x < -100 || b.position.x > -40) b.userData.angle += Math.PI;
    if (b.position.z < 60 || b.position.z > 110) b.userData.angle += Math.PI;
  });

  if (wanted > 0) {
    cops.forEach(c => {
      if (c === drivingCar) return;
      const dx = playerGroup.position.x - c.position.x, dz = playerGroup.position.z - c.position.z;
      c.rotation.y = Math.atan2(dx, dz);
      c.position.x += Math.sin(c.rotation.y) * 6 * dt; c.position.z += Math.cos(c.rotation.y) * 6 * dt;
      if (Math.hypot(dx, dz) < 4) { gameOver = true; document.getElementById('hud').innerHTML = '<h1 style="color:red; text-align:center; margin-top:100px;">АРЕСТ!</h1>'; }
    });
    copHeli.visible = true;
    const dx = playerGroup.position.x - copHeli.position.x, dz = playerGroup.position.z - copHeli.position.z;
    copHeli.position.x += dx * 0.5 * dt; copHeli.position.z += dz * 0.5 * dt;
    copHeli.position.y = 15 + Math.sin(performance.now()*0.002)*2;
    copHeli.rotation.y = Math.atan2(dx, dz);
    copHeli.userData.rot.rotation.y += 20 * dt;
    if (Math.hypot(dx, dz) < 5) { gameOver = true; document.getElementById('hud').innerHTML = '<h1 style="color:red; text-align:center; margin-top:100px;">АРЕСТ С ВОЗДУХА!</h1>'; }
  } else { copHeli.visible = false; }

  peds.forEach(p => {
    p.position.x += Math.sin(p.userData.angle) * p.userData.speed * dt;
    p.position.z += Math.cos(p.userData.angle) * p.userData.speed * dt;
    p.rotation.y = p.userData.angle;
    if (Math.random() < 0.01) p.userData.angle += (Math.random() - 0.5);
    if (collide(p.position, 0.5)) p.userData.angle += Math.PI;
    p.userData.cycle += dt * 10; p.userData.l1.rotation.x = Math.sin(p.userData.cycle) * 0.5; p.userData.l2.rotation.x = -Math.sin(p.userData.cycle) * 0.5;
  });

  let camOff = new THREE.Vector3(0, 7, -10);
  if (drivingCar) camOff.applyAxisAngle(new THREE.Vector3(0,1,0), drivingCar.rotation.y);
  else if (flyingHeli) camOff.applyAxisAngle(new THREE.Vector3(0,1,0), flyingHeli.userData.angle);
  else camOff.applyAxisAngle(new THREE.Vector3(0,1,0), playerGroup.rotation.y);
  camera.position.lerp(playerGroup.position.clone().add(camOff), 0.1);
  camera.lookAt(playerGroup.position);
}

// Мини-карта
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');
function drawMinimap() {
  mmCtx.clearRect(0, 0, 200, 200);
  mmCtx.fillStyle = 'rgba(0,40,0,0.7)'; mmCtx.beginPath(); mmCtx.arc(100, 100, 100, 0, Math.PI*2); mmCtx.fill();
  const scale = 200 / 240; const cx = 100, cy = 100;
  const target = flyingHeli ? flyingHeli.position : (drivingCar ? drivingCar.position : playerGroup.position);
  
  mmCtx.fillStyle = 'rgba(50,120,200,0.7)';
  mmCtx.fillRect(0, cy - 12*scale, 200, 24*scale);
  
  mmCtx.fillStyle = '#aaa'; mmCtx.fillRect(cx - 7*scale, cy - 13*scale, 14*scale, 26*scale);
  
  mmCtx.fillStyle = 'rgba(150,150,170,0.8)';
  buildings.forEach(b => { const dx = (b.x - target.x)*scale, dz = (b.z - target.z)*scale; if (Math.abs(dx) < 100 && Math.abs(dz) < 100) mmCtx.fillRect(cx + dx, cy + dz, 2, 2); });
  
  mmCtx.fillStyle = '#ffaa00'; mmCtx.beginPath(); mmCtx.arc(cx + (60 - target.x)*scale, cy + (30 - target.z)*scale, 4, 0, Math.PI*2); mmCtx.fill();
  
  mmCtx.fillStyle = '#ff0000';
  cops.forEach(c => { const dx = (c.position.x - target.x)*scale, dz = (c.position.z - target.z)*scale; if (Math.abs(dx) < 100 && Math.abs(dz) < 100) mmCtx.fillRect(cx + dx - 1, cy + dz - 1, 2, 2); });
  
  mmCtx.fillStyle = '#4dff88'; mmCtx.beginPath(); mmCtx.arc(cx, cy, 4, 0, Math.PI*2); mmCtx.fill();
}

// Анимация
let frames = 0, last = performance.now();
function animate() {
  requestAnimationFrame(animate);
  if (gameOver) { renderer.render(scene, camera); return; }
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  drawMinimap();

  if (!inShop) {
    actBtn.style.display = (nearestCar && !drivingCar) || drivingCar ? 'flex' : 'none';
    actBtn.textContent = drivingCar ? 'ВЫЙТИ' : 'СЕСТЬ';
    shootBtn.style.display = (!flyingHeli && !ridingBoat) ? 'flex' : 'none';
    weapBtn.style.display = (!flyingHeli && !ridingBoat) ? 'flex' : 'none';
    heliBtn.style.display = flyingHeli ? 'none' : 'flex';
    boatBtn.style.display = ridingBoat ? 'none' : 'flex';
    document.getElementById('crosshair').style.display = (!flyingHeli && !ridingBoat) ? 'block' : 'none';
  }

  if (!drivingCar && !inShop) {
    let minD = 5; nearestCar = null;
    cars.forEach(c => { const d = c.position.distanceTo(playerGroup.position); if (d < minD) { minD = d; nearestCar = c; } });
  }

  renderer.render(scene, camera);
  frames++;
  if (performance.now() - last > 1000) { document.getElementById('fps-counter').textContent = 'FPS: ' + frames; frames = 0; last = performance.now(); }
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hud').style.display = 'flex';
  document.getElementById('joystick-zone').style.display = 'block';
  animate();
}, 300);
</script>
